  <script type="text/babel">

    // ── Conversation Persistence (localStorage) ──
    const STORAGE_KEYS = {
      conversations: 'fu_conversations',
      activeId: 'fu_active_conversation',
      profile: 'fu_profile',
      appMode: 'fu_app_mode',
    };
    const MAX_CONVERSATIONS = 50;

    const generateId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    const loadFromStorage = (key, fallback) => {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    };

    const saveToStorage = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    };

    const loadConversations = () => loadFromStorage(STORAGE_KEYS.conversations, []);

    const saveConversation = (convo) => {
      const all = loadConversations();
      const idx = all.findIndex(c => c.id === convo.id);
      if (idx >= 0) all[idx] = convo;
      else all.unshift(convo);
      // Cap at MAX_CONVERSATIONS
      if (all.length > MAX_CONVERSATIONS) all.length = MAX_CONVERSATIONS;
      saveToStorage(STORAGE_KEYS.conversations, all);
    };

    const deleteConversation = (id) => {
      const all = loadConversations().filter(c => c.id !== id);
      saveToStorage(STORAGE_KEYS.conversations, all);
      return all;
    };

    const loadProfile = () => loadFromStorage(STORAGE_KEYS.profile, null);
    const saveProfile = (profile) => saveToStorage(STORAGE_KEYS.profile, profile);

    // ── Profile-based System Prompt Builder ──
    // Dispatches to the correct builder based on the user's selected mode.
    const buildSystemPrompt = (profile) => {
      if (profile?.mode === 'facilitator') return buildFacilitatorSystemPrompt(profile);
      return buildCoachSystemPrompt(profile);
    };

    const buildCoachSystemPrompt = (profile) => {
      const base = `You are the coach behind "Feel Understood" — a warm, knowledgeable, and encouraging conversation coach and practice buddy, operating in COACH MODE. You embody the teachings of "The Dialogue System," a comprehensive interpersonal communication framework developed from many years of research by Professor Gerard Egan and Andrew Bailey.

CRITICAL — YOU ARE IN COACH MODE:
You are having a one-on-one conversation with a single user who is here to improve their own communication and conversation skills. You are their teacher, trainer, and practice buddy. You are NOT facilitating between multiple people. Address the user directly ("you"). You can play the role of another person in role-play scenarios, but at all times you know you are coaching ONE individual.

YOUR CORE IDENTITY:
You are like a skilled communication mentor who has deeply internalized the Dialogue System. You help people understand and practice the art of effective two-way communication — dialogue — which is the Number 1 Skill of life. You believe that even small improvements in communication style can make a big difference to someone's relationships and quality of life.

THE DIALOGUE SYSTEM — YOUR SOURCE OF TRUTH:

1. TRUE DIALOGUE has four characteristics:
   - Turn-taking: Both people share the airtime
   - Connecting: What each person says connects with what the other said
   - Mutual influence: Give-and-take, open to being influenced
   - Co-creating: Together creating something new — the outcome emerges with uncertainty

2. THREE ROLES we switch between in every conversation:
   - EXPLAINER: When you have something to share (story, message, point of view, or case). Goal: be understood.
   - UNDERSTANDER: When your job is to understand the other person. Active, not passive.
   - CONVERSATION MANAGER: Looking after the well-being of the conversation itself.

3. EXPLAINER SKILLS:
   - Engage attention — don't assume the other person is tuned in
   - Headline and underline — name your topic clearly upfront
   - Provide context — set the scene with background
   - Fill in the picture using the right framework:
     * SAME for stories (Situation, Actions, Mental states, Experiences)
     * MRI for messages (Message, Reasons, Implications)
     * PRE for points of view (Point, Reasons, Evidence/Examples)
     * CRITIC for making a case (Case/Credibility, Reasons, Interests of stakeholders, Time to digest, your Interests, Compromise)
   - Bring things to life — be concrete and specific, use examples
   - Personalise appropriately — share yourself to build relationships
   - Welcome questions — treat them as opportunities, not interruptions
   - Check for understanding — provide summaries, look for clues

4. UNDERSTANDER SKILLS:
   - Visibly tune in — body language must show you are present
   - Listen actively with an open mind — avoid judgmental, filtered, stereotype-based, resistive, or interpretive listening
   - Identify highlights — the main points the Explainer is trying to get across
   - Feed back highlights — share your understanding in your own words (most important and underused skill)
   - Work to get the full picture — encourage flow, probe for clarity with open questions
   - Respond constructively — avoid instant advice, being judgmental, dismissing concerns, or hijacking
   - Summarise for mutual understanding

5. CONVERSATION MANAGER SKILLS:
   - Prepare for important conversations (purpose, main points, right frame of mind)
   - Share and negotiate purpose — avoid talking at cross-purposes
   - Manage flow and turn-taking — invite others in
   - Build on mutual respect — straight-across, not up-down conversations
   - Honour conversational rights — respect timing, boundaries, and the right to decline
   - Make emotions serve conversations — monitor emotional temperature, respond rather than react, count to ten
   - Read social undercurrents — use social intelligence, competence, and courage
   - Collaborate don't compete — aim for win-win, not win-lose
   - Repair conversations when your behavior is at fault — catch mistakes and fix them
   - Coach others to play better — help less-skilled partners engage in dialogue

6. THE SLIPPERY SLOPE (how misunderstandings escalate):
   Experience an incident → Give it your own spin → Make assumptions → Draw unwarranted conclusions → Act on the mess you've created

7. KEY PRINCIPLES:
   - Misunderstanding is the norm, not the exception
   - Take personal responsibility for the quality of your conversations
   - "Boredom is a self-indictment" — say "I'm letting myself be bored" not "I'm bored"
   - You always have a choice in how you respond
   - Better communication is for a better life

HOW YOU INTERACT:

Mode 1 — TEACHING: When the user wants to learn about communication concepts, explain them warmly using vivid examples from everyday life (like the book does). Reference the specific frameworks (SAME, MRI, PRE, CRITIC) and the three roles naturally.

Mode 2 — COACHING: When the user describes a real conversation challenge, help them analyze it through the lens of the three roles and relevant skills. Ask which role they were in. Help them see what went well and what could improve. Be specific and actionable.

Mode 3 — PRACTICE: When the user wants to practice, role-play conversations with them. You can play the "other person" in a scenario they describe. Afterward, give constructive feedback on their Explainer, Understander, or Conversation Manager skills. Suggest specific improvements.

Mode 4 — REFLECTION: Help users discover their own communication style — their "theme and variations." Ask about patterns across different relationships and settings. Help them identify strengths and growth areas.

VOICE & STYLE GUIDELINES:
- Keep responses conversational and concise — 2 to 4 sentences max since they will be spoken aloud.
- Be warm, encouraging, and practical — like a wise friend, not a lecturer.
- Use natural spoken language. Avoid bullet points, markdown, asterisks, or long paragraphs.
- Reference the system's concepts naturally (e.g., "That sounds like you were in the Understander role" or "A headline might help here").
- Ask one thoughtful follow-up question to keep the conversation going.
- When giving feedback, balance what went well with what could improve.
- Use the Dialogue System's own principles in YOUR conversation — model good dialogue by feeding back highlights, checking understanding, and showing genuine interest.
- Never be preachy or condescending. The book itself says "you don't always have to be nice" — be real and direct when needed, but always respectful.

SPOKEN vs SHOWN — TWO OUTPUT CHANNELS:
Everything you write is spoken aloud by a voice engine — except an optional visual section. Formatting characters get read out loud literally ("asterisk", "dash"), which sounds robotic, so your spoken text must be plain natural speech only.
When structure would genuinely help — a framework, a set of steps, options to compare — do NOT speak the list. Instead, after your spoken sentences, add a new line containing exactly [[VISUAL]] and put short markdown bullet points after it. That section is silently displayed on screen as a visual aid and never spoken. Refer to it naturally in your spoken text, e.g. "I've put the three roles on screen for you." Never say the marker, never describe the mechanics, and use the visual channel sparingly — only when seeing structure beats hearing it.`;

      if (!profile) return base;

      const goalMap = {
        learn: 'They chose "Take some lessons" — they want to develop enhanced communication skills through short, structured teaching sessions with you. Offer to start with a foundational concept (e.g. the three roles in every conversation) or a specific skill they are curious about.',
        helpline: 'They chose "Communication Helpline" — they have a specific aspect of themselves they wish was more visible to others, OR a particular conversation they want to plan or rehearse. Start by inviting them to choose: the aspect of themselves to explore, or a specific conversation to work through. Offer to role-play different approaches.',
      };

      const areaLabelMap = {
        home: 'home life',
        family: 'family of origin',
        friends: 'friendships and social life',
        work: 'work life',
        online: 'online spaces',
      };

      const blameMap = {
        them: 'When misunderstood, their instinct is to blame the other person. This is a sign of the Slippery Slope thinking — building a case against others. Gently help them try on personal responsibility as a more empowering frame.',
        mixed: 'When misunderstood, they share the blame — sometimes themselves, sometimes the other. This is realistic. Help them go deeper on the moments when it is on them.',
        me: 'When misunderstood, they take personal responsibility for making themselves understood. This is a mature, Dialogue-System-aligned mindset. Build on this strength.',
      };

      const aspectLabelMap = {
        values: 'their values and moral code',
        spiritual: 'their spiritual or religious side',
        sexuality: 'their sexuality or identity',
        health: 'their mental or physical health',
        finances: 'their money worries and ambitions',
        relationships: 'their relationship struggles',
        passions: 'their passions and deep interests',
        politics: 'their political views',
        creative: 'their creative or artistic side',
        ambition: 'their career goals and ambition',
        history: 'their past and where they come from',
        dreams: 'their dreams for the future',
      };

      const fu = profile.feelUnderstood || {};
      const areaEntries = Object.entries(fu.areas || {}).filter(([, v]) => typeof v === 'number');
      areaEntries.sort((a, b) => a[1] - b[1]);
      const leastArea = areaEntries[0] ? areaLabelMap[areaEntries[0][0]] : null;
      const leastAreaScore = areaEntries[0] ? areaEntries[0][1] : null;
      const areaRatingsText = areaEntries.map(([k, v]) => `${areaLabelMap[k] || k} ${v}/5`).join(', ') || 'none rated';
      const aspectsList = (fu.aspects || []).map(v => aspectLabelMap[v]).filter(Boolean);
      const aspectsText = aspectsList.length ? aspectsList.join('; ') : 'none named yet';

      // Beta onboarding skips the questionnaire entirely — don't tell the
      // model to reference answers that don't exist.
      const hasQuestionnaire = areaEntries.length > 0 || aspectsList.length > 0 || !!fu.blame;
      if (!hasQuestionnaire) {
        return base + `

USER PROFILE:
- Name: ${profile.name || 'friend'}
- Chosen path: ${goalMap[profile.goal] || 'general exploration of how to feel more understood'}

IMPORTANT: This user came straight to the conversation without filling in a questionnaire. In your very first message, warmly greet them by name and invite them directly into whatever conversation or situation matters to them right now. Use their name occasionally but not in every message.`;
      }

      const profileContext = `

USER PROFILE — FROM THEIR FEEL UNDERSTOOD QUESTIONNAIRE:
- Name: ${profile.name || 'friend'}
- Chosen path: ${goalMap[profile.goal] || 'general exploration of how to feel more understood'}
- Where they feel least understood (1 = poorly, 5 = well): ${areaRatingsText}${leastArea ? ` — their lowest is their ${leastArea} at ${leastAreaScore}/5` : ''}.
- Blame mindset when misunderstood: ${blameMap[fu.blame] || 'not yet clear — explore with them.'}
- Sides of themselves they feel are least recognised: ${aspectsText}.

IMPORTANT: This user just completed the Feel Understood questionnaire. The whole reason they are here is to feel more understood — model that first. In your very first message, warmly greet them by name, briefly reflect back that you have heard them (referencing their least-understood area OR one of the unseen aspects they named), and then offer the first concrete step that matches their chosen path. Do NOT simply launch into a lesson or advice — make them feel heard first. Use their name occasionally but not every message. Let their questionnaire answers surface naturally over the conversation — don't dump them all at once.`;

      return base + profileContext;
    };

    // ── Facilitator Mode System Prompt ──
    // The AI mediates a live conversation between TWO people.
    // Every user turn is prefixed with "<Name>:" so the AI knows who is speaking.
    const buildFacilitatorSystemPrompt = (profile) => {
      const relationshipMap = {
        partners: 'romantic partners or spouses — the stakes are deeply personal and emotional',
        family: 'family members — a bond with long history, established patterns, and love that can get tangled',
        friends: 'close friends — a chosen relationship where honesty and care have to co-exist',
        coworkers: 'colleagues or co-founders — a working relationship where clarity and respect are critical',
      };

      const focusMap = {
        understanding: 'They want to feel more understood by each other — surface highlights, reflect feelings, and help each person feed back what they heard.',
        conflict: 'They are working through a conflict or recurring friction — stay neutral, slow the pace, and use Slippery Slope language when you see spin or assumptions hardening.',
        planning: 'They are trying to make a decision or plan together — use Conversation Manager skills: share purpose, turn-taking, win-win collaboration.',
        connection: 'They want to reconnect and deepen their bond — invite personalisation, celebrate what works, and gently open space for softer truths.',
      };

      const toneMap = {
        gentle: 'Keep your tone very warm and gentle. Name feelings softly. Go slowly. Prioritise emotional safety over speed.',
        direct: 'Be warm but direct. Name what you see — including tension, avoidance, or spin — clearly and respectfully. Challenge both people equally.',
        balanced: 'Balance warmth with honesty. Be gentle on feelings, direct on patterns. Match the emotional temperature of the room.',
      };

      const relationshipCtx = relationshipMap[profile?.relationship] || 'two people who want to have a better conversation together';
      const focusCtx = focusMap[profile?.focus] || 'They want help having a better conversation together.';
      const toneCtx = toneMap[profile?.tone] || toneMap.balanced;

      return `You are the facilitator behind "Feel Understood" — a warm, skilled, neutral mediator operating in FACILITATOR MODE. You embody the teachings of "The Dialogue System" by Professor Gerard Egan and Andrew Bailey.

CRITICAL — YOU ARE IN FACILITATOR MODE:
You are facilitating a live conversation between TWO DIFFERENT PEOPLE who are speaking to you from the same device. You are a MEDIATOR, not a one-on-one coach. You must:

1. ALWAYS KNOW WHO IS SPEAKING. Every user message will be prefixed with the speaker's name followed by a colon, like "Sarah: I feel unheard when..." or "Mark: That's not what I said..." Pay close attention to this prefix. If a message arrives WITHOUT a clear name prefix, gently remind them: "Quick reminder — please start each turn with your name so I know who's speaking. Who said that?"

2. REMEMBER EACH PERSON AS A DISTINCT INDIVIDUAL. Build and maintain a mental model of each person separately:
   - Their name
   - What THEY have said — their perspective, feelings, concerns, hopes
   - What THEY seem to need from this conversation
   - Their communication style (are they the Explainer who jumps in? the Understander who goes quiet?)
   Never attribute one person's statement to the other. When you reflect back, always use their names: "Mark, what I'm hearing from you is..." or "Sarah, you said earlier..."

3. THE VERY FIRST THING YOU SAY is a warm welcome asking for their names. Your opening message must be exactly (or very close to): "Welcome, both of you. Before we begin — what are your names? And just so I can keep track, please start each of your turns with your name, like 'Sarah: ...' That way I always know who's speaking."

4. STAY SCRUPULOUSLY NEUTRAL. Never take sides. Never say one person is right or wrong. Give equal airtime. If one person is dominating, gently turn to the other: "Mark, we haven't heard from you on this — what's your take?" Use the Dialogue System principle of turn-taking actively.

5. FEED BACK HIGHLIGHTS BEFORE ANYTHING ELSE. When one person speaks, your most valuable tool is reflecting their highlights in your own words — then checking the other person heard them: "Mark, before you respond — can you tell Sarah what you heard her saying? Just the highlights." This is the most important and most underused skill in dialogue.

6. NAME THE SLIPPERY SLOPE WHEN YOU SEE IT. If you notice spin, assumptions, or unwarranted conclusions ("you always...", "you never...", "you clearly don't care"), gently name it: "That sounds like an assumption rather than something Sarah said — can we check it?"

7. MANAGE THE CONVERSATION. You are the Conversation Manager for both of them. Watch emotional temperature. Invite pauses. Ask one to speak while the other listens fully. Summarise mutual understanding before moving on. Model "responding rather than reacting."

8. PROTECT BOTH PEOPLE. If things get heated, slow it down. Count to ten out loud together if you must. Remind them they're on the same side of the table, working on the conversation together.

THE DIALOGUE SYSTEM (your source of truth):

TRUE DIALOGUE has four characteristics: turn-taking, connecting, mutual influence, co-creating.

THREE ROLES in every conversation:
- EXPLAINER: has something to share — goal is to be understood
- UNDERSTANDER: job is to understand the other — active, not passive
- CONVERSATION MANAGER: looks after the well-being of the conversation itself (that's primarily YOUR role here, but help them do it too)

EXPLAINER frameworks: SAME (Situation/Actions/Mental states/Experiences — for stories), MRI (Message/Reasons/Implications), PRE (Point/Reasons/Evidence), CRITIC (for making a case).

UNDERSTANDER skills: visibly tune in, listen with an open mind, identify highlights, FEED BACK HIGHLIGHTS in your own words (most underused skill), work to get the full picture, respond constructively, summarise.

SLIPPERY SLOPE: incident → your spin → assumptions → unwarranted conclusions → acting on the mess.

THIS PAIR — PERSONALISE YOUR FACILITATION:
- Relationship: ${relationshipCtx}
- Their focus today: ${focusCtx}
- Tone preference: ${toneCtx}

VOICE & STYLE:
- Keep responses SHORT — 2 to 4 sentences max. Your words will be spoken aloud. No bullets, no markdown.
- Use both names often. Make each person feel seen.
- Ask ONE clear question at a time. Never pile up questions.
- When it's one person's turn to listen, explicitly say so: "Sarah, just listen for a moment — Mark, tell her what you meant."
- Celebrate small wins: when one person feeds back well, say so.
- Model dialogue yourself: check understanding, invite, summarise.
- SPOKEN vs SHOWN: your text is spoken aloud, so never put lists or formatting in it. If structure would genuinely help (e.g. ground rules, a summary of both positions), add a new line containing exactly [[VISUAL]] followed by short markdown bullets — that section is silently shown on screen, never spoken. Refer to it naturally ("I've put both of your headlines on screen"). Use it sparingly.

Remember: you are holding space for two people to feel heard by each other. Your success is not giving advice — it is helping them give each other the gift of being understood.`;
    };

    const buildGreeting = (profile) => {
      if (profile?.mode === 'facilitator') return buildFacilitatorGreeting(profile);
      return buildCoachGreeting(profile);
    };

    const buildCoachGreeting = (profile) => {
      if (!profile) {
        return "Hey, welcome \u2014 I\u2019m your conversation coach. Think of someone important to you who you\u2019d like better conversations with \u2014 the kind where you both feel heard and understood. Who comes to mind, and what gets in the way?";
      }

      const name = profile.name || 'friend';

      return `Hi ${name}, I\u2019m really glad you\u2019re here. Think of someone important to you who you\u2019d like better conversations with \u2014 the kind where you both feel heard and understood. Who comes to mind, and what gets in the way?`;
    };

    const buildFacilitatorGreeting = (profile) => {
      return "Welcome, both of you. Before we begin — what are your names? And just so I can keep track, please start each of your turns with your name, like 'Sarah: ...' That way I always know who's speaking.";
    };

    // ── Quiz Data ──
    // The Feel Understood questionnaire. Based on the brief by the expert behind
    // "The Dialogue System" — designed to give the user an epiphany moment about
    // the importance of feeling understood. Three sections, each followed by a
    // reflection. At the end we offer three next-step paths that map onto the
    // two conversation modes (coach vs facilitator).

    const FU_AREA_LABELS = {
      home: 'home life',
      family: 'family of origin',
      friends: 'friendships and social life',
      work: 'work life',
      online: 'online spaces',
    };

    const FU_ASPECT_LABELS = {

      spiritual: 'your spiritual or religious side',
      sexuality: 'your sexuality or identity',
      health: 'your mental or physical health',
      finances: 'your money worries and ambitions',

    const FEEL_UNDERSTOOD_SCREENS = [

      {

    // The three next-step paths offered after the questionnaire. Each maps

    const NEXT_STEPS = [
      {
        id: 'lessons',
        label: 'Lessons',

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          const name = e?.name || '';
          if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            onError('not-allowed');
          } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            onError('no-mic');
          } else {
            onError(e?.message || 'mic-failed');
          }
          return;
        }
        streamRef.current = stream;

        const mime = pickMime();
        mimeRef.current = mime;
        let rec;
        try {
          rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        } catch (e) {
          cleanup();
          onError('recorder-failed');
          return;
        }
        recorderRef.current = rec;
        chunksRef.current = [];
        startedAtRef.current = Date.now();

        rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunksRef.current.push(e.data); };
        rec.onerror = () => onErrorRef.current && onErrorRef.current('recorder-failed');
        rec.onstop = async () => {
          const chunks = chunksRef.current;
          chunksRef.current = [];
          cleanup();

          const type = mimeRef.current || (chunks[0]?.type || 'audio/webm');
          const ext = /mp4|aac|m4a/.test(type) ? 'mp4' : 'webm';
          const blob = new Blob(chunks, { type });

          // Reject too-short recordings (under ~400ms of audio is usually a mis-tap)
          const duration = Date.now() - startedAtRef.current;
          if (blob.size < 1500 || duration < 400) {
            onFinalRef.current && onFinalRef.current('');
            return;
          }

          if (onProcessingRef.current) onProcessingRef.current();

          try {
            const fd = new FormData();
            fd.append('audio', blob, `audio.${ext}`);
            const res = await fetch('/api/stt', { method: 'POST', body: fd });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              onErrorRef.current && onErrorRef.current(err.error || 'stt-failed');
              return;
            }
            const data = await res.json();
            onFinalRef.current && onFinalRef.current((data.text || '').trim());
          } catch (e) {
            onErrorRef.current && onErrorRef.current(e?.message || 'stt-failed');
          }
        };

        // Silence detection so behavior matches the native SR path
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          const ctx = new AC();
          audioCtxRef.current = ctx;
          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 1024;
          source.connect(analyser);
          analyserRef.current = analyser;

          const buf = new Uint8Array(analyser.frequencyBinCount);
          // Match the native SR path: wait 2.2s of silence before auto-
          // stopping, so a pause to think doesn't end the turn too soon.
          const SILENCE_MS = 2200;
          const SPEECH_RMS = 0.02;
          const MIN_BEFORE_AUTOSTOP = 600;
          const MAX_RECORDING_MS = 60_000;
          let hasSpoken = false;
          let lastSpeechAt = Date.now();

          const tick = () => {
            if (!analyserRef.current) return;
            analyser.getByteTimeDomainData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) {
              const v = (buf[i] - 128) / 128;
              sum += v * v;
            }
            const rms = Math.sqrt(sum / buf.length);
            levelRef.current = rms;
            const now = Date.now();
            if (rms > SPEECH_RMS) {
              hasSpoken = true;
              lastSpeechAt = now;
            }
            // Hard cap on duration — prevents runaway recordings if the
            // user walks away with the mic open.
            if (now - startedAtRef.current > MAX_RECORDING_MS) {
              stop();
              return;
            }
            if (hasSpoken && now - startedAtRef.current > MIN_BEFORE_AUTOSTOP && now - lastSpeechAt > SILENCE_MS) {
              stop();
              return;
            }
            animRef.current = requestAnimationFrame(tick);
          };
          animRef.current = requestAnimationFrame(tick);
        } catch (e) {
          // Silence detection is best-effort — manual stop still works.
        }

        try { rec.start(); } catch (e) {
          cleanup();
          onError('recorder-failed');
        }
      };

      const stop = () => {
        const rec = recorderRef.current;
        if (rec && rec.state !== 'inactive') {
          try { rec.stop(); } catch (e) {}
        } else {
          cleanup();
          onFinalRef.current && onFinalRef.current('');
        }
      };

      const abort = () => {
        // Discard the recording without transcribing or firing onFinal —
        // used when the user switches to typing or leaves mid-listen.
        const rec = recorderRef.current;
        if (rec && rec.state !== 'inactive') {
          rec.ondataavailable = null;
          rec.onstop = () => { chunksRef.current = []; cleanup(); };
          try { rec.stop(); } catch (e) { cleanup(); }
        } else {
          cleanup();
        }
      };

      const getLevel = () => levelRef.current;

      return { start, stop, abort, supported, getLevel };
    };

    // ── Realtime Hands-Free STT (OpenAI Realtime API over WebRTC) ──
    //
    // The primary voice path. The browser opens a WebRTC session directly
    // to OpenAI's Realtime API (authorized by a short-lived client secret
    // minted by /api/realtime-session), streams mic audio continuously, and
    // receives live transcription events over the data channel:
    //
    //   input_audio_buffer.speech_started                → user began talking
    //                                                      (barge-in trigger)
    //   conversation.item.input_audio_transcription.delta → live interim text
    //   ...transcription.completed                        → finished turn
    //
    // Server-side VAD ends a turn after ~1.2s of silence (configured in
    // api/realtime-session.js) instead of the old 2.2s client debounce, and
    // the session stays open across turns — no tap-to-talk. Claude remains
    // the conversational brain; only the ears changed.
    //
    // If anything fails (endpoint not configured, SDP rejected, WebRTC
    // blocked, connection drops) the app falls back to the tap-to-talk
    // pipeline above for the rest of the visit.
    const useRealtimeSTT = () => {
      const pcRef = React.useRef(null);
      const dcRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const levelCtxRef = React.useRef(null);
      const levelAnimRef = React.useRef(null);
      const levelRef = React.useRef(0);
      const activeRef = React.useRef(false);

      const supported = typeof window !== 'undefined'
        && !!window.RTCPeerConnection
        && !!navigator.mediaDevices?.getUserMedia;

      const endSession = () => {
        activeRef.current = false;
        if (levelAnimRef.current) { cancelAnimationFrame(levelAnimRef.current); levelAnimRef.current = null; }
        if (levelCtxRef.current) { try { levelCtxRef.current.close(); } catch (e) {} levelCtxRef.current = null; }
        if (dcRef.current) { try { dcRef.current.close(); } catch (e) {} dcRef.current = null; }
        if (pcRef.current) { try { pcRef.current.close(); } catch (e) {} pcRef.current = null; }
        if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
        levelRef.current = 0;
      };

      React.useEffect(() => () => endSession(), []);

      const startSession = async ({ onInterim, onTurn, onSpeechStart, onError }) => {
        let stream;
        try {
          // Echo cancellation is what lets the mic stay open while TTS
          // plays without the assistant hearing itself.
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
        } catch (e) {
          const name = e?.name || '';
          if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            onError('not-allowed');
          } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            onError('no-mic');
          } else {
            onError('mic-failed');
          }
          return false;
        }
        streamRef.current = stream;

        try {
          const tokenRes = await fetch('/api/realtime-session', { method: 'POST' });
          if (!tokenRes.ok) throw new Error('mint-failed');
          const token = await tokenRes.json();
          if (!token.value) throw new Error('mint-failed');

          const pc = new RTCPeerConnection();
          pcRef.current = pc;
          stream.getTracks().forEach(t => pc.addTrack(t, stream));

          const dc = pc.createDataChannel('oai-events');
          dcRef.current = dc;
          let interim = '';
          dc.onmessage = (e) => {
            let msg;
            try { msg = JSON.parse(e.data); } catch (err) { return; }
            if (msg.type === 'input_audio_buffer.speech_started') {
              if (onSpeechStart) onSpeechStart();
            } else if (msg.type === 'conversation.item.input_audio_transcription.delta') {
              interim += msg.delta || '';
              if (interim.trim()) onInterim(interim.trim());
            } else if (msg.type === 'conversation.item.input_audio_transcription.completed') {
              interim = '';
              const text = (msg.transcript || '').trim();
              if (text) onTurn(text);
              else onInterim('');
            } else if (msg.type === 'error') {
              onError(msg.error?.message || 'realtime-error');
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          const sdpRes = await fetch('https://api.openai.com/v1/realtime/calls', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token.value}`,
              'Content-Type': 'application/sdp',
            },
            body: offer.sdp,
          });
          if (!sdpRes.ok) throw new Error('sdp-failed');
          const answerSdp = await sdpRes.text();
          await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

          await new Promise((resolve, reject) => {
            const t = setTimeout(() => reject(new Error('open-timeout')), 10000);
            dc.onopen = () => { clearTimeout(t); resolve(); };
            pc.onconnectionstatechange = () => {
              if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                clearTimeout(t);
                reject(new Error('connection-failed'));
              }
            };
          });

          // After setup, surface a dropped connection as an error so the
          // app can fall back instead of listening to a dead session.
          pc.onconnectionstatechange = () => {
            if (!activeRef.current) return;
            if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
              onError('connection-lost');
            }
          };

          // Mic level for the visualizer — same "we can hear you"
          // affordance as the Whisper path.
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            const ctx = new AC();
            levelCtxRef.current = ctx;
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 1024;
            ctx.createMediaStreamSource(stream).connect(analyser);
            const buf = new Uint8Array(analyser.frequencyBinCount);
            const tick = () => {
              if (!levelCtxRef.current) return;
              analyser.getByteTimeDomainData(buf);
              let sum = 0;
              for (let i = 0; i < buf.length; i++) {
                const v = (buf[i] - 128) / 128;
                sum += v * v;
              }
              levelRef.current = Math.sqrt(sum / buf.length);
              levelAnimRef.current = requestAnimationFrame(tick);
            };
            levelAnimRef.current = requestAnimationFrame(tick);
          } catch (e) { /* level meter is best-effort */ }

          activeRef.current = true;
          return true;
        } catch (e) {
          endSession();
          onError(e?.message === 'mint-failed' ? 'realtime-unavailable' : 'realtime-failed');
          return false;
        }
      };

      const isActive = () => activeRef.current;
      const getLevel = () => levelRef.current;

      return { supported, startSession, endSession, isActive, getLevel };
    };

    // ── Browser detection: which STT path to use ──
    //
    // iOS Chrome (CriOS) / Firefox (FxiOS) / Edge (EdgiOS) need the Whisper
    // fallback. iOS Safari and the home-screen PWA can use native SR.
    const needsRecorderFallback = () => {
      if (typeof window === 'undefined' || typeof navigator === 'undefined') return false;
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const hasNativeSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      const isStandalone = window.navigator.standalone === true
        || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      // PWA standalone on iOS: native SR works, prefer it (lower latency, free).
      if (isStandalone && hasNativeSR) return false;
      if (isIOS && /CriOS|FxiOS|EdgiOS/.test(ua)) return true;
      if (!hasNativeSR) return true;
      return false;
    };

    // ── TTS Audio (OpenAI TTS via Nova) ──
    //
    // iOS WebKit blocks HTMLAudioElement.play() unless called within the
    // synchronous callstack of a user gesture. The greeting works (called
    // from a short setTimeout after a tap) but streamed TTS responses
    // arrive seconds later after async fetch, well outside any gesture.
    //
    // AudioContext does NOT have this limitation. Once an AudioContext is
    // created and resumed during a user gesture, decodeAudioData() and
    // bufferSource.start() work freely without further gestures.
    //
    // Strategy:
    //   1. On first user tap → create + resume AudioContext
    //   2. Fetch TTS as ArrayBuffer
    //   3. Decode with decodeAudioData → play via BufferSource
    //   4. Fall back to HTMLAudioElement only if AudioContext unavailable

    let audioCtx = null;
    let audioCtxReady = false;

    // Called on every user interaction to ensure AudioContext is alive
    const ensureAudioContext = () => {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (audioCtx && audioCtx.state !== 'closed') {
          audioCtxReady = true;
        }
      } catch(e) {
        console.warn('AudioContext init failed:', e);
      }
    };

    // Listen on EVERY tap — AudioContext can get suspended by iOS at any time
    document.addEventListener('touchstart', ensureAudioContext, true);
    document.addEventListener('touchend', ensureAudioContext, true);
    document.addEventListener('click', ensureAudioContext, true);

    // Fetches TTS audio as ArrayBuffer. On failure, throws an Error whose
    // message contains the server's JSON error body so the real cause
    // (auth, quota, bad payload, etc.) is visible instead of swallowed.
    const fetchTTSBuffer = async (text, attempt = 0) => {
      let response;
      try {
        response = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: text, voice: 'shimmer' }),
        });
      } catch (netErr) {
        // Network blip — retry once before giving up.
        if (attempt === 0) {
          await new Promise(r => setTimeout(r, 300));
          return fetchTTSBuffer(text, 1);
        }
        throw netErr;
      }
      if (!response.ok) {
        // Transient failures — retry once. 429 = rate limit (back off a
        // little longer), 5xx = slow/cold upstream or our 8s abort. Don't
        // retry other 4xx (bad input / auth), where a retry can't help.
        if ((response.status === 429 || response.status >= 500) && attempt === 0) {
          await new Promise(r => setTimeout(r, response.status === 429 ? 700 : 300));
          return fetchTTSBuffer(text, 1);
        }
        let detail = '';
        try { detail = JSON.stringify(await response.json()); } catch(e) {}
        const msg = `TTS ${response.status}: ${detail || response.statusText}`;
        console.error(msg);
        throw new Error(msg);
      }
      return await response.arrayBuffer();
    };

    // Fetches TTS as a streaming PCM response. Mirrors fetchTTSBuffer's
    // retry policy — one retry on 429 (longer backoff), 5xx, or network
    // error. Without this, a single slow upstream call (our 8s 504) stalls
    // the sentence pipeline for its whole timeout and the phrase is lost;
    // with it, the retry usually lands in well under a second.
    const fetchPCMStream = async (text, attempt = 0) => {
      let response;
      try {
        response = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: text, voice: 'shimmer', format: 'pcm' }),
        });
      } catch (netErr) {
        if (attempt === 0) {
          await new Promise(r => setTimeout(r, 300));
          return fetchPCMStream(text, 1);
        }
        throw netErr;
      }
      if (!response.ok && (response.status === 429 || response.status >= 500) && attempt === 0) {
        await new Promise(r => setTimeout(r, response.status === 429 ? 700 : 300));
        return fetchPCMStream(text, 1);
      }
      return response;
    };

    // Plays an ArrayBuffer of audio through AudioContext (primary)
    // or falls back to HTMLAudioElement
    const playAudioBuffer = (arrayBuffer, audioRef) => {
      return new Promise(async (resolve) => {
        // Ensure context is resumed (may have been suspended during idle)
        if (audioCtx && audioCtx.state === 'suspended') {
          try { await audioCtx.resume(); } catch(e) {}
        }

        // ── Primary: AudioContext ──
        if (audioCtx && audioCtx.state === 'running') {
          try {
            // .slice(0) because decodeAudioData detaches the buffer
            const decoded = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
            const source = audioCtx.createBufferSource();
            source.buffer = decoded;
            source.connect(audioCtx.destination);
            audioRef.current = source;
            source.onended = () => { audioRef.current = null; resolve(); };
            source.start(0);
            return;
          } catch(e) {
            console.warn('AudioContext decode/play failed:', e);
          }
        }

        // ── Fallback: HTMLAudioElement ──
        try {
          const blob = new Blob([arrayBuffer], { type: 'audio/mpeg' });
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audio.setAttribute('playsinline', '');
          audioRef.current = audio;
          let done = false;
          const cleanup = () => {
            if (done) return;
            done = true;
            audio.onended = null;
            audio.onerror = null;
            URL.revokeObjectURL(url);
            audioRef.current = null;
            resolve();
          };
          audio.onended = cleanup;
          audio.onerror = cleanup;
          audio.play().catch(cleanup);
        } catch(e) {
          audioRef.current = null;
          resolve();
        }
      });
    };

    // Strip anything TTS would read aloud literally ("asterisk", "dash",
    // "hash") or stumble over. The visual channel keeps the formatting;
    // speech gets plain prose. Last line of defense behind the prompt.
    const sanitizeForSpeech = (text) => text
      .replace(/\[\[VISUAL\]\]/g, ' ')
      .replace(/[*_#`~]/g, '')
      .replace(/^\s*(?:[-•]|\d+[.)])\s+/gm, '')
      .replace(/\s{2,}/g, ' ')
      .trim();

    // Splits text into sentences for chunked TTS
    const splitSentences = (text) => {
      const parts = text.match(/[^.!?]+[.!?]+[\s]*/g);
      if (!parts) return [text];
      const result = [];
      for (const p of parts) {
        if (result.length > 0 && result[result.length - 1].length < 20) {
          result[result.length - 1] += p;
        } else {
          result.push(p);
        }
      }
      return result;
    };

    // Raw PCM (24kHz 16-bit signed mono LE) → AudioBuffer. Used by the
    // gapless streaming path, where audio plays as network chunks arrive.
    const PCM_RATE = 24000;
    const pcmToAudioBuffer = (bytes) => {
      const samples = bytes.byteLength >> 1;
      const buffer = audioCtx.createBuffer(1, samples, PCM_RATE);
      const ch = buffer.getChannelData(0);
      const view = new DataView(bytes.buffer, bytes.byteOffset, samples * 2);
      for (let i = 0; i < samples; i++) ch[i] = view.getInt16(i * 2, true) / 32768;
      return buffer;
    };

    const useSpeechSynthesis = () => {
      const audioRef = React.useRef(null);
      // Sources scheduled by the gapless PCM path that haven't ended yet —
      // cancel() must stop all of them, not just the current one.
      const liveSourcesRef = React.useRef(new Set());
      const cancelledRef = React.useRef(false);
      // Generation counter shared across all speakStreaming sessions. When a
      // new session starts it claims the next generation; older sessions
      // detect they're stale and bail. Without this, a fresh session
      // resetting cancelledRef would let a paused old loop resume playback
      // on top of the new audio — the "echo" bug.
      const streamGenRef = React.useRef(0);

      // Surfaced TTS error — read by the App to show a banner when TTS
      // fails, so the failure mode is "no audio + clear error" instead of
      // a robotic browser-voice fallback that silently masks the real bug.
      const lastErrorRef = React.useRef(null);
      const getLastError = () => lastErrorRef.current;

      const speak = async (text) => {
        cancelledRef.current = false;
        lastErrorRef.current = null;
        const sentences = splitSentences(text).map(sanitizeForSpeech).filter(Boolean);
        const ttsPromises = sentences.map(s => fetchTTSBuffer(s));
        for (let i = 0; i < sentences.length; i++) {
          if (cancelledRef.current) return;
          try {
            const buf = await ttsPromises[i];
            if (cancelledRef.current) return;
            await playAudioBuffer(buf, audioRef);
          } catch (err) {
            // One sentence failing must not silence the rest — record the
            // error (surfaced as a banner) and keep playing the remaining
            // sentences. No robotic browser-voice fallback; it masked bugs.
            console.error('TTS error:', err);
            lastErrorRef.current = err?.message || String(err);
          }
        }
      };

      const speakStreaming = () => {
        cancelledRef.current = false;
        lastErrorRef.current = null;
        const myGen = ++streamGenRef.current;
        const isStale = () => cancelledRef.current || myGen !== streamGenRef.current;
        let resolveFinished;
        let doneAdding = false;
        const finished = new Promise(r => { resolveFinished = r; });

        // ── Primary: gapless PCM streaming ──
        // Each sentence is fetched as raw PCM and spliced onto the
        // AudioContext timeline the moment bytes arrive: speech starts on
        // the first network chunk (not after the whole file is generated),
        // and consecutive chunks/sentences join without audible gaps.
        if (audioCtx && audioCtx.state === 'running') {
          const sentences = [];
          let nextStartTime = 0;
          let livePlaying = 0;
          let streaming = false;
          let streamIndex = 0;

          const maybeFinish = () => {
            if (isStale()) { resolveFinished(); return; }
            if (doneAdding && !streaming && streamIndex >= sentences.length && livePlaying === 0) {
              resolveFinished();
            }
          };

          const scheduleChunk = (audioBuffer) => {
            const src = audioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(audioCtx.destination);
            liveSourcesRef.current.add(src);
            livePlaying++;
            src.onended = () => {
              liveSourcesRef.current.delete(src);
              livePlaying--;
              maybeFinish();
            };
            // Butt each chunk up against the end of the previous one on the
            // context clock — this is what makes playback seamless.
            const at = Math.max(audioCtx.currentTime + 0.03, nextStartTime);
            src.start(at);
            nextStartTime = at + audioBuffer.duration;
          };

          const pump = async () => {
            if (streaming) return;
            streaming = true;
            while (streamIndex < sentences.length) {
              if (isStale()) break;
              try {
                const res = await sentences[streamIndex];
                if (!res.ok) throw new Error(`TTS ${res.status}`);
                const reader = res.body.getReader();
                let leftover = new Uint8Array(0);
                while (true) {
                  const { done, value } = await reader.read();
                  if (isStale()) { try { reader.cancel(); } catch (e) {} break; }
                  if (done) break;
                  let bytes = value;
                  if (leftover.length) {
                    const joined = new Uint8Array(leftover.length + value.length);
                    joined.set(leftover, 0);
                    joined.set(value, leftover.length);
                    bytes = joined;
                  }
                  // Only whole 16-bit samples; carry odd trailing byte over.
                  const usable = bytes.length & ~1;
                  leftover = bytes.subarray(usable);
                  if (usable >= 2) scheduleChunk(pcmToAudioBuffer(bytes.subarray(0, usable)));
                }
              } catch (e) {
                // One failed sentence must not silence the rest.
                console.error('Stream TTS chunk error:', e);
                lastErrorRef.current = e?.message || String(e);
              }
              streamIndex++;
            }
            streaming = false;
            maybeFinish();
          };

          return {
            addSentence: (sentence) => {
              if (isStale()) return;
              const clean = sanitizeForSpeech(sentence);
              if (!clean) return;
              // Fire the request immediately so generation of the next
              // sentence overlaps playback of the current one.
              sentences.push(fetchPCMStream(clean));
              pump();
            },
            finish: () => {
              doneAdding = true;
              maybeFinish();
              return finished;
            },
          };
        }

        // ── Fallback: buffered MP3 path (no running AudioContext) ──
        const queue = [];
        let playIndex = 0;
        let playing = false;

        const tryPlay = async () => {
          if (playing) return;
          playing = true;
          while (playIndex < queue.length) {
            if (isStale()) break;
            try {
              const buf = await queue[playIndex];
              if (isStale()) break;
              await playAudioBuffer(buf, audioRef);
            } catch (e) {
              console.error('Stream TTS chunk error:', e);
              lastErrorRef.current = e?.message || String(e);
            }
            playIndex++;
          }
          playing = false;
          // A cancelled/stale session must still resolve `finished` —
          // otherwise an interrupted sendToClaude awaits it forever.
          if (isStale() || (doneAdding && playIndex >= queue.length)) resolveFinished();
        };

        const addSentence = (sentence) => {
          if (isStale()) return;
          const clean = sanitizeForSpeech(sentence);
          if (!clean) return;
          queue.push(fetchTTSBuffer(clean));
          tryPlay();
        };

        const finish = () => {
          doneAdding = true;
          if (isStale() || playIndex >= queue.length) resolveFinished();
          else tryPlay();
          return finished;
        };

        return { addSentence, finish };
      };

      const cancel = () => {
        cancelledRef.current = true;
        // Stop every source the gapless path has scheduled, not just the
        // one currently audible — later chunks are already on the timeline.
        for (const src of liveSourcesRef.current) {
          try { src.stop(); } catch(e) {}
        }
        liveSourcesRef.current.clear();
        try {
          const ref = audioRef.current;
          if (ref && typeof ref.stop === 'function') ref.stop();       // BufferSource
          else if (ref && typeof ref.pause === 'function') ref.pause(); // HTMLAudioElement
        } catch(e) {}

        speechSynthesis.cancel();
      };

      return { speak, speakStreaming, cancel, getLastError };
    };

    // ── Typing Indicator ──
    const TypingIndicator = () => {
      return React.createElement('div', { className: 'msg-row assistant' },
        React.createElement('div', { className: 'avatar' },
              React.createElement('img', { src: '/images/icon-avatar.svg', alt: '', width: 20, height: 20, className: 'doodle-icon' })
            ),
        React.createElement('div', { className: 'bubble assistant-bubble typing-bubble' },
          ...[0, 1, 2].map(i =>
            React.createElement('div', {
              key: i,
              className: 'typing-dot',
              style: { animationDelay: `${i * 0.2}s` }
            })
          )
        )
      );
    };

    // ── Visual Aid ──
    // Renders the "shown, not spoken" channel of an assistant message — a
    // light markdown subset (bullets, numbered lists, **bold**) displayed
    // as a card under the spoken text. Structure for the eyes, prose for
    // the ears.
    const VisualAid = ({ text }) => {
      const blocks = [];
      let list = null;
      const flush = () => {
        if (list) { blocks.push({ type: 'list', items: list }); list = null; }
      };
      for (const raw of text.split('\n')) {
        const line = raw.trim();
        if (!line) { flush(); continue; }
        const m = line.match(/^(?:[-•*]|\d+[.)])\s+(.*)$/);
        if (m) {
          if (!list) list = [];
          list.push(m[1]);
        } else {
          flush();
          blocks.push({ type: 'p', text: line.replace(/^#+\s*/, '') });
        }

      const renderInline = (s) => {
        const parts = s.split(/\*\*(.+?)\*\*/g);
        return parts.map((p, i) => i % 2 ? React.createElement('strong', { key: i }, p) : p);
      };

      return React.createElement('div', { className: 'visual-aid' },
        blocks.map((b, i) => b.type === 'list'
          ? React.createElement('ul', { key: i },
              b.items.map((item, j) => React.createElement('li', { key: j }, renderInline(item))))
          : React.createElement('p', { key: i }, renderInline(b.text))

    };

    // ── Message Bubble ──
    const MessageBubble = ({ role, content, visual }) => {
      const isUser = role === 'user';
      return React.createElement('div', { className: `msg-row ${role}` },
        !isUser && React.createElement('div', { className: 'avatar' },
              React.createElement('img', { src: '/images/icon-avatar.svg', alt: '', width: 20, height: 20, className: 'doodle-icon' })
            ),

    };

    // ── Wave Visualizer ──
    //
    // Without getLevel: bars run a fixed CSS animation (used on the native SR
    // path where a live transcript already signals "we hear you").
    //
    // With getLevel: bars react to live mic RMS from the Whisper-path
    // analyser. This is the affordance that tells the user the mic is on
    // and picking them up — without it, recording feels dead.
    const WaveVisualizer = ({ getLevel }) => {
      const barRefs = React.useRef([]);
      React.useEffect(() => {
        if (!getLevel) return;
        let raf;
        let smoothed = 0;
        const animate = () => {
          // ~0.25 RMS is a normal speaking voice; scale to 0..1.
          const raw = Math.min(1, getLevel() / 0.25);
          // Asymmetric smoothing — snap up fast, decay slow — so the bars
          // feel responsive on each syllable but don't flicker.
          smoothed = raw > smoothed
            ? smoothed * 0.3 + raw * 0.7
            : smoothed * 0.85 + raw * 0.15;
          for (let i = 0; i < barRefs.current.length; i++) {
            const el = barRefs.current[i];
            if (!el) continue;
            // Slight per-bar phase so they don't all move in lockstep.
            const wobble = 0.75 + 0.25 * Math.sin(Date.now() / 180 + i * 0.9);
            const h = 4 + smoothed * 22 * wobble;
            el.style.height = h + 'px';

        };
        raf = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(raf);

        ...[0,1,2,3,4,5,6].map(i =>
          React.createElement('div', {
            key: i,
            ref: el => { barRefs.current[i] = el; },

    };

    // ── Main App ──
    const App = () => {
      // Restore persisted state on mount
      const savedProfile = React.useMemo(() => loadProfile(), []);
      const savedActiveId = React.useMemo(() => loadFromStorage(STORAGE_KEYS.activeId, null), []);
      const savedConvo = React.useMemo(() => {
        if (!savedActiveId) return null;
        return loadConversations().find(c => c.id === savedActiveId) || null;
      }, []);

      const [appMode, setAppMode] = React.useState(() => loadFromStorage(STORAGE_KEYS.appMode, null));
      // Synchronously detect whether a service worker is controlling this
      // page. If not (fresh install, cleared site data, manually
      // unregistered in DevTools), force the Beta gate on this load —
      // regardless of any persisted profile or conversation state. The SW
      // calls clients.claim() on activate, so for normal returning users
      // controller is non-null at first paint and we never override.
      const [forceGate, setForceGate] = React.useState(() => {
        try {
          return !!navigator.serviceWorker && !navigator.serviceWorker.controller;
        } catch { return false; }
      });
      const [started, setStarted] = React.useState(!!savedConvo);
      const [profile, setProfile] = React.useState(savedProfile);
      const [messages, setMessages] = React.useState(savedConvo ? savedConvo.messages : []);
      const [activeConvoId, setActiveConvoId] = React.useState(savedConvo ? savedConvo.id : null);
      const [showHistory, setShowHistory] = React.useState(false);
      const [conversations, setConversations] = React.useState(() => loadConversations());
      const [voiceState, setVoiceState] = React.useState('idle');
      const [interimText, setInterimText] = React.useState('');
      // True only on the Whisper path between "user stopped talking" and
      // "transcript arrived". Drives a user-side dots bubble so the user
      // sees their message is being processed (instead of the assistant
      // typing indicator, which is misleading at this stage).
      const [transcribing, setTranscribing] = React.useState(false);
      // Sticky banner shown when the user has denied mic permission, so
      // they understand why nothing happens on the next tap.
      const [micBlocked, setMicBlocked] = React.useState(false);
      const [textInput, setTextInput] = React.useState('');
      const [error, setError] = React.useState(null);
      const [theme, setTheme] = React.useState(() => {
        try { return localStorage.getItem('fu_theme') === 'dark' ? 'dark' : 'light'; }
        catch { return 'light'; }
      });
      const [showModeMenu, setShowModeMenu] = React.useState(false);
      const [showBasecamp, setShowBasecamp] = React.useState(false);
      const [showAbout, setShowAbout] = React.useState(false);
      const [showInsights, setShowInsights] = React.useState(false);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#ffffff');
        try { localStorage.setItem('fu_theme', theme); } catch {}
      }, [theme]);

      const toggleTheme = React.useCallback(() => {
        setTheme(t => t === 'dark' ? 'light' : 'dark');
      }, []);
      const chatEndRef = React.useRef(null);
      const messagesRef = React.useRef(messages);
      const profileRef = React.useRef(profile);
      const activeConvoIdRef = React.useRef(activeConvoId);
      const inputRef = React.useRef(null);
      const useRecorderFallback = React.useMemo(() => needsRecorderFallback(), []);
      const nativeSTT = useSpeechRecognition();
      const recorderSTT = useMediaRecorderSTT();
      const { start: startRec, stop: stopRec, abort: abortRec, supported: sttSupported } =
        useRecorderFallback ? recorderSTT : nativeSTT;
      const { speak, speakStreaming, cancel: cancelSpeak, getLastError: getTtsError } = useSpeechSynthesis();
      const realtime = useRealtimeSTT();
      // Hands-free realtime conversation: one tap opens a continuous
      // session; turns are detected server-side, and the user can barge in
      // while the assistant speaks. realtimeEnabledRef flips false after a
      // realtime failure so the rest of the visit uses tap-to-talk instead.
      const [handsFree, setHandsFree] = React.useState(false);
      const handsFreeRef = React.useRef(false);
      const realtimeEnabledRef = React.useRef(true);
      // Mirror of voiceState for realtime event callbacks, which outlive
      // any single render.
      const voiceStateRef = React.useRef('idle');
      React.useEffect(() => { voiceStateRef.current = voiceState; }, [voiceState]);
      // AbortController for the in-flight /api/chat-stream request. Aborted
      // when the user interrupts or starts a new turn, so a stale stream can
      // never keep writing into the conversation underneath the new one.
      const streamAbortRef = React.useRef(null);

      // Hard-stop everything voice-related: the in-flight reply stream, TTS
      // playback, and any open mic session (hands-free or tap-to-talk).
      const stopVoicePipeline = () => {
        if (handsFreeRef.current) {
          handsFreeRef.current = false;
          setHandsFree(false);
        }
        realtime.endSession();
        streamAbortRef.current?.abort();
        abortRec();
        cancelSpeak();
      };

      React.useEffect(() => { messagesRef.current = messages; }, [messages]);
      React.useEffect(() => { profileRef.current = profile; }, [profile]);
      React.useEffect(() => { activeConvoIdRef.current = activeConvoId; }, [activeConvoId]);

      React.useEffect(() => {
        if (!activeConvoIdRef.current || messages.length === 0) return;
        const convo = {
          id: activeConvoIdRef.current,
          title: messages.find(m => m.role === 'user')?.content.slice(0, 60) || 'New conversation',
          messages,
          updatedAt: Date.now(),
        };
        saveConversation(convo);
        saveToStorage(STORAGE_KEYS.activeId, activeConvoIdRef.current);
        setConversations(loadConversations());
      }, [messages]);

      React.useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, voiceState, interimText]);

      const startNewConversation = (msgs) => {
        const id = generateId();
        setActiveConvoId(id);
        activeConvoIdRef.current = id;
        setMessages(msgs);
        saveToStorage(STORAGE_KEYS.activeId, id);
      };

      const handleQuizComplete = (quizProfile) => {
        setProfile(quizProfile);
        profileRef.current = quizProfile;
        saveProfile(quizProfile);
        const greeting = buildGreeting(quizProfile);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setStarted(true);

        // The mic stays off until the user's first "Tap to talk" — the
        // greeting speaks, then one tap opens the hands-free session.

        // Speak the greeting through the gapless PCM path, sentence by
        // sentence, so audio starts on the first network chunk instead of
        // after the first full MP3 has been generated and downloaded.
        setVoiceState('speaking');
        const sp = speakStreaming();
        for (const s of splitSentences(greeting)) {
          const t = s.trim();
          if (t) sp.addSentence(t);
        }
        sp.finish().then(() => {

          // have barged in and already be mid-turn.

            ? (handsFreeRef.current ? 'listening' : 'idle')
            : v);
          const ttsErr = getTtsError();
          if (ttsErr) {
            setError(`Voice hiccup — a phrase was skipped (${ttsErr})`);
            setTimeout(() => setError(null), 6000);
          }
        });
      };

      const sendToClaude = async (userText) => {
        // A new turn supersedes any still-streaming previous one.
        streamAbortRef.current?.abort();
        const ac = new AbortController();
        streamAbortRef.current = ac;

        // In hands-free mode two user turns can arrive back-to-back (e.g. a
        // barge-in before any assistant text streamed). Merge them so the
        // history sent to the API keeps alternating roles.
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        const updated = last && last.role === 'user'
          ? [...prev.slice(0, -1), { role: 'user', content: `${last.content}\n${userText}` }]
          : [...prev, { role: 'user', content: userText }];
        setMessages(updated);
        setVoiceState('processing');
        setInterimText('');

        try {
          const response = await fetch('/api/chat-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system: buildSystemPrompt(profileRef.current),
              max_tokens: 500,
              // Reassemble both channels for the model so it remembers what
              // it displayed, not just what it said. Cap the history window:
              // sending the whole conversation makes Claude's first token
              // slower every single turn of a long session.
              messages: updated.slice(-24).map(m => ({
                role: m.role,
                content: m.visual ? `${m.content}\n[[VISUAL]]\n${m.visual}` : m.content,
              })),
            }),
            signal: ac.signal,
          });

          if (!response.ok) throw new Error('Stream request failed');

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullText = '';
          let sentenceBuffer = '';
          let streamSpeaker = null;
          let startedSpeaking = false;
          // Carry any incomplete trailing line between reads — a network
          // chunk can split a "data: {...}" line in half, and parsing each
          // half would drop that delta (lost words mid-reply).
          let lineBuffer = '';

          // Two-channel reply: text before [[VISUAL]] is spoken aloud; text
          // after it is shown on screen as a visual aid, never spoken.
          const VISUAL_MARKER = '[[VISUAL]]';
          // Chars of fullText already handed to the TTS sentence buffer.
          let spokenFed = 0;
          // How much of fullText is safely speakable: everything before the
          // marker — holding back any trailing partial marker so a chunk
          // ending in "[[VIS" never reaches TTS mid-stream.
          const speakableEnd = () => {
            const idx = fullText.indexOf(VISUAL_MARKER);
            if (idx !== -1) return idx;
            for (let k = VISUAL_MARKER.length - 1; k > 0; k--) {
              if (fullText.endsWith(VISUAL_MARKER.slice(0, k))) return fullText.length - k;
            }
            return fullText.length;
          };

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            lineBuffer += decoder.decode(value, { stream: true });
            const lines = lineBuffer.split('\n');
            lineBuffer = lines.pop() || '';

            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = line.slice(6).trim();
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                if (parsed.text) {
                  fullText += parsed.text;

                  // Split the channels for display as the reply streams in.
                  const markerIdx = fullText.indexOf(VISUAL_MARKER);
                  const spokenText = (markerIdx === -1 ? fullText : fullText.slice(0, markerIdx)).trim();
                  const visualText = markerIdx === -1 ? '' : fullText.slice(markerIdx + VISUAL_MARKER.length).trim();
                  setMessages([...updated, {
                    role: 'assistant',
                    content: spokenText,
                    ...(visualText ? { visual: visualText } : {}),
                  }]);

                  // Only the spoken channel feeds the TTS sentence buffer.
                  const end = speakableEnd();
                  if (end > spokenFed) {
                    sentenceBuffer += fullText.slice(spokenFed, end);
                    spokenFed = end;
                  }

                  // Aggressively fire TTS on any natural break point
                  // Priority 1: sentence endings (.!?)
                  // Priority 2: clause breaks (,;:—–) if buffer > 40 chars
                  // Priority 3: any content if buffer > 80 chars (force split at word boundary)
                  // First chunk uses lower thresholds so audio starts as
                  // quickly as possible. Later chunks are much looser: the
                  // PCM streaming path starts playing each sentence on its
                  // first network chunk, so we can afford whole sentences \u2014
                  // which sound far more natural than clause fragments.
                  const isFirstChunk = !streamSpeaker;
                  const clauseThreshold = isFirstChunk ? 12 : 80;
                  const forceThreshold = isFirstChunk ? 28 : 160;

                  let fireChunk = null;
                  const sentenceMatch = sentenceBuffer.match(/^([\s\S]*?[.!?])[\s]?/);
                  const clauseMatch = sentenceBuffer.length > clauseThreshold && sentenceBuffer.match(/^([\s\S]*?[,;:\u2014\u2013])[\s]?/);

                  if (sentenceMatch) {
                    fireChunk = sentenceMatch[1].trim();
                    sentenceBuffer = sentenceBuffer.slice(sentenceMatch[0].length);
                  } else if (clauseMatch) {
                    fireChunk = clauseMatch[1].trim();
                    sentenceBuffer = sentenceBuffer.slice(clauseMatch[0].length);
                  } else if (sentenceBuffer.length > forceThreshold) {
                    // Force split at last word boundary
                    const wordBreak = sentenceBuffer.lastIndexOf(' ', forceThreshold);
                    const splitAt = wordBreak > 15 ? wordBreak : forceThreshold;
                    fireChunk = sentenceBuffer.slice(0, splitAt).trim();
                    sentenceBuffer = sentenceBuffer.slice(splitAt);
                  }

                  if (fireChunk && fireChunk.length > 0) {
                    if (!streamSpeaker) {
                      streamSpeaker = speakStreaming();
                      setVoiceState('speaking');
                      startedSpeaking = true;
                    }
                    streamSpeaker.addSentence(fireChunk);
                  }
                }
              } catch (e) { /* skip */ }
            }
          }

          // Handle any remaining text that didn't end with punctuation
          const remaining = sentenceBuffer.trim();
          if (remaining.length > 0) {
            if (!streamSpeaker) {
              streamSpeaker = speakStreaming();
              setVoiceState('speaking');
              startedSpeaking = true;
            }
            streamSpeaker.addSentence(remaining);
          }

          // Wait for all audio to finish playing
          if (streamSpeaker) {
            await streamSpeaker.finish();
          }
          // Interrupted turns do their own state cleanup at the point of
          // interruption — don't fight whatever the user is doing now.
          if (ac.signal.aborted) return;
          if (streamSpeaker) {
            const ttsErr = getTtsError();
            if (ttsErr) {
              // Playback carried on around the failed phrase — say so,
              // rather than announcing total failure.
              setError(`Voice hiccup — a phrase was skipped (${ttsErr})`);
              setTimeout(() => setError(null), 6000);
            }
          }
          // Hands-free: the session is still open, go straight back to
          // listening for the next turn. Tap-to-talk: rest at idle.
          setVoiceState(v => (v === 'speaking' || v === 'processing')
            ? (handsFreeRef.current ? 'listening' : 'idle')
            : v);
        } catch (err) {
          if (ac.signal.aborted) return; // interrupted on purpose
          console.error('Error:', err);
          setError('Something went wrong. Tap to try again.');
          setVoiceState(v => (v === 'speaking' || v === 'processing')
            ? (handsFreeRef.current ? 'listening' : 'idle')
            : v);
          setTimeout(() => setError(null), 4000);
        }
      };

      // ── Hands-free conversation lifecycle (realtime path) ──
      //
      // The session must SELF-HEAL. On phones (especially the Android
      // Chrome home-screen PWA) the WebRTC connection routinely drops —
      // screen off, app switch, network blip, upstream session expiry.
      // Treating a drop as a one-strike fallback to tap-to-talk killed the
      // open mic and exposed Android's buggy native recognition; instead,
      // drops are rebuilt silently and the user keeps talking.
      const reconnectAttemptsRef = React.useRef(0);
      const reconnectingRef = React.useRef(false);
      const sessionStartedAtRef = React.useRef(0);
      const openSessionRef = React.useRef(null);

      // Rotate a long-lived session at a quiet moment (right after the
      // user's turn was captured, while Claude is thinking and the mic
      // isn't needed) — a controlled rebuild here beats an uncontrolled
      // drop mid-sentence later.
      const SESSION_ROTATE_MS = 8 * 60 * 1000;

      const cycleRealtimeSession = async () => {
        if (!handsFreeRef.current || reconnectingRef.current) return;
        reconnectingRef.current = true;
        realtime.endSession();
        await openSessionRef.current().catch(() => false);
        reconnectingRef.current = false;
      };

      const handleRealtimeError = async (err) => {
        if (!handsFreeRef.current) return;
        const blocked = err === 'not-allowed';
        // Failures that retrying can't help: permission, no hardware, or
        // the realtime path being unavailable at setup.
        const hardFailure = blocked || err === 'no-mic' || err === 'mic-failed'
          || err === 'realtime-unavailable' || err === 'realtime-failed';

        if (!hardFailure) {
          // The session was up and dropped. If we're backgrounded, don't
          // rebuild into a hidden tab — the visibility handler below does
          // it the moment the app comes back.
          if (document.visibilityState === 'hidden') {
            realtime.endSession();
            return;
          }
          if (reconnectingRef.current) return;
          if (reconnectAttemptsRef.current < 3) {
            reconnectAttemptsRef.current++;
            reconnectingRef.current = true;
            realtime.endSession();
            const ok = await openSessionRef.current().catch(() => false);
            reconnectingRef.current = false;
            // On failure the attempt's own onError ran the fallback path
            // (it reports a hard setup failure); nothing more to do here.
            return;
          }
        }

        // Unrecoverable: tear down and fall back.
        handsFreeRef.current = false;
        setHandsFree(false);
        realtime.endSession();
        if (blocked) {
          setMicBlocked(true);
          setError('Microphone blocked. Tap the lock/site icon in the address bar to allow it, then try again.');
        } else if (err === 'no-mic') {
          setError('No microphone detected on this device.');
          setTimeout(() => setError(null), 6000);
        } else {
          realtimeEnabledRef.current = false;
          setError('Hands-free voice unavailable — using tap-to-talk instead.');
          setTimeout(() => setError(null), 6000);
        }
        setInterimText('');
        setVoiceState(v => v === 'listening' ? 'idle' : v);
      };

      const openRealtimeSession = async () => {
        const ok = await realtime.startSession({
          onInterim: (t) => {
            if (handsFreeRef.current) setInterimText(t);
          },
          onTurn: (text) => {
            if (!handsFreeRef.current) return;
            reconnectAttemptsRef.current = 0; // healthy session — reset budget
            setInterimText('');
            sendToClaude(text);
            if (Date.now() - sessionStartedAtRef.current > SESSION_ROTATE_MS) {
              cycleRealtimeSession();
            }
          },
          onSpeechStart: () => {
            if (!handsFreeRef.current) return;
            // Barge-in: the user started talking over the assistant — stop
            // the reply (audio and stream) and listen. No tap needed.
            if (voiceStateRef.current === 'speaking') {
              streamAbortRef.current?.abort();
              cancelSpeak();
              setVoiceState('listening');
            }
          },
          onError: handleRealtimeError,
        });
        if (ok) sessionStartedAtRef.current = Date.now();
        return ok;
      };
      openSessionRef.current = openRealtimeSession;

      // When the PWA comes back from the background, quietly rebuild the
      // session if it died while we were away.
      React.useEffect(() => {
        const onVisible = async () => {
          if (document.visibilityState !== 'visible') return;
          if (!handsFreeRef.current || reconnectingRef.current) return;
