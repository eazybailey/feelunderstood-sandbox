        // after the first full MP3 has been generated and downloaded.
        voiceStateRef.current = 'speaking';
        setVoiceState('speaking');
        const sp = speakStreaming();
        for (const s of splitSentences(greeting)) {
          const t = s.trim();
          if (t) sp.addSentence(t);
        }
        sp.finish().then(() => {
          // Only step down if we're still the active speaker — the user may
          // have barged in and already be mid-turn.
          setVoiceState(v => v === 'speaking'
            ? (handsFreeRef.current ? 'listening' : 'idle')
            : v);
          const ttsErr = getTtsError();
          if (ttsErr) {
            setError(`Voice hiccup — a phrase was skipped (${ttsErr})`);
            setTimeout(() => setError(null), 6000);
          }
        });
      };

      const sendToClaude = async (userText, opts = {}) => {
        // opts.speak === false suppresses TTS for this turn — used by the
        // ElevenLabs stack's no-session text fallback, where an OpenAI
        // voice would contaminate the bake-off.
        const allowSpeak = opts.speak !== false;
        // A new turn supersedes any still-streaming previous one — kill its
        // stream AND its audio. Aborting the fetch alone leaves the old
        // reply's already-scheduled PCM chunks playing (and its speaker
        // pumping) underneath the new reply's TTS: the "two voices at once"
        // bug when a barge-in cancel was missed or the user talked over a
        // reply that was still processing.
        streamAbortRef.current?.abort();
        cancelSpeak();
        const ac = new AbortController();
        streamAbortRef.current = ac;

        // In hands-free mode two user turns can arrive back-to-back (e.g. a
        // barge-in before any assistant text streamed). Merge them so the
        // history sent to the API keeps alternating roles.
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        const updated = last && last.role === 'user'
          ? [...prev.slice(0, -1), { role: 'user', content: `${last.content}\n${userText}` }]
          : [...prev, { role: 'user', content: userText }];
        setMessages(updated);
        voiceStateRef.current = 'processing'; // keep the barge-in ref in lockstep
        setVoiceState('processing');
        setInterimText('');

        // Watchdog: a request that dies silently (mobile wifi→cellular
        // handoff) must not strand the UI at 'Thinking…'. `timedOut` lets
        // the catch block tell a watchdog abort (show the error, reset
        // state) apart from a deliberate interruption (stay silent).
        let timedOut = false;
        let watchdog = setTimeout(() => { timedOut = true; ac.abort(); }, 30000);
        const feedWatchdog = () => {
          clearTimeout(watchdog);
          watchdog = setTimeout(() => { timedOut = true; ac.abort(); }, 30000);
        };

        try {
          const response = await fetch('/api/chat-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              // Prompt caching (GA — no beta header): the system block is
              // byte-identical every turn of a session, so mark it as a
              // cacheable prefix. Without this the ~7k-token Deep variant
              // pays a first-token delay every turn that Light never pays —
              // testers would hear "the Deep coach is slower" and attribute
              // it to the writing. Each variant caches independently.
              system: [{
                type: 'text',
                text: buildSystemPrompt(profileRef.current, sotVariantRef.current),
                cache_control: { type: 'ephemeral' },
              }],
              // 700 (server clamps at 1000): 500 could clip a reply
              // mid-sentence when the model appends a [[VISUAL]] card.
              max_tokens: 700,
              // Reassemble both channels for the model so it remembers what
              // it displayed, not just what it said. Cap the history window:
              // sending the whole conversation makes Claude's first token
              // slower every single turn of a long session.
              messages: updated.slice(-24).map(m => ({
                role: m.role,
                content: m.visual ? `${m.content}\n[[VISUAL]]\n${m.visual}` : m.content,
              })),
            }),
            signal: ac.signal,
          });

          if (!response.ok) throw new Error('Stream request failed');

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullText = '';
          let sentenceBuffer = '';
          let streamSpeaker = null;
          let startedSpeaking = false;
          // Carry any incomplete trailing line between reads — a network
          // chunk can split a "data: {...}" line in half, and parsing each
          // half would drop that delta (lost words mid-reply).
          let lineBuffer = '';

          // Two-channel reply: text before [[VISUAL]] is spoken aloud; text
          // after it is shown on screen as a visual aid, never spoken.
          const VISUAL_MARKER = '[[VISUAL]]';
          // Chars of fullText already handed to the TTS sentence buffer.
          let spokenFed = 0;
          // How much of fullText is safely speakable: everything before the
          // marker — holding back any trailing partial marker so a chunk
          // ending in "[[VIS" never reaches TTS mid-stream.
          const speakableEnd = () => {
            const idx = fullText.indexOf(VISUAL_MARKER);
            if (idx !== -1) return idx;
            for (let k = VISUAL_MARKER.length - 1; k > 0; k--) {
              if (fullText.endsWith(VISUAL_MARKER.slice(0, k))) return fullText.length - k;
            }
            return fullText.length;
          };

          // Upstream failure surfaced mid-stream by the server (Anthropic
          // overload/error events) — previously swallowed, leaving a silent
          // empty reply that looked like the app just ignored the user.
          let upstreamError = null;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            feedWatchdog();

            lineBuffer += decoder.decode(value, { stream: true });
            const lines = lineBuffer.split('\n');
            lineBuffer = lines.pop() || '';

            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = line.slice(6).trim();
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                if (parsed.error) { upstreamError = parsed.error; continue; }
                if (parsed.text) {
                  fullText += parsed.text;

                  // Split the channels for display as the reply streams in.
                  // The display uses the same partial-marker holdback as the
                  // TTS path — without it, '[[VIS' flashed as literal text
                  // whenever the marker arrived split across deltas.
                  const markerIdx = fullText.indexOf(VISUAL_MARKER);
                  const displayEnd = markerIdx === -1 ? speakableEnd() : markerIdx;
                  const spokenText = fullText.slice(0, displayEnd).trim();
                  // Strip any repeated markers inside the visual channel so
                  // they can't render literally in the card.
                  const visualText = markerIdx === -1
                    ? ''
                    : fullText.slice(markerIdx + VISUAL_MARKER.length).split(VISUAL_MARKER).join('\n').trim();
                  setMessages([...updated, {
                    role: 'assistant',
                    content: spokenText,
                    ...(visualText ? { visual: visualText } : {}),
                  }]);

                  // Only the spoken channel feeds the TTS sentence buffer.
                  const end = speakableEnd();
                  if (end > spokenFed) {
                    sentenceBuffer += fullText.slice(spokenFed, end);
                    spokenFed = end;
                  }

                  // Aggressively fire TTS on any natural break point
                  // Priority 1: sentence endings (.!?)
                  // Priority 2: clause breaks (,;:—–) if buffer > 40 chars
                  // Priority 3: any content if buffer > 80 chars (force split at word boundary)
                  // First chunk uses lower thresholds so audio starts as
                  // quickly as possible. Later chunks are much looser: the
                  // PCM streaming path starts playing each sentence on its
                  // first network chunk, so we can afford whole sentences \u2014
                  // which sound far more natural than clause fragments.
                  const isFirstChunk = !streamSpeaker;
                  const clauseThreshold = isFirstChunk ? 12 : 80;
                  const forceThreshold = isFirstChunk ? 28 : 160;

                  // Break points require trailing whitespace so '.' inside
                  // numbers/abbreviations ('7.5', 'e.g.') and ',' inside
                  // '1,000' never chop a token into separate TTS chunks;
                  // [.!?]+ keeps an ellipsis in one piece. The end-of-stream
                  // `remaining` handler covers a final unterminated sentence.
                  let fireChunk = null;
                  const sentenceMatch = sentenceBuffer.match(/^([\s\S]*?[.!?]+)\s/);
                  const clauseMatch = sentenceBuffer.length > clauseThreshold && sentenceBuffer.match(/^([\s\S]*?[,;:\u2014\u2013])\s/);

                  if (sentenceMatch) {
                    fireChunk = sentenceMatch[1].trim();
                    sentenceBuffer = sentenceBuffer.slice(sentenceMatch[0].length);
                  } else if (clauseMatch) {
                    fireChunk = clauseMatch[1].trim();
                    sentenceBuffer = sentenceBuffer.slice(clauseMatch[0].length);
                  } else if (sentenceBuffer.length > forceThreshold) {
                    // Force split at last word boundary
                    const wordBreak = sentenceBuffer.lastIndexOf(' ', forceThreshold);
                    const splitAt = wordBreak > 15 ? wordBreak : forceThreshold;
                    fireChunk = sentenceBuffer.slice(0, splitAt).trim();
                    sentenceBuffer = sentenceBuffer.slice(splitAt);
                  }

                  // userSpeakingRef gate: if the user is mid-utterance while
                  // this reply arrives (they talked during 'processing',
                  // where barge-in can't fire), don't start talking over
                  // them — the text still streams, and their completed turn
                  // will supersede this reply anyway.
                  if (fireChunk && fireChunk.length > 0 && allowSpeak && !voiceMutedRef.current && !userSpeakingRef.current) {
                    if (!streamSpeaker) {
                      streamSpeaker = speakStreaming();
                      // Sync the ref before React re-renders: barge-in
                      // (speech_started) reads voiceStateRef on the realtime
                      // data channel and must see 'speaking' immediately —
                      // the useEffect mirror lags a render, and a barge-in
                      // in that window was silently ignored.
                      voiceStateRef.current = 'speaking';
                      setVoiceState('speaking');
                      startedSpeaking = true;
                    }
                    streamSpeaker.addSentence(fireChunk);
                  }
                }
              } catch (e) { /* skip */ }
            }
          }

          clearTimeout(watchdog);
          if (upstreamError) throw new Error(upstreamError);
          if (!fullText.trim()) throw new Error('Empty reply');

          // Handle any remaining text that didn't end with punctuation
          const remaining = sentenceBuffer.trim();
          if (remaining.length > 0 && allowSpeak && !voiceMutedRef.current && !userSpeakingRef.current) {
            if (!streamSpeaker) {
              streamSpeaker = speakStreaming();
              voiceStateRef.current = 'speaking'; // see comment above
              setVoiceState('speaking');
              startedSpeaking = true;
            }
            streamSpeaker.addSentence(remaining);
          }

          // Wait for all audio to finish playing
          if (streamSpeaker) {
            await streamSpeaker.finish();
          }
          // Interrupted turns do their own state cleanup at the point of
          // interruption — don't fight whatever the user is doing now.
          if (ac.signal.aborted) return;
          if (streamSpeaker) {
            const ttsErr = getTtsError();
            if (ttsErr) {
              // Playback carried on around the failed phrase — say so,
              // rather than announcing total failure.
              setError(`Voice hiccup — a phrase was skipped (${ttsErr})`);
              setTimeout(() => setError(null), 6000);
            }
          }
          // Hands-free: the session is still open, go straight back to
          // listening for the next turn. Tap-to-talk: rest at idle.
          setVoiceState(v => (v === 'speaking' || v === 'processing')
            ? (handsFreeRef.current ? 'listening' : 'idle')
            : v);
        } catch (err) {
          clearTimeout(watchdog);
          if (ac.signal.aborted && !timedOut) return; // interrupted on purpose
          console.error('Error:', err);
          // Kill any TTS already scheduled — the state is about to say
          // 'listening', and barge-in refuses to cancel audio in that state,
          // so orphaned chunks would keep talking uninterruptibly.
          cancelSpeak();
          setError('Something went wrong. Tap to try again.');
          const v = handsFreeRef.current ? 'listening' : 'idle';
          setVoiceState(prev => (prev === 'speaking' || prev === 'processing') ? v : prev);
          if (voiceStateRef.current === 'speaking' || voiceStateRef.current === 'processing') {
            voiceStateRef.current = v;
          }
          setTimeout(() => setError(null), 4000);
        }
      };

      // ── Hands-free conversation lifecycle (realtime path) ──
      //
      // The session must SELF-HEAL. On phones (especially the Android
      // Chrome home-screen PWA) the WebRTC connection routinely drops —
      // screen off, app switch, network blip, upstream session expiry.
      // Treating a drop as a one-strike fallback to tap-to-talk killed the
      // open mic and exposed Android's buggy native recognition; instead,
      // drops are rebuilt silently and the user keeps talking.
      const reconnectAttemptsRef = React.useRef(0);
      const reconnectingRef = React.useRef(false);
      const sessionStartedAtRef = React.useRef(0);
      const openSessionRef = React.useRef(null);

      // Rotate a long-lived session at a quiet moment (right after the
      // user's turn was captured, while Claude is thinking and the mic
      // isn't needed) — a controlled rebuild here beats an uncontrolled
      // drop mid-sentence later.
      const SESSION_ROTATE_MS = 8 * 60 * 1000;

      // Single-flight connect covering the initial open, rebuilds, and the
      // visibility handler — two concurrent startSessions meant two live
      // mics and doubled transcriptions.
      const connectRealtime = async () => {
        if (reconnectingRef.current) return false;
        reconnectingRef.current = true;
        try {
          return await openSessionRef.current().catch(() => false);
        } finally {
          reconnectingRef.current = false;
        }
      };

      const cycleRealtimeSession = async () => {
        if (!handsFreeRef.current || reconnectingRef.current) return;
        session.endSession();
        const ok = await connectRealtime();
        if (!ok && handsFreeRef.current && !reconnectingRef.current) {
          handleRealtimeError('connection-lost');
        }
      };

      // Tear down hands-free and fall back to tap-to-talk / text.
      const failHandsFree = (err) => {
        handsFreeRef.current = false;
        setHandsFree(false);
        session.endSession();
        userSpeakingRef.current = false;
        if (err === 'not-allowed') {
          setError('Microphone blocked. Tap the lock/site icon in the address bar to allow it, then try again.');
        } else if (err === 'no-mic') {
          setError('No microphone detected on this device.');
          setTimeout(() => setError(null), 6000);
        } else if (isEleven) {
          // No cross-stack fallback: the OpenAI tap-to-talk path would
          // contaminate the bake-off. Leave the mic armed for another try.
          setError('Voice connection failed — tap the mic to try again, or type below.');
          setTimeout(() => setError(null), 6000);
        } else {
          realtimeEnabledRef.current = false;
          setError('Hands-free voice unavailable — using tap-to-talk instead.');
          setTimeout(() => setError(null), 6000);
        }
        setInterimText('');
        setVoiceState(v => v === 'listening' ? 'idle' : v);
        if (voiceStateRef.current === 'listening') voiceStateRef.current = 'idle';
      };

      const handleRealtimeError = async (err) => {
        if (!handsFreeRef.current) return;
        // Failures no amount of retrying can fix: permission or hardware.
        const micFailure = err === 'not-allowed' || err === 'no-mic' || err === 'mic-failed';
        if (micFailure) {
          failHandsFree(err);
          return;
        }

        // Transient: the session dropped, or a setup attempt failed while
        // the network was recovering. Retry with a short backoff up to the
        // budget — previously a failed rebuild's own setup error was
        // reclassified as a hard failure, so one network blip permanently
        // disabled hands-free for the visit.
        if (document.visibilityState === 'hidden') {
          // Don't rebuild into a hidden tab — the visibility handler does
          // it the moment the app comes back.
          session.endSession();
          return;
        }
        // A driven attempt is already in flight — its driver observes the
        // outcome; re-entrant setup errors must not double-drive recovery.
        if (reconnectingRef.current) return;
        reconnectingRef.current = true;
        try {
          while (handsFreeRef.current && reconnectAttemptsRef.current < 3) {
            reconnectAttemptsRef.current++;
            session.endSession();
            // Backoff: an instant redial into the same outage is doomed.
            await new Promise(r => setTimeout(r, 700 * reconnectAttemptsRef.current));
            if (!handsFreeRef.current || document.visibilityState === 'hidden') return;
            const ok = await openSessionRef.current().catch(() => false);
            if (ok) return;
          }
        } finally {
          reconnectingRef.current = false;
        }
        if (handsFreeRef.current) failHandsFree(err);
      };

      const openRealtimeSession = async () => {
        setRtConnecting(true);
        try {
          const ok = await realtime.startSession({
            onInterim: (t) => {
              if (handsFreeRef.current) setInterimText(t);
            },
            onTurn: (text) => {
              if (!handsFreeRef.current) return;
              // A typed message just superseded this half-captured
              // utterance — drop the fragment instead of letting it cancel
              // the typed message's reply.
              if (suppressTurnRef.current) {
                const stillValid = Date.now() < suppressTurnRef.current;
                suppressTurnRef.current = 0;
                if (stillValid) { setInterimText(''); return; }
              }
              reconnectAttemptsRef.current = 0; // healthy session — reset budget
              setInterimText('');
              sendToClaude(text);
              if (Date.now() - sessionStartedAtRef.current > SESSION_ROTATE_MS) {
                cycleRealtimeSession();
              }
            },
            onSpeechStart: () => {
              if (!handsFreeRef.current) return;
              userSpeakingRef.current = true;
              // Barge-in: the user started talking over the assistant — stop
              // the reply (audio and stream) and listen. No tap needed.
              if (voiceStateRef.current === 'speaking') {
                streamAbortRef.current?.abort();
                cancelSpeak();
                voiceStateRef.current = 'listening';
                setVoiceState('listening');
              }
            },
            onSpeechStop: () => {
              userSpeakingRef.current = false;
            },
            onError: handleRealtimeError,
          });
          if (ok) {
            sessionStartedAtRef.current = Date.now();
            // A rebuild that stays up is healthy — refill the retry budget
            // so hours of idle listening survive repeated upstream expiries
            // (previously only a captured turn reset it).
            setTimeout(() => {
              if (handsFreeRef.current && realtime.isActive()) {
                reconnectAttemptsRef.current = 0;
              }
            }, 30000);
          }
          return ok;
        } finally {
          setRtConnecting(false);
        }
      };
      // ── ElevenLabs hands-free session (voice stack: elevenlabs) ──
      // Plugs into the SAME self-healing lifecycle as the realtime path:
      // openSessionRef points here when this stack is active, so
      // connectRealtime, the retry/backoff loop and the visibility rebuild
      // all drive it unchanged. ASR, end-of-turn and barge-in live on
      // ElevenLabs' side; this code only mirrors their events into the
      // conversation state.

      // True while the last assistant bubble is a live (tentative) reply
      // being updated in place as the agent generates.
      const elevenPendingRef = React.useRef(false);

      const appendUserTurn = (text) => {
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        // A typed user_message can come back as its own transcript — never
        // double-post the identical turn.
        if (last && last.role === 'user' && last.content.trim() === text.trim()) return;
        // Merge back-to-back user turns, same as sendToClaude, so history
        // keeps alternating roles.
        const updated = last && last.role === 'user'
          ? [...prev.slice(0, -1), { role: 'user', content: `${last.content}\n${text}` }]
          : [...prev, { role: 'user', content: text }];
        elevenPendingRef.current = false;
        messagesRef.current = updated;
        setMessages(updated);
      };

      const setAssistantTurn = (text, final) => {
        const t = (text || '').trim();
        if (!t) return;
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        let updated;
        if (elevenPendingRef.current && last && last.role === 'assistant') {
          updated = [...prev.slice(0, -1), { role: 'assistant', content: t }];
        } else {
          // The greeting is already on screen when the agent speaks it
          // (first_message override) and echoes back as an agent_response —
          // skip anything that's the last bubble's text or a prefix of it.
          if (last && last.role === 'assistant'
              && (last.content.trim() === t || last.content.trim().startsWith(t))) {
            elevenPendingRef.current = false;
            return;
          }
          updated = [...prev, { role: 'assistant', content: t }];
        }
        elevenPendingRef.current = !final;
        messagesRef.current = updated;
        setMessages(updated);
      };

      // After a barge-in ElevenLabs sends the truncation of what was
      // actually spoken — keep the transcript honest about what was heard.
      const applyElevenCorrection = (text) => {
        const t = (text || '').trim();
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        if (!t || !last || last.role !== 'assistant') return;
        const updated = [...prev.slice(0, -1), { role: 'assistant', content: t }];
        elevenPendingRef.current = false;
        messagesRef.current = updated;
        setMessages(updated);
      };

      const openElevenSession = async () => {
        setRtConnecting(true);
        try {
          const msgs = messagesRef.current;
          const hasUserTurn = msgs.some(m => m.role === 'user');
          const systemPrompt = buildSystemPrompt(profileRef.current, sotVariantRef.current);
          // Fresh conversation: the agent speaks the greeting already on
          // screen (first_message override) and ElevenLabs records it, so
          // no history rides along. Resumed conversation (or a session
          // rebuild): full history goes in the extra body — ElevenLabs
          // only knows the live session's turns — and the agent stays
          // quiet until the user speaks.
          const firstMessage = hasUserTurn
            ? ''
            : ((msgs.find(m => m.role === 'assistant') || {}).content || buildGreeting(profileRef.current));
          const history = hasUserTurn
            ? msgs.slice(-24).map(m => ({
                role: m.role,
                // Reassemble both channels, like sendToClaude, so the model
                // remembers what it displayed, not just what it said.
                content: m.visual ? `${m.content}\n[[VISUAL]]\n${m.visual}` : m.content,
              }))
            : [];
          const ok = await eleven.startSession({
            firstMessage,
            systemPrompt,
            extraBody: {
              fu_system: systemPrompt,
              fu_variant: sotVariantRef.current,
              fu_history: history,
              fu_max_tokens: 700,
            },
            getMuted: () => voiceMutedRef.current,
            onInterim: (t) => { if (handsFreeRef.current) setInterimText(t); },
            onUserTranscript: (text) => {
              if (!handsFreeRef.current) return;
              reconnectAttemptsRef.current = 0; // healthy session — reset budget
              userSpeakingRef.current = false;
              setInterimText('');
              appendUserTurn(text);
              voiceStateRef.current = 'processing';
              setVoiceState('processing');
            },
            onAgentTentative: (t) => { if (handsFreeRef.current) setAssistantTurn(t, false); },
            onAgentResponse: (t) => {
              setAssistantTurn(t, true);
              // A muted turn never gets audio, so no onSpeakStart/End will
              // move the state — step down here.
              if (handsFreeRef.current && voiceStateRef.current === 'processing' && voiceMutedRef.current) {
                voiceStateRef.current = 'listening';
                setVoiceState('listening');
              }
            },
            onAgentCorrection: applyElevenCorrection,
            onSpeakStart: () => {
              if (!handsFreeRef.current) return;
              voiceStateRef.current = 'speaking';
              setVoiceState('speaking');
            },
            onSpeakEnd: () => {
              if (voiceStateRef.current !== 'speaking') return;
              const v = handsFreeRef.current ? 'listening' : 'idle';
              voiceStateRef.current = v;
              setVoiceState(v);
            },
            onInterrupted: () => {
              // Server-side barge-in: the user talked over the agent.
              if (!handsFreeRef.current) return;
              voiceStateRef.current = 'listening';
              setVoiceState('listening');
            },
            onError: handleRealtimeError,
            onDisconnect: () => handleRealtimeError('connection-lost'),
          });
          if (ok) sessionStartedAtRef.current = Date.now();
          return ok;
        } finally {
          setRtConnecting(false);
        }
      };

      openSessionRef.current = isEleven ? openElevenSession : openRealtimeSession;

      // When the PWA comes back from the background, quietly rebuild the
      // session if it died while we were away.
      React.useEffect(() => {
        const onVisible = async () => {
          if (document.visibilityState !== 'visible') return;
          if (!handsFreeRef.current || reconnectingRef.current) return;
          // isActive() also checks the mic track is live — a session whose
          // track the OS killed while backgrounded needs the rebuild too.
          if (session.isActive()) return;
          const ok = await connectRealtime();
          if (!ok && handsFreeRef.current && !reconnectingRef.current) {
            handleRealtimeError('connection-lost');
          }
        };
        document.addEventListener('visibilitychange', onVisible);
        return () => document.removeEventListener('visibilitychange', onVisible);
      }, []);

      const startHandsFree = async () => {
        setError(null);
        setInterimText('');
        setTranscribing(false);
        handsFreeRef.current = true;
        setHandsFree(true);
        voiceStateRef.current = 'listening';
        setVoiceState('listening');
        reconnectAttemptsRef.current = 0;
        const ok = await connectRealtime();
        // Mic/permission failures already tore down via failHandsFree
        // (handsFreeRef is false then); anything else falls back here.
        if (!ok && handsFreeRef.current) failHandsFree('realtime-failed');
      };

      const endHandsFree = () => {
        handsFreeRef.current = false;
        setHandsFree(false);
        session.endSession();
        streamAbortRef.current?.abort();
        cancelSpeak();
        userSpeakingRef.current = false;
        suppressTurnRef.current = 0;
        setInterimText('');
        voiceStateRef.current = 'idle';
        setVoiceState('idle');
      };

      const handleMicClick = () => {
        if (isEleven) {
          // ElevenLabs stack: the mic button only ever drives the agent
          // session — there is no tap-to-talk fallback to fall into.
          if (handsFreeRef.current) {
            if (voiceState === 'speaking' || voiceState === 'processing') {
              // Manual barge-in / escape hatch: stop playback and drop the
              // rest of this turn's audio; the conversation stays open and
              // the reply still lands as text.
              eleven.suppressTurn();
              voiceStateRef.current = 'listening';
              setVoiceState('listening');
              return;
            }
            endHandsFree();
            return;
          }
          if (voiceState === 'speaking' || voiceState === 'processing') return;
          if (!eleven.supported) {
            setError('Voice not supported in this browser. Use the text input below.');
            setTimeout(() => setError(null), 6000);
            return;
          }
          startHandsFree();
          return;
        }

        if (handsFreeRef.current) {
          // A hands-free conversation is live.
          if (voiceState === 'speaking') {
            // Manual barge-in: stop the reply, keep the conversation open.
            streamAbortRef.current?.abort();
            cancelSpeak();
            voiceStateRef.current = 'listening';
            setVoiceState('listening');
            return;
          }
          if (voiceState === 'processing') {
            // Escape hatch: cancel a stuck request instead of ignoring the
            // tap — with no fetch timeout a hung network otherwise left the
            // UI stranded at 'Thinking…'.
            streamAbortRef.current?.abort();
            cancelSpeak();
            voiceStateRef.current = 'listening';
            setVoiceState('listening');
            return;
          }
          endHandsFree();
          return;
        }

        if (voiceState === 'speaking') {
          // Interrupt: stop both the audio AND the underlying reply stream,
          // so a superseded turn can't keep mutating the conversation.
          streamAbortRef.current?.abort();
          cancelSpeak();
          // Flow straight into listening (e.g. tapping during the greeting)
          // instead of resting at idle and needing a second tap.
          if (realtime.supported && realtimeEnabledRef.current) {
            startHandsFree();
          } else {
            voiceStateRef.current = 'idle';
            setVoiceState('idle');
          }
          return;
        }
        if (voiceState === 'processing') {
          // Same escape hatch on the tap-to-talk path.
          streamAbortRef.current?.abort();
          cancelSpeak();
          voiceStateRef.current = 'idle';
          setVoiceState('idle');
          return;
        }

        // Prefer the hands-free realtime path; fall back to tap-to-talk if
        // it's unsupported here or already failed once this visit.
        if (voiceState === 'idle' && realtime.supported && realtimeEnabledRef.current) {
          startHandsFree();
          return;
        }

        if (voiceState === 'listening') {
          // Manual stop. Native SR fires onFinal synchronously; Whisper path
          // needs a network round-trip, so move to processing right away.
          if (useRecorderFallback) {
            setInterimText('');
            setVoiceState('processing');
          }
          stopRec();
          return;
        }

        setVoiceState('listening');
        setInterimText('');
        setTranscribing(false);
        setError(null);

        startRec(
          (interim) => setInterimText(interim),
          (final) => {
            setInterimText('');
            setTranscribing(false);
            if (final.trim()) sendToClaude(final.trim());
            else setVoiceState('idle');
          },
          (err) => {
            let msg;
            const blocked = err === 'not-allowed' || err === 'service-not-allowed';
            // Native SpeechRecognition that exists but doesn't work: dead
            // engines (in-app iOS browsers — caught by the start watchdog)
            // and un-keyed Chromium builds like Brave ('network' on every
            // start). The MediaRecorder → Whisper path works on those, so
            // demote to it instead of dead-ending voice.
            const srBroken = (err === 'start-failed' || err === 'network' || err === 'not-supported');
            if (blocked) {
              msg = 'Microphone blocked. Tap the lock/site icon in the address bar to allow it, then try again.';
            } else if (err === 'no-mic') {
              msg = 'No microphone detected on this device.';
            } else if (srBroken && !useRecorderFallback && recorderSTT.supported) {
              setForceRecorder(true);
              msg = 'Switched to a compatible voice mode — tap the mic to try again.';
            } else if (err === 'not-supported' || err === 'start-failed' || err === 'network' || err === 'recorder-failed') {
              msg = 'Voice not supported in this browser. Use the text input below.';
            } else if (err === 'stt-failed') {
              msg = 'Could not transcribe audio. Try again or use the text input.';
            } else {
              msg = `Speech error: ${err}`;
            }
            setError(msg);
            setInterimText('');
            setTranscribing(false);
            setVoiceState('idle');
            // Non-permission errors auto-clear; permission errors persist
            // until the user resolves them.
            if (!blocked) setTimeout(() => setError(null), 6000);
          },
          // onProcessing — fires when recorder stops and transcription begins
          // (Whisper path only; native SR returns final synchronously).
          () => {
            setInterimText('');
            setTranscribing(true);
            setVoiceState('processing');
          }
        );
      };

      const handleTextSubmit = (e) => {
        e.preventDefault();
        // Typing is always available — during 'speaking' it acts as a
        // barge-in (sendToClaude aborts the old stream and audio), so a
        // tester can interrupt the ~30s greeting without granting mic
        // access. Previously the composer was locked for the whole reply.
        if (!textInput.trim()) return;
        if (isEleven) {
          const text = textInput.trim();
          setInterimText('');
          if (voiceStateRef.current === 'speaking') eleven.suppressTurn();
          if (handsFreeRef.current && eleven.isActive()) {
            // Typed turn into the live session: show it, hand it to the
            // agent (ElevenLabs adds it to its conversation), voice reply
            // comes back through the same audio pipeline.
            appendUserTurn(text);
            eleven.sendText(text);
            voiceStateRef.current = 'processing';
            setVoiceState('processing');
          } else {
            // No live session — text-only turn through the control-stack
            // proxy with TTS suppressed, so no OpenAI voice pollutes this
            // stack. The turn reaches the agent on the next session via
            // fu_history.
            sendToClaude(text, { speak: false });
          }
          setTextInput('');
          return;
        }
        if (voiceState === 'listening') {
          // User switched to typing mid-listen. Tap-to-talk: drop the mic
          // session so its silence timer can't fire a second, competing
          // message. Hands-free: the session stays open — they can keep
          // talking after this typed turn, but any half-captured utterance
          // is discarded so its late transcription can't cancel this
          // message's reply.
          if (!handsFreeRef.current) {
            abortRec();
          } else if (userSpeakingRef.current || interimText) {
            realtime.clearInput();
            suppressTurnRef.current = Date.now() + 3000;
            userSpeakingRef.current = false;
          }
          setInterimText('');
        }
        cancelSpeak();
        sendToClaude(textInput.trim());
        setTextInput('');
      };

      const handleNewChat = () => {
        stopVoicePipeline();
        // Start a new conversation (the profile persists — no need to
        // re-enter a name).
        const greeting = buildGreeting(profile);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
      };

      // ── A/B Source of Truth variant switching ──
      // Always a fresh session (clean A/B) — the two variants must never
      // share a transcript.
      const handleVariantSwitch = (key) => {
        if (!SOT_VARIANTS[key] || key === sotVariantRef.current) return;
        const hasUserTurn = messagesRef.current.some(m => m.role === 'user');
        if (hasUserTurn && !window.confirm('Switch to Version ' + key + '? This starts a fresh conversation.')) return;
        stopVoicePipeline();
        sotVariantRef.current = key;
        setSotVariant(key);
        saveToStorage(STORAGE_KEYS.sotVariant, key);
        const greeting = buildGreeting(profileRef.current);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
      };

      // ── Voice stack switching (v0.2 bake-off) ──
      // Like the prompt variant, a stack never mixes within one transcript:
      // switching starts a fresh conversation. The page reloads so the two
      // pipelines never cohabit, and the ?vs= param is dropped so it can't
      // force the old stack straight back.
      const handleVoiceStackSwitch = () => {
        const next = VOICE_STACK === 'elevenlabs' ? 'current' : 'elevenlabs';
        const hasUserTurn = messagesRef.current.some(m => m.role === 'user');
        if (hasUserTurn && !window.confirm(`Switch voice to "${next}"? This starts a fresh conversation.`)) return;
        stopVoicePipeline();
        saveToStorage(STORAGE_KEYS.voiceStack, next);
        saveToStorage(STORAGE_KEYS.activeId, null);
        location.href = location.pathname;
      };

      const handleStartOver = () => {
        // Full reset means full reset: the gate promises "conversations are
        // stored only on this device", so handing the device to the next
        // tester must not leave the previous tester's sessions behind.
        if (!window.confirm('This clears your profile and all conversations on this device. Continue?')) return;
        stopVoicePipeline();
        setProfile(null);
        profileRef.current = null;
        saveProfile(null);
        setMessages([]);
        setActiveConvoId(null);
        saveToStorage(STORAGE_KEYS.activeId, null);
        saveToStorage(STORAGE_KEYS.conversations, []);
        setGatePassed(false);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
        setStarted(false);
      };

      // ── Landing Gate ──
      // Shown only on the very first visit, before any profile or
      // conversation exists; returning testers skip straight to the chat.
      if (!gatePassed && !profile && !started) {
        return React.createElement(LandingGate, { onStart: () => setGatePassed(true) });
      }

      // ── Name entry (the only onboarding step) ──
      if (!started) {
        return React.createElement(NameScreen, { onComplete: handleNameComplete });
      }

      const voiceSupported = isEleven
        ? eleven.supported
        : (realtime.supported && realtimeEnabledRef.current) || sttSupported;
      const statusLabel = handsFree
        ? {
            idle: 'Tap to talk',
            listening: rtConnecting ? 'Connecting…' : 'Listening — just talk · tap to end',
            processing: 'Thinking...',
            speaking: 'Talk to interrupt',
          }[voiceState]
        : {
            idle: voiceSupported ? 'Tap to talk' : 'Type below',
            listening: 'Listening...',
            processing: 'Thinking...',
            // Tapping mid-speech now interrupts AND starts listening on the
            // hands-free path; plain stop on the tap-to-talk fallback.
            speaking: (!isEleven && realtime.supported && realtimeEnabledRef.current) ? 'Tap to interrupt' : 'Tap to stop',
          }[voiceState];

      // ── Chat UI ──
      return React.createElement('div', { className: 'app-shell' },
        // Top bar
        React.createElement('header', { className: 'app-header' },
          React.createElement('div', { className: 'header-left' },
            React.createElement('div', { className: 'header-title-wrap' },
              React.createElement('span', { className: 'header-title' }, 'Feel Understood'),
              React.createElement('span', { className: 'header-subtitle' }, 'Your Conversation Coach'),
            ),
          ),
          React.createElement('div', { className: 'header-right' },
            React.createElement('button', {
              className: `voice-toggle-btn ${voiceMuted ? 'voice-toggle-muted' : ''}`,
              onClick: toggleVoiceMuted,
              title: voiceMuted ? 'Voice replies are off — tap to turn on' : 'Voice replies are on — tap to turn off',
              'aria-label': voiceMuted ? 'Turn voice replies on' : 'Turn voice replies off',
              'aria-pressed': !voiceMuted,
            },
              voiceMuted
                ? React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('polygon', { points: '11 5 6 9 2 9 2 15 6 15 11 19 11 5' }),
                    React.createElement('line', { x1: 23, y1: 9, x2: 17, y2: 15 }),
                    React.createElement('line', { x1: 17, y1: 9, x2: 23, y2: 15 }),
                  )
                : React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('polygon', { points: '11 5 6 9 2 9 2 15 6 15 11 19 11 5' }),
                    React.createElement('path', { d: 'M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07' }),
                  ),
            ),
            React.createElement('button', {
              className: 'new-chat-btn',
              onClick: handleNewChat,
              title: 'New conversation'
            }, 'New Chat')
          )
        ),

        // Helpline banner with the A/B pill — neutral labels only; the
        // variant mapping stays in code so the tester A/B stays blind.
        React.createElement('div', { className: 'mode-hint mode-hint-helpline' },
          React.createElement('strong', null, 'Helpline \u00B7 '),
          'Unpacking a conversation that matters.',
          React.createElement('span', { className: 'sot-pill' },
            React.createElement('span', { className: 'sot-pill-label' }, 'Coach:'),
            ['A', 'B'].map(k => React.createElement('button', {
              key: k,
              className: 'sot-pill-btn' + (sotVariant === k ? ' sot-pill-active' : ''),
              onClick: () => handleVariantSwitch(k),
              'aria-pressed': sotVariant === k,
            }, k)),
          ),
        ),

        // Messages
        React.createElement('main', { className: 'chat-area' },
          messages.map((m, i) =>
            React.createElement(MessageBubble, { key: i, role: m.role, content: m.content, visual: m.visual })
          ),
          // User-side "your speech is being transcribed" bubble (Whisper
          // path only). Critical for affordance: without it, the gap
          // between stop-talking and message-appearing feels broken.
          transcribing && React.createElement('div', { className: 'msg-row user' },
            React.createElement('div', { className: 'bubble interim-bubble transcribing-bubble' },
              ...[0, 1, 2].map(i =>
                React.createElement('div', {
                  key: i,
                  className: 'typing-dot',
                  style: { animationDelay: `${i * 0.18}s` },
                })
              )
            )
          ),
          // Assistant typing indicator — only when we're actually waiting
          // on Claude, never during user-speech transcription.
          voiceState === 'processing' && !transcribing && React.createElement(TypingIndicator, {}),
          interimText && React.createElement('div', { className: 'msg-row user' },
            React.createElement('div', { className: 'bubble interim-bubble' }, interimText)
          ),
          React.createElement('div', { ref: chatEndRef })
        ),

        // Error
        error && React.createElement('div', { className: 'error-bar' }, error),

        // Controls
        React.createElement('footer', { className: 'controls' },
          // Mic area
          React.createElement('div', { className: 'mic-area' },
            voiceState === 'listening' && React.createElement(WaveVisualizer, {
              getLevel: handsFree
                ? session.getLevel
                : (useRecorderFallback ? recorderSTT.getLevel : null),
            }),
            React.createElement('button', {
              className: `mic-btn ${voiceState}`,
              onClick: handleMicClick,
              'aria-label': statusLabel,
            },
              voiceState === 'speaking'
                ? React.createElement('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('rect', { x: 6, y: 6, width: 12, height: 12, rx: 2 })
                  )
                : React.createElement('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('rect', { x: 9, y: 2, width: 6, height: 12, rx: 3 }),
                    React.createElement('path', { d: 'M5 11a7 7 0 0 0 14 0' }),
                    React.createElement('line', { x1: 12, y1: 18, x2: 12, y2: 22 }),
                    React.createElement('line', { x1: 9, y1: 22, x2: 15, y2: 22 })
                  )
            ),
            React.createElement('span', { className: 'mic-label' }, statusLabel),
          ),

          // Text input
          React.createElement('form', { className: 'text-form', onSubmit: handleTextSubmit },
            React.createElement('input', {
              type: 'text',
              value: textInput,
              onChange: (e) => setTextInput(e.target.value),
              placeholder: 'Or type here...',
              className: 'text-input',
            }),
            React.createElement('button', {
              type: 'submit',
              disabled: !textInput.trim(),
              className: `send-btn ${textInput.trim() ? 'active' : ''}`,
            },
              React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                React.createElement('line', { x1: 5, y1: 12, x2: 19, y2: 12 }),
                React.createElement('polyline', { points: '12 5 19 12 12 19' })
              )
            )
          ),

          !voiceSupported && React.createElement('p', { className: 'browser-warn' },
            'Voice not supported in this browser. Type below instead.'
          ),

          // Version label + full device reset (hand-off between testers)
          React.createElement('p', { className: 'version-label' },
            SANDBOX_VERSION,
            ' · ',
            React.createElement('button', {
              className: 'start-over-link',
              onClick: handleVoiceStackSwitch,
              title: 'Switch voice stack (starts a fresh conversation)',
            }, `voice: ${VOICE_STACK}`),
            ' · ',
            React.createElement('button', {
              className: 'start-over-link',
              onClick: handleStartOver,
            }, 'start over'),
          )
        )
      );
    };

    // ── Service Worker: DISABLED in the sandbox ──
    // Stale-cache confusion mid-test is the classic time thief. Any worker
    // left over from a previous deploy on this origin is unregistered.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations()
          .then((regs) => regs.forEach((r) => r.unregister()))
          .catch(() => {});
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
