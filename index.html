            React.createElement('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
              React.createElement('line', { x1: 18, y1: 6, x2: 6, y2: 18 }),
              React.createElement('line', { x1: 6, y1: 6, x2: 18, y2: 18 }),
            )
          ),
          React.createElement('div', { className: 'info-inner' },
            React.createElement('div', { className: 'info-eyebrow' }, 'Insights'),
            React.createElement('h1', { className: 'info-title' }, 'Your practice, at a glance'),
            React.createElement('p', { className: 'info-lede' },
              'A quiet window on the work you’ve been doing here.'
            ),
            React.createElement('div', { className: 'info-stats' },
              React.createElement('div', { className: 'info-stat' },
                React.createElement('span', { className: 'info-stat-num' }, conversations.length),
                React.createElement('span', { className: 'info-stat-label' }, conversations.length === 1 ? 'conversation' : 'conversations'),
              ),
              React.createElement('div', { className: 'info-stat' },
                React.createElement('span', { className: 'info-stat-num' },
                  conversations.reduce((sum, c) => sum + (c.messages?.length || 0), 0)
                ),
                React.createElement('span', { className: 'info-stat-label' }, 'messages exchanged'),
              ),
              React.createElement('div', { className: 'info-stat' },
                React.createElement('span', { className: 'info-stat-num-sm' },
                  profile ? (NEXT_STEPS.find(p => p.id === profile.path)?.label || '—') : '—'
                ),
                React.createElement('span', { className: 'info-stat-label' }, 'current mode'),
              ),
            ),
            React.createElement('div', { className: 'info-card' },
              React.createElement('h3', null, 'Coming soon'),
              React.createElement('p', null,
                'Patterns across your conversations — recurring themes, the skills you lean on, and where growth is showing up. For now, the best insight is the one you notice in the moment.'
              ),
            ),
          ),
        ),

        // Mode indicator banner — shows which mode you're currently in
        profile && (() => {
          const hints = {
            lessons: { label: 'Coach Mode', text: 'Learning the skills of dialogue.' },
            helpline: { label: 'Helpline', text: 'Unpacking a conversation that matters.' },
            facilitator: { label: 'Facilitator Mode', text: 'Each of you, say your name before you speak — e.g. "Sarah: I felt..."' },
          };
          // Fall back to mode if path is missing or unknown (e.g. profiles saved before paths existed)
          const pathKey = hints[profile.path]
            ? profile.path
            : (profile.mode === 'facilitator' ? 'facilitator' : 'lessons');
          const h = hints[pathKey];
          return React.createElement('div', { className: `mode-hint mode-hint-${pathKey}` },
            React.createElement('strong', null, h.label + ' · '),
            h.text,
          );
        })(),

        // Messages
        React.createElement('main', { className: 'chat-area' },
          messages.map((m, i) =>
            React.createElement(MessageBubble, { key: i, role: m.role, content: m.content, visual: m.visual })
          ),
          // User-side "your speech is being transcribed" bubble (Whisper
          // path only). Critical for affordance: without it, the gap
          // between stop-talking and message-appearing feels broken.
          transcribing && React.createElement('div', { className: 'msg-row user' },
            React.createElement('div', { className: 'bubble interim-bubble transcribing-bubble' },
              ...[0, 1, 2].map(i =>
                React.createElement('div', {
                  key: i,
                  className: 'typing-dot',
                  style: { animationDelay: `${i * 0.18}s` },
                })
              )
            )
          ),
          // Assistant typing indicator — only when we're actually waiting
          // on Claude, never during user-speech transcription.
          voiceState === 'processing' && !transcribing && React.createElement(TypingIndicator, {}),
          interimText && React.createElement('div', { className: 'msg-row user' },
            React.createElement('div', { className: 'bubble interim-bubble' }, interimText)
          ),
          React.createElement('div', { ref: chatEndRef })
        ),

        // Error
        error && React.createElement('div', { className: 'error-bar' }, error),

        // Controls
        React.createElement('footer', { className: 'controls' },
          // Mic area
          React.createElement('div', { className: 'mic-area' },
            voiceState === 'listening' && React.createElement(WaveVisualizer, {
              getLevel: handsFree
                ? realtime.getLevel
                : (useRecorderFallback ? recorderSTT.getLevel : null),
            }),
            React.createElement('button', {
              className: `mic-btn ${voiceState}`,
              onClick: handleMicClick,
              'aria-label': statusLabel,
            },
              voiceState === 'speaking'
                ? React.createElement('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('rect', { x: 6, y: 6, width: 12, height: 12, rx: 2 })
                  )
                : React.createElement('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('rect', { x: 9, y: 2, width: 6, height: 12, rx: 3 }),
                    React.createElement('path', { d: 'M5 11a7 7 0 0 0 14 0' }),
                    React.createElement('line', { x1: 12, y1: 18, x2: 12, y2: 22 }),
                    React.createElement('line', { x1: 9, y1: 22, x2: 15, y2: 22 })
                  )
            ),
            React.createElement('span', { className: 'mic-label' }, statusLabel),
          ),

          // Text input
          React.createElement('form', { className: 'text-form', onSubmit: handleTextSubmit },
            React.createElement('input', {
              ref: inputRef,
              type: 'text',
              value: textInput,
              onChange: (e) => setTextInput(e.target.value),
              placeholder: profile?.mode === 'facilitator' ? 'Sarah: ... or Mark: ...' : 'Or type here...',
              disabled: voiceState === 'processing' || voiceState === 'speaking',
              className: 'text-input',
            }),
            React.createElement('button', {
              type: 'submit',
              disabled: !textInput.trim() || voiceState === 'processing' || voiceState === 'speaking',
              className: `send-btn ${textInput.trim() ? 'active' : ''}`,
            },
              React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                React.createElement('line', { x1: 5, y1: 12, x2: 19, y2: 12 }),
                React.createElement('polyline', { points: '12 5 19 12 12 19' })
              )
            )
          ),

          !sttSupported && React.createElement('p', { className: 'browser-warn' },
            'Voice not supported in this browser. Type below instead.'
          ),

          // Version label
          React.createElement('p', {
            style: { textAlign: 'center', fontSize: '11px', color: '#555', margin: '12px 0 4px', opacity: 0.6 }
          }, 'v2.4.4')
        )
      );
    };

    // ── Register Service Worker ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
