      const [supported, setSupported] = React.useState(true);

      React.useEffect(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { setSupported(false); return; }
        const r = new SR();
        // continuous: don't let the browser auto-stop on its own short pause
        // (~1s) — we manage end-of-speech ourselves with a longer silence
        // debounce so the user can pause to think without being cut off.
        r.continuous = true;
        r.interimResults = true;
        r.lang = 'en-US';
        recognitionRef.current = r;
        return () => { try { r.abort(); } catch(e) {} };
      }, []);

      const start = (onInterim, onFinal, onError) => {
        const r = recognitionRef.current;
        if (!r) { onError('not-supported'); return; }

        // ms of silence after the last interim/final before we treat the
        // user as done speaking. The browser default is ~1s — too quick;
        // 2.2s leaves room for a thoughtful pause without dragging.
        const SILENCE_MS = 2200;

        let accumulatedFinal = '';
        let lastInterim = '';
        let silenceTimer = null;
        let committed = false;

        // In-app iOS browsers (Instagram/Gmail/Slack WKWebViews) and Chrome
        // on iPad expose SpeechRecognition, but start() silently does
        // nothing — no result, no error, no end. Without a watchdog the UI
        // would sit at "Listening..." forever; any real engine fires
        // onstart/onaudiostart immediately, which disarms it.
        let watchdog = setTimeout(() => {
          watchdog = null;
          if (committed) return;
          abandon();
          onError('start-failed');
        }, 8000);
        const feedWatchdog = () => {
          if (watchdog) { clearTimeout(watchdog); watchdog = null; }
        };

        const commit = () => {
          if (committed) return;
          committed = true;
          feedWatchdog();
          if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
          const finalText = (accumulatedFinal + ' ' + lastInterim).trim();
          try { r.stop(); } catch(e) {}
          onFinal(finalText);
        };

        const resetSilenceTimer = () => {
          if (silenceTimer) clearTimeout(silenceTimer);
          silenceTimer = setTimeout(commit, SILENCE_MS);
        };

        const abandon = () => {
          // Discard the utterance without firing onFinal — used when the
          // user switches to typing or leaves the conversation mid-listen.
          if (committed) return;
          committed = true;
          feedWatchdog();
          if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
          try { r.abort(); } catch(e) {}
        };

        sessionRef.current = { commit, abandon };

        r.onstart = feedWatchdog;
        r.onaudiostart = feedWatchdog;
        r.onspeechstart = feedWatchdog;
        r.onresult = (e) => {
          feedWatchdog();
          // Rebuild the transcript from the full results list on every
          // event instead of appending deltas. Chrome on Android sometimes
          // re-delivers final results (resultIndex doesn't reliably
          // advance), and appending them again duplicates words — the
          // "text repeats itself" bug. Rebuilding from index 0 is
          // idempotent. Android can ALSO re-emit the same final segment as
          // a brand-new results entry, so consecutive identical finals are
          // treated as echoes and dropped.
          let finalNow = '';
          let interimNow = '';
          let prevSeg = '';
          for (let i = 0; i < e.results.length; i++) {
            const t = (e.results[i][0].transcript || '').trim();
            if (!t) continue;
            if (e.results[i].isFinal) {
              if (t !== prevSeg) {
                finalNow += t + ' ';
                prevSeg = t;
              }
            } else {
              interimNow += t + ' ';
            }
          }
          accumulatedFinal = finalNow;
          lastInterim = interimNow.trim();
          onInterim((accumulatedFinal + ' ' + lastInterim).trim());
          resetSilenceTimer();
        };
        r.onerror = (e) => {
          feedWatchdog();
          if (e.error === 'no-speech' || e.error === 'aborted') return;
          onError(e.error);
        };
        r.onend = () => { commit(); };
        try { r.start(); } catch(e) { onError(e.message || 'start-failed'); }
      };

      const stop = () => {
        // Manual stop (user tapped the mic): commit immediately rather than
        // waiting for the silence timer.
        const session = sessionRef.current;
        if (session) session.commit();
        else { try { recognitionRef.current?.stop(); } catch(e) {} }
      };

      const abort = () => {
        const session = sessionRef.current;
        if (session) session.abandon();
        else { try { recognitionRef.current?.abort(); } catch(e) {} }
      };

      return { start, stop, abort, supported };
    };

    // ── MediaRecorder + Whisper Fallback ──
    //
    // iOS Chrome (CriOS), iOS Firefox (FxiOS), and iOS Edge (EdgiOS) all run
    // on WKWebView but Apple does not expose webkitSpeechRecognition to those
    // third-party browsers in regular browsing mode. The API may exist on the
    // window but .start() silently fails or errors. The PWA standalone mode
    // uses a different WKWebView context where it works — that's why "Add to
    // Home Screen" fixes it.
    //
    // For those browsers, we record audio via MediaRecorder and transcribe
    // via OpenAI Whisper. Same interface as useSpeechRecognition so the rest
    // of the app doesn't care which one is active.
    const useMediaRecorderSTT = () => {
      const [supported, setSupported] = React.useState(true);
      const recorderRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const chunksRef = React.useRef([]);
      const audioCtxRef = React.useRef(null);
      const analyserRef = React.useRef(null);
      const animRef = React.useRef(null);
      const mimeRef = React.useRef('');
      const onFinalRef = React.useRef(null);
      const onErrorRef = React.useRef(null);
      const onProcessingRef = React.useRef(null);
      const startedAtRef = React.useRef(0);
      // Last computed RMS level [0..1ish] — read by WaveVisualizer for
      // live "we can hear you" feedback during recording.
      const levelRef = React.useRef(0);
      // Bumped by stop()/abort() so a start() still awaiting the
      // getUserMedia permission prompt knows it was cancelled — otherwise
      // tapping the mic off while the sheet is up, then granting, left a
      // zombie recorder running while the UI showed "Tap to talk".
      const startTokenRef = React.useRef(0);

      React.useEffect(() => {
        if (!navigator.mediaDevices?.getUserMedia || typeof window.MediaRecorder === 'undefined') {
          setSupported(false);
        }
        return () => cleanup();
      }, []);

      const cleanup = () => {
        if (animRef.current) { cancelAnimationFrame(animRef.current); animRef.current = null; }
        if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
        if (audioCtxRef.current) { try { audioCtxRef.current.close(); } catch(e) {} audioCtxRef.current = null; }
        analyserRef.current = null;
        levelRef.current = 0;
      };

      const pickMime = () => {
        const candidates = [
          'audio/webm;codecs=opus',
          'audio/webm',
          'audio/mp4;codecs=mp4a.40.2',
          'audio/mp4',
          'audio/aac',
        ];
        for (const c of candidates) {
          if (window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(c)) return c;
        }
        return '';
      };

      const start = async (onInterim, onFinal, onError, onProcessing) => {
        onFinalRef.current = onFinal;
        onErrorRef.current = onError;
        onProcessingRef.current = onProcessing || null;
        const myToken = ++startTokenRef.current;

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          const name = e?.name || '';
          if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            onError('not-allowed');
          } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            onError('no-mic');
          } else {
            onError(e?.message || 'mic-failed');
          }
          return;
        }
        // Cancelled while the permission prompt was up — release the mic
        // instead of recording behind an idle UI.
        if (startTokenRef.current !== myToken) {
          stream.getTracks().forEach(t => t.stop());
          return;
        }
        cleanup(); // stop any orphaned previous stream before adopting a new one
        streamRef.current = stream;

        const mime = pickMime();
        mimeRef.current = mime;
        let rec;
        try {
          rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        } catch (e) {
          cleanup();
          onError('recorder-failed');
          return;
        }
        recorderRef.current = rec;
        chunksRef.current = [];
        startedAtRef.current = Date.now();

        rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunksRef.current.push(e.data); };
        rec.onerror = () => {
          // A recorder error may never be followed by onstop — release the
          // mic here or it stays hot behind an error banner.
          rec.onstop = null;
          cleanup();
          onErrorRef.current && onErrorRef.current('recorder-failed');
        };
        rec.onstop = async () => {
          const chunks = chunksRef.current;
          chunksRef.current = [];
          cleanup();

          const type = mimeRef.current || (chunks[0]?.type || 'audio/webm');
          const ext = /mp4|aac|m4a/.test(type) ? 'mp4' : 'webm';
          const blob = new Blob(chunks, { type });

          // Reject too-short recordings (under ~400ms of audio is usually a mis-tap)
          const duration = Date.now() - startedAtRef.current;
          if (blob.size < 1500 || duration < 400) {
            onFinalRef.current && onFinalRef.current('');
            return;
          }

          if (onProcessingRef.current) onProcessingRef.current();

          // Time-box the upload: while it's in flight the whole UI is in
          // 'processing' (mic taps ignored), so a stalled request on flaky
          // mobile networks must not lock the app for minutes.
          const uploadAC = new AbortController();
          const uploadTimer = setTimeout(() => uploadAC.abort(), 20000);
          try {
            const fd = new FormData();
            fd.append('audio', blob, `audio.${ext}`);
            const res = await fetch('/api/stt', { method: 'POST', body: fd, signal: uploadAC.signal });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              onErrorRef.current && onErrorRef.current(err.error || 'stt-failed');
              return;
            }
            const data = await res.json();
            onFinalRef.current && onFinalRef.current((data.text || '').trim());
          } catch (e) {
            onErrorRef.current && onErrorRef.current('stt-failed');
          } finally {
            clearTimeout(uploadTimer);
          }
        };

        // Silence detection so behavior matches the native SR path
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          const ctx = new AC();
          audioCtxRef.current = ctx;
          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 1024;
          source.connect(analyser);
          analyserRef.current = analyser;

          const buf = new Uint8Array(analyser.frequencyBinCount);
          // Match the native SR path: wait 2.2s of silence before auto-
          // stopping, so a pause to think doesn't end the turn too soon.
          const SILENCE_MS = 2200;
          const SPEECH_RMS = 0.02;
          const MIN_BEFORE_AUTOSTOP = 600;
          const MAX_RECORDING_MS = 60_000;
          let hasSpoken = false;
          let lastSpeechAt = Date.now();

          const tick = () => {
            if (!analyserRef.current) return;
            analyser.getByteTimeDomainData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) {
              const v = (buf[i] - 128) / 128;
              sum += v * v;
            }
            const rms = Math.sqrt(sum / buf.length);
            levelRef.current = rms;
            const now = Date.now();
            if (rms > SPEECH_RMS) {
              hasSpoken = true;
              lastSpeechAt = now;
            }
            // Hard cap on duration — prevents runaway recordings if the
            // user walks away with the mic open.
            if (now - startedAtRef.current > MAX_RECORDING_MS) {
              stop();
              return;
            }
            if (hasSpoken && now - startedAtRef.current > MIN_BEFORE_AUTOSTOP && now - lastSpeechAt > SILENCE_MS) {
              stop();
              return;
            }
            animRef.current = requestAnimationFrame(tick);
          };
          animRef.current = requestAnimationFrame(tick);
        } catch (e) {
          // Silence detection is best-effort — manual stop still works.
        }

        try { rec.start(); } catch (e) {
          cleanup();
          onError('recorder-failed');
        }
      };

      const stop = () => {
        const rec = recorderRef.current;
        if (rec && rec.state !== 'inactive') {
          try { rec.stop(); } catch (e) {}
        } else {
          startTokenRef.current++; // cancel a start() still awaiting the mic
          cleanup();
          onFinalRef.current && onFinalRef.current('');
        }
      };

      const abort = () => {
        // Discard the recording without transcribing or firing onFinal —
        // used when the user switches to typing or leaves mid-listen.
        const rec = recorderRef.current;
        if (rec && rec.state !== 'inactive') {
          rec.ondataavailable = null;
          rec.onstop = () => { chunksRef.current = []; cleanup(); };
          try { rec.stop(); } catch (e) { cleanup(); }
        } else {
          startTokenRef.current++; // cancel a start() still awaiting the mic
          cleanup();
        }
      };

      const getLevel = () => levelRef.current;

      return { start, stop, abort, supported, getLevel };
    };

    // ── Realtime Hands-Free STT (OpenAI Realtime API over WebRTC) ──
    //
    // The primary voice path. The browser opens a WebRTC session directly
    // to OpenAI's Realtime API (authorized by a short-lived client secret
    // minted by /api/realtime-session), streams mic audio continuously, and
    // receives live transcription events over the data channel:
    //
    //   input_audio_buffer.speech_started                → user began talking
    //                                                      (barge-in trigger)
    //   conversation.item.input_audio_transcription.delta → live interim text
    //   ...transcription.completed                        → finished turn
    //
    // Server-side VAD ends a turn after ~1.2s of silence (configured in
    // api/realtime-session.js) instead of the old 2.2s client debounce, and
    // the session stays open across turns — no tap-to-talk. Claude remains
    // the conversational brain; only the ears changed.
    //
    // If anything fails (endpoint not configured, SDP rejected, WebRTC
    // blocked, connection drops) the app falls back to the tap-to-talk
    // pipeline above for the rest of the visit.
    const useRealtimeSTT = () => {
      const pcRef = React.useRef(null);
      const dcRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const levelNodesRef = React.useRef(null);
      const levelAnimRef = React.useRef(null);
      const levelRef = React.useRef(0);
      const activeRef = React.useRef(false);
      // Generation counter: endSession bumps it, and every await inside
      // startSession re-checks it. Without this, ending hands-free while
      // setup was mid-flight (permission prompt up, SDP exchange slow) let
      // the pending startSession finish as an untracked ghost session — a
      // hot mic behind an idle UI, and doubled transcriptions once a second
      // session was opened on top of it.
      const genRef = React.useRef(0);

      const supported = typeof window !== 'undefined'
        && !!window.RTCPeerConnection
        && !!navigator.mediaDevices?.getUserMedia;

      const endSession = () => {
        genRef.current++;
        activeRef.current = false;
        if (levelAnimRef.current) { cancelAnimationFrame(levelAnimRef.current); levelAnimRef.current = null; }
        if (levelNodesRef.current) {
          try { levelNodesRef.current.source.disconnect(); } catch (e) {}
          levelNodesRef.current = null;
        }
        if (dcRef.current) { try { dcRef.current.close(); } catch (e) {} dcRef.current = null; }
        if (pcRef.current) { try { pcRef.current.close(); } catch (e) {} pcRef.current = null; }
        if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
        levelRef.current = 0;
      };

      React.useEffect(() => () => endSession(), []);

      const mintSecret = () => fetch('/api/realtime-session', { method: 'POST' })
        .then(r => { if (!r.ok) throw new Error('mint-failed'); return r.json(); })
        .catch(() => null);

      const startSession = async ({ onInterim, onTurn, onSpeechStart, onSpeechStop, onError }) => {
        // Tear down any previous session first — overwriting the refs would
        // leak its mic tracks and peer connection — then claim a generation
        // so a concurrent endSession/startSession cancels this one.
        endSession();
        const myGen = genRef.current;
        const cancelled = () => genRef.current !== myGen;

        // Mint the client secret WHILE the mic permission/device spins up —
        // the two round-trips used to run back-to-back, and every extra
        // moment before the session opens is a moment where the user's
        // first words fall on a mic that isn't connected yet.
        const tokenPromise = mintSecret();
        let stream;
        try {
          // Echo cancellation is what lets the mic stay open while TTS
          // plays without the assistant hearing itself.
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
        } catch (e) {
          const name = e?.name || '';
          if (cancelled()) return false;
          if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            onError('not-allowed');
          } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            onError('no-mic');
          } else {
            onError('mic-failed');
          }
          return false;
        }
        if (cancelled()) {
          stream.getTracks().forEach(t => t.stop());
          return false;
        }
        streamRef.current = stream;
        // The OS can take the mic (phone call, Siri) while the peer
        // connection stays 'connected' — surface it so the session rebuilds
        // instead of listening forever on a dead track.
        stream.getTracks().forEach(t => {
          t.onended = () => { if (!cancelled() && activeRef.current) onError('connection-lost'); };
        });

        let pc = null;
        try {
          let token = await tokenPromise;
          if (cancelled()) throw new Error('cancelled');
          if (!token || !token.value) throw new Error('mint-failed');
          // A permission prompt can outlive the 10-minute secret — re-mint
          // rather than opening with a token that the SDP exchange rejects.
          if (token.expires_at && token.expires_at * 1000 < Date.now() + 10000) {
            token = await mintSecret();
            if (cancelled()) throw new Error('cancelled');
            if (!token || !token.value) throw new Error('mint-failed');
          }

          pc = new RTCPeerConnection();
          pcRef.current = pc;
          stream.getTracks().forEach(t => pc.addTrack(t, stream));

          const dc = pc.createDataChannel('oai-events');
          dcRef.current = dc;
          let interim = '';
          dc.onmessage = (e) => {
            if (cancelled()) return;
            let msg;
            try { msg = JSON.parse(e.data); } catch (err) { return; }
            if (msg.type === 'input_audio_buffer.speech_started') {
              if (onSpeechStart) onSpeechStart();
            } else if (msg.type === 'conversation.item.input_audio_transcription.delta') {
              interim += msg.delta || '';
              if (interim.trim()) onInterim(interim.trim());
            } else if (msg.type === 'conversation.item.input_audio_transcription.completed') {
              interim = '';
              if (onSpeechStop) onSpeechStop();
              const text = (msg.transcript || '').trim();
              if (text) onTurn(text);
              else onInterim('');
            } else if (msg.type === 'conversation.item.input_audio_transcription.failed') {
              // Without this branch a failed transcription left the stale
              // interim bubble on screen and the next turn's deltas were
              // appended onto the dead text.
              interim = '';
              if (onSpeechStop) onSpeechStop();
              onInterim('');
            } else if (msg.type === 'error') {
              onError(msg.error?.message || 'realtime-error');
            }
          };

          const offer = await pc.createOffer();
          if (cancelled()) throw new Error('cancelled');
          await pc.setLocalDescription(offer);
          const sdpRes = await fetch('https://api.openai.com/v1/realtime/calls', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token.value}`,
              'Content-Type': 'application/sdp',
            },
            body: offer.sdp,
          });
          if (cancelled()) throw new Error('cancelled');
          if (!sdpRes.ok) throw new Error('sdp-failed');
          const answerSdp = await sdpRes.text();
          if (cancelled()) throw new Error('cancelled');
          await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

          await new Promise((resolve, reject) => {
            const t = setTimeout(() => reject(new Error('open-timeout')), 10000);
            dc.onopen = () => { clearTimeout(t); resolve(); };
            pc.onconnectionstatechange = () => {
              if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                clearTimeout(t);
                reject(new Error('connection-failed'));
              }
            };
          });
          if (cancelled()) throw new Error('cancelled');

          // After setup, surface a dropped connection as an error so the
          // app can rebuild instead of listening to a dead session.
          // 'disconnected' is transient in WebRTC (wifi→cellular handover,
          // brief packet loss) and usually recovers on its own — give it a
          // grace period instead of tearing down mid-utterance.
          let disconnectTimer = null;
          pc.onconnectionstatechange = () => {
            if (cancelled() || !activeRef.current) return;
            const st = pc.connectionState;
            if (st === 'failed') {
              onError('connection-lost');
            } else if (st === 'disconnected') {
              if (!disconnectTimer) {
                disconnectTimer = setTimeout(() => {
                  disconnectTimer = null;
                  if (!cancelled() && activeRef.current && pc.connectionState !== 'connected') {
                    onError('connection-lost');
                  }
                }, 4000);
              }
            } else if (st === 'connected' && disconnectTimer) {
              clearTimeout(disconnectTimer);
              disconnectTimer = null;
            }
          };

          // Mic level for the visualizer — same "we can hear you"
          // affordance as the Whisper path. Taps into the SHARED playback
          // AudioContext: a second live context running alongside TTS
          // playback makes output audio glitch/crackle on some phones.
          try {
            ensureAudioContext();
            const ctx = audioCtx;
            if (!ctx || ctx.state !== 'running') throw new Error('no-ctx');
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 1024;
            const source = ctx.createMediaStreamSource(stream);
            source.connect(analyser);
            levelNodesRef.current = { source, analyser };
            const buf = new Uint8Array(analyser.frequencyBinCount);
            const tick = () => {
              if (!levelNodesRef.current) return;
              analyser.getByteTimeDomainData(buf);
              let sum = 0;
              for (let i = 0; i < buf.length; i++) {
                const v = (buf[i] - 128) / 128;
                sum += v * v;
              }
              levelRef.current = Math.sqrt(sum / buf.length);
              levelAnimRef.current = requestAnimationFrame(tick);
            };
            levelAnimRef.current = requestAnimationFrame(tick);
          } catch (e) { /* level meter is best-effort */ }

          activeRef.current = true;
          return true;
        } catch (e) {
          if (cancelled() || e?.message === 'cancelled') {
            // A newer session owns the shared refs (or endSession already
            // cleaned them) — dispose only what this attempt created.
            try { if (pc) pc.close(); } catch (err) {}
            stream.getTracks().forEach(t => t.stop());
            return false;
          }
          endSession();
          onError(e?.message === 'mint-failed' ? 'realtime-unavailable' : 'realtime-failed');
          return false;
        }
      };

      // Active only counts if the mic track is actually alive — the OS can
      // kill the track without touching the peer connection.
      const isActive = () => activeRef.current
        && !!streamRef.current
        && streamRef.current.getAudioTracks().some(t => t.readyState === 'live');
      const getLevel = () => levelRef.current;
      // Drop any audio captured but not yet transcribed — used when a typed
      // message supersedes a half-spoken one.
      const clearInput = () => {
        try { dcRef.current?.send(JSON.stringify({ type: 'input_audio_buffer.clear' })); } catch (e) {}
      };

      return { supported, startSession, endSession, isActive, getLevel, clearInput };
    };

    // ── Browser detection: which STT path to use ──
    //
    // iOS Chrome (CriOS) / Firefox (FxiOS) / Edge (EdgiOS) need the Whisper
    // fallback. iOS Safari and the home-screen PWA can use native SR.
    const needsRecorderFallback = () => {
      if (typeof window === 'undefined' || typeof navigator === 'undefined') return false;
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const hasNativeSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      const isStandalone = window.navigator.standalone === true
        || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      // PWA standalone on iOS: native SR works, prefer it (lower latency, free).
      if (isStandalone && hasNativeSR) return false;
      if (isIOS && /CriOS|FxiOS|EdgiOS/.test(ua)) return true;
      if (!hasNativeSR) return true;
      return false;
    };

    // ── TTS Audio (OpenAI TTS via Nova) ──
    //
    // iOS WebKit blocks HTMLAudioElement.play() unless called within the
    // synchronous callstack of a user gesture. The greeting works (called
    // from a short setTimeout after a tap) but streamed TTS responses
    // arrive seconds later after async fetch, well outside any gesture.
    //
    // AudioContext does NOT have this limitation. Once an AudioContext is
    // created and resumed during a user gesture, decodeAudioData() and
    // bufferSource.start() work freely without further gestures.
    //
    // Strategy:
    //   1. On first user tap → create + resume AudioContext
    //   2. Fetch TTS as ArrayBuffer
    //   3. Decode with decodeAudioData → play via BufferSource
    //   4. Fall back to HTMLAudioElement only if AudioContext unavailable

    let audioCtx = null;

    // Called on every user interaction to ensure AudioContext is alive.
    // The resume gate is "not running" rather than === 'suspended': iOS
    // WebKit parks the context in a nonstandard 'interrupted' state after a
    // phone call / Siri / screen lock, and a context left there would mute
    // every reply for the rest of the visit with no error shown.
    const ensureAudioContext = () => {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state !== 'running' && audioCtx.state !== 'closed') {
          audioCtx.resume().catch(() => {});
        }
      } catch(e) {
        console.warn('AudioContext init failed:', e);
      }
    };

    // Listen on EVERY tap — AudioContext can get suspended by iOS at any
    // time — and on return to the foreground, which is when an
    // interruption (call/Siri/lock) is over and the context can recover
    // without waiting for a tap that hands-free users never make.
    document.addEventListener('touchstart', ensureAudioContext, true);
    document.addEventListener('touchend', ensureAudioContext, true);
    document.addEventListener('click', ensureAudioContext, true);
    document.addEventListener('visibilitychange', ensureAudioContext, true);

    // Fetches TTS audio as ArrayBuffer. On failure, throws an Error whose
    // message contains the server's JSON error body so the real cause
    // (auth, quota, bad payload, etc.) is visible instead of swallowed.
    const fetchTTSBuffer = async (text, attempt = 0) => {
      let response;
      try {
        response = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: text, voice: 'shimmer' }),
        });
      } catch (netErr) {
        // Network blip — retry once before giving up.
        if (attempt === 0) {
          await new Promise(r => setTimeout(r, 300));
          return fetchTTSBuffer(text, 1);
        }
        throw netErr;
      }
      if (!response.ok) {
        // Transient failures — retry once. 429 = rate limit (back off a
        // little longer), 5xx = slow/cold upstream or our 8s abort. Don't
        // retry other 4xx (bad input / auth), where a retry can't help.
        if ((response.status === 429 || response.status >= 500) && attempt === 0) {
          await new Promise(r => setTimeout(r, response.status === 429 ? 700 : 300));
          return fetchTTSBuffer(text, 1);
        }
        let detail = '';
        try { detail = JSON.stringify(await response.json()); } catch(e) {}
        const msg = `TTS ${response.status}: ${detail || response.statusText}`;
        console.error(msg);
        throw new Error(msg);
      }
      return await response.arrayBuffer();
    };

    // Fetches TTS as a streaming PCM response. Mirrors fetchTTSBuffer's
    // retry policy — one retry on 429 (longer backoff), 5xx, or network
    // error. Without this, a single slow upstream call (our 8s 504) stalls
    // the sentence pipeline for its whole timeout and the phrase is lost;
    // with it, the retry usually lands in well under a second.
    const fetchPCMStream = async (text, attempt = 0) => {
      let response;
      try {
        response = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: text, voice: 'shimmer', format: 'pcm' }),
        });
      } catch (netErr) {
        if (attempt === 0) {
          await new Promise(r => setTimeout(r, 300));
          return fetchPCMStream(text, 1);
        }
        throw netErr;
      }
      if (!response.ok && (response.status === 429 || response.status >= 500) && attempt === 0) {
        await new Promise(r => setTimeout(r, response.status === 429 ? 700 : 300));
        return fetchPCMStream(text, 1);
      }
      return response;
    };

    // Plays an ArrayBuffer of audio through AudioContext (primary)
    // or falls back to HTMLAudioElement. isStale (optional) is re-checked
    // after every await so a barge-in that lands mid-decode can't start a
    // superseded sentence on top of the new turn.
    const playAudioBuffer = (arrayBuffer, audioRef, isStale) => {
      return new Promise(async (resolve, reject) => {
        // Ensure context is resumed (may have been suspended — or
        // 'interrupted' on iOS — during idle)
        if (audioCtx && audioCtx.state !== 'running' && audioCtx.state !== 'closed') {
          try { await audioCtx.resume(); } catch(e) {}
        }
        if (isStale && isStale()) return resolve();

        // ── Primary: AudioContext ──
        if (audioCtx && audioCtx.state === 'running') {
          try {
            // .slice(0) because decodeAudioData detaches the buffer
            const decoded = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
            if (isStale && isStale()) return resolve();
            const source = audioCtx.createBufferSource();
            source.buffer = decoded;
            source.connect(audioCtx.destination);
            audioRef.current = source;
            source.onended = () => { audioRef.current = null; resolve(); };
            source.start(0);
            return;
          } catch(e) {
            console.warn('AudioContext decode/play failed:', e);
          }
        }

        // ── Fallback: HTMLAudioElement ──
        try {
          if (isStale && isStale()) return resolve();
          const blob = new Blob([arrayBuffer], { type: 'audio/mpeg' });
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audio.setAttribute('playsinline', '');
          audioRef.current = audio;
          let done = false;
          const cleanup = () => {
            if (done) return;
            done = true;
            audio.onended = null;
            audio.onerror = null;
            URL.revokeObjectURL(url);
            audioRef.current = null;
            resolve();
          };
          audio.onended = cleanup;
          audio.onerror = cleanup;
          // A rejected play() (iOS autoplay policy outside a gesture) must
          // surface as a real error, not resolve as if the sentence played
          // — swallowing it hid every silent-playback failure mode.
          audio.play().catch((err) => {
            if (done) return;
            done = true;
            audio.onended = null;
            audio.onerror = null;
            URL.revokeObjectURL(url);
            audioRef.current = null;
            reject(err || new Error('audio-play-blocked'));
          });
        } catch(e) {
          audioRef.current = null;
          resolve();
        }
      });
    };

    // Strip anything TTS would read aloud literally ("asterisk", "dash",
    // "hash") or stumble over. The visual channel keeps the formatting;
    // speech gets plain prose. Last line of defense behind the prompt.
    const sanitizeForSpeech = (text) => text
      .replace(/\[\[VISUAL\]\]/g, ' ')
      .replace(/[*_#`~]/g, '')
      .replace(/^\s*(?:[-•]|\d+[.)])\s+/gm, '')
      .replace(/\s{2,}/g, ' ')
      .trim();

    // Splits text into sentences for chunked TTS
    const splitSentences = (text) => {
      const parts = text.match(/[^.!?]+[.!?]+[\s]*/g);
      if (!parts) return [text];
      const result = [];
      for (const p of parts) {
        if (result.length > 0 && result[result.length - 1].length < 20) {
          result[result.length - 1] += p;
        } else {
          result.push(p);
        }
      }
      return result;
    };

    // Raw TTS PCM is 24kHz 16-bit signed mono LE.
    const PCM_RATE = 24000;

    const useSpeechSynthesis = () => {
      const audioRef = React.useRef(null);
      // Sources scheduled by the gapless PCM path that haven't ended yet —
      // cancel() must stop all of them, not just the current one.
      const liveSourcesRef = React.useRef(new Set());
      const cancelledRef = React.useRef(false);
      // Generation counter shared across all speakStreaming sessions. When a
      // new session starts it claims the next generation; older sessions
      // detect they're stale and bail. Without this, a fresh session
      // resetting cancelledRef would let a paused old loop resume playback
      // on top of the new audio — the "echo" bug.
      const streamGenRef = React.useRef(0);

      // Surfaced TTS error — read by the App to show a banner when TTS
      // fails, so the failure mode is "no audio + clear error" instead of
      // a robotic browser-voice fallback that silently masks the real bug.
      const lastErrorRef = React.useRef(null);
      const getLastError = () => lastErrorRef.current;

      const speakStreaming = () => {
        cancelledRef.current = false;
        lastErrorRef.current = null;
        const myGen = ++streamGenRef.current;
        const isStale = () => cancelledRef.current || myGen !== streamGenRef.current;
        let resolveFinished;
        let doneAdding = false;
        const finished = new Promise(r => { resolveFinished = r; });

        // ── Primary: gapless PCM streaming ──
        // Each sentence is fetched as raw PCM and spliced onto the
        // AudioContext timeline the moment bytes arrive: speech starts on
        // the first network chunk (not after the whole file is generated),
        // and consecutive chunks/sentences join without audible gaps.
        if (audioCtx && audioCtx.state === 'running') {
          const sentences = [];
          let nextStartTime = 0;
          let livePlaying = 0;
          let streaming = false;
          let streamIndex = 0;

          const maybeFinish = () => {
            if (isStale()) { resolveFinished(); return; }
            if (doneAdding && !streaming && streamIndex >= sentences.length && livePlaying === 0) {
              resolveFinished();
            }
          };

          // Continuous 24kHz → context-rate resampler with interpolation
          // state carried across network chunks. Buffers handed to the
          // context are already at its native rate, so butt-joined sources
          // play back sample-exact. The old approach (one 24kHz buffer per
          // network chunk) let each BufferSource resample independently —
          // the browser pads chunk edges with zeros while resampling, which
          // put an audible click at EVERY chunk boundary: the "crackly
          // line". The last input sample of each chunk is held back so the
          // first output of the next chunk interpolates across the seam.
          const outRate = audioCtx.sampleRate;
          const step = PCM_RATE / outRate;
          let pcmTail = new Float32Array(0);
          let pcmPos = 0;

          const resamplePCM = (int16) => {
            const inBuf = new Float32Array(pcmTail.length + int16.length);
            inBuf.set(pcmTail, 0);
            for (let i = 0; i < int16.length; i++) inBuf[pcmTail.length + i] = int16[i] / 32768;
            const out = [];
            let t = pcmPos;
            while (t < inBuf.length - 1) {
              const i0 = t | 0;
              const frac = t - i0;
              out.push(inBuf[i0] + (inBuf[i0 + 1] - inBuf[i0]) * frac);
              t += step;
            }
            const keepFrom = Math.min(t | 0, Math.max(inBuf.length - 1, 0));
            pcmTail = inBuf.subarray(keepFrom);
            pcmPos = t - keepFrom;
            return Float32Array.from(out);
          };

          // Coalesce resampled audio into ≥40ms buffers before scheduling
          // (except when flushing) — scheduling a source per tiny network
          // chunk multiplies the seams and the main-thread work.
          const MIN_SCHED = Math.round(outRate * 0.04);
          let held = [];
          let heldLen = 0;
          const pushSamples = (f32, flush) => {
            // A cancelled session must never schedule more audio — the
            // barge-in cancel() already stopped everything on the timeline.
            if (isStale()) { held = []; heldLen = 0; return; }
            if (f32.length) { held.push(f32); heldLen += f32.length; }
            if (!heldLen || (!flush && heldLen < MIN_SCHED)) return;
            const joined = new Float32Array(heldLen);
            let o = 0;
            for (const a of held) { joined.set(a, o); o += a.length; }
            held = []; heldLen = 0;
            const buffer = audioCtx.createBuffer(1, joined.length, outRate);
            buffer.getChannelData(0).set(joined);
            scheduleChunk(buffer);
          };

          const scheduleChunk = (audioBuffer) => {
            const src = audioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(audioCtx.destination);
            liveSourcesRef.current.add(src);
            livePlaying++;
            src.onended = () => {
              liveSourcesRef.current.delete(src);
              livePlaying--;
              maybeFinish();
            };
            // Butt each chunk up against the end of the previous one on the
            // context clock — this is what makes playback seamless. 60ms of
            // headroom on a (re)start: with only 30ms, a busy main thread
            // (React re-rendering on every stream delta) could miss the
            // start time and clip the front of the chunk.
            const at = Math.max(audioCtx.currentTime + 0.06, nextStartTime);
            src.start(at);
            nextStartTime = at + audioBuffer.duration;
          };

          const pump = async () => {
            if (streaming) return;
            streaming = true;
            while (streamIndex < sentences.length) {
              if (isStale()) break;
              try {
                const res = await sentences[streamIndex];
                if (!res.ok) throw new Error(`TTS ${res.status}`);
                const reader = res.body.getReader();
                // Watchdog per read: the server's 8s abort only covers time
                // to headers — a body that stalls mid-stream would otherwise
                // hang `finished` forever and freeze the reply pipeline.
                const readWithTimeout = () => new Promise((resolve, reject) => {
                  const t = setTimeout(() => reject(new Error('tts-stalled')), 10000);
                  reader.read().then(
                    (v) => { clearTimeout(t); resolve(v); },
                    (err) => { clearTimeout(t); reject(err); }
                  );
                });
                let leftover = new Uint8Array(0);
                try {
                  while (true) {
                    const { done, value } = await readWithTimeout();
                    if (isStale()) { try { reader.cancel(); } catch (e) {} break; }
                    if (done) break;
                    let bytes = value;
                    if (leftover.length) {
                      const joined = new Uint8Array(leftover.length + value.length);
                      joined.set(leftover, 0);
                      joined.set(value, leftover.length);
                      bytes = joined;
                    }
                    // Only whole 16-bit samples; carry odd trailing byte over.
                    const usable = bytes.length & ~1;
                    leftover = bytes.subarray(usable);
                    if (usable >= 2) {
                      const view = new DataView(bytes.buffer, bytes.byteOffset, usable);
                      const int16 = new Int16Array(usable >> 1);
                      for (let i = 0; i < int16.length; i++) int16[i] = view.getInt16(i * 2, true);
                      pushSamples(resamplePCM(int16), false);
                    }
                  }
                } catch (readErr) {
                  // Stalled or broken body: drop this sentence and move on —
                  // the pipeline (and `finished`) must keep flowing.
                  try { reader.cancel(); } catch (e) {}
                  throw readErr;
                }
                // Sentence over: a single zero sample releases the held-back
                // tail sample from the resampler (fading the seam to
                // silence), then flush whatever is coalesced.
                pushSamples(resamplePCM(new Int16Array(1)), true);
              } catch (e) {
                // One failed sentence must not silence the rest.
                console.error('Stream TTS chunk error:', e);
                lastErrorRef.current = e?.message || String(e);
                pushSamples(new Float32Array(0), true);
              }
              streamIndex++;
            }
            streaming = false;
            maybeFinish();
          };

          return {
            addSentence: (sentence) => {
              if (isStale()) return;
              const clean = sanitizeForSpeech(sentence);
              if (!clean) return;
              // Fire the request immediately so generation of the next
              // sentence overlaps playback of the current one.
              sentences.push(fetchPCMStream(clean));
              pump();
            },
            finish: () => {
              doneAdding = true;
              maybeFinish();
              return finished;
            },
          };
        }

        // ── Fallback: buffered MP3 path (no running AudioContext) ──
        const queue = [];
        let playIndex = 0;
        let playing = false;

        const tryPlay = async () => {
          if (playing) return;
          playing = true;
          while (playIndex < queue.length) {
            if (isStale()) break;
            try {
              const buf = await queue[playIndex];
              if (isStale()) break;
              await playAudioBuffer(buf, audioRef, isStale);
            } catch (e) {
              console.error('Stream TTS chunk error:', e);
              lastErrorRef.current = e?.message || String(e);
            }
            playIndex++;
          }
          playing = false;
          // A cancelled/stale session must still resolve `finished` —
          // otherwise an interrupted sendToClaude awaits it forever.
          if (isStale() || (doneAdding && playIndex >= queue.length)) resolveFinished();
        };

        const addSentence = (sentence) => {
          if (isStale()) return;
          const clean = sanitizeForSpeech(sentence);
          if (!clean) return;
          queue.push(fetchTTSBuffer(clean));
          tryPlay();
        };

        const finish = () => {
          doneAdding = true;
          if (isStale() || playIndex >= queue.length) resolveFinished();
          else tryPlay();
          return finished;
        };

        return { addSentence, finish };
      };

      const cancel = () => {
        cancelledRef.current = true;
        // Stop every source the gapless path has scheduled, not just the
        // one currently audible — later chunks are already on the timeline.
        for (const src of liveSourcesRef.current) {
          try { src.stop(); } catch(e) {}
        }
        liveSourcesRef.current.clear();
        try {
          const ref = audioRef.current;
          if (ref && typeof ref.stop === 'function') ref.stop();       // BufferSource
          else if (ref && typeof ref.pause === 'function') ref.pause(); // HTMLAudioElement
        } catch(e) {}
        audioRef.current = null;
        try { window.speechSynthesis?.cancel(); } catch(e) {}
      };

      return { speakStreaming, cancel, getLastError };
    };

    // ── ElevenLabs Voice Stack (Agents platform over raw WebSocket) ──
    //
    // The v0.2 challenger stack. One tap opens a continuous conversation:
    // mic PCM streams up a signed WebSocket minted by /api/eleven-session,
    // ElevenLabs runs ASR + turn-taking + barge-in + TTS server-side, and
    // the LLM behind their agent is our own /api/eleven-llm proxy (Claude +
    // the A/B prompt, sent per session via custom_llm_extra_body) — so only
    // the ears and mouth differ from the control stack. This speaks their
    // documented Agents WebSocket contract directly rather than pulling in
    // their SDK, keeping the no-build vendored-deps rule intact.

    const b64ToInt16 = (b64) => {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Int16Array(bytes.buffer, 0, bytes.length >> 1);
    };

    const int16ToB64 = (int16) => {
      const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
      let bin = '';
      const CHUNK = 0x8000; // String.fromCharCode arg-count limit headroom
      for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return btoa(bin);
    };

    // ElevenLabs ASR ingests 16kHz PCM16 (configured in eleven-session.js).
    const ELEVEN_INPUT_RATE = 16000;

    const useElevenLabsVoice = () => {
      const wsRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const micNodesRef = React.useRef(null);   // { source, processor, sink, analyser }
      const levelRef = React.useRef(0);
      const levelAnimRef = React.useRef(null);
      const activeRef = React.useRef(false);
      // Same generation-counter pattern as useRealtimeSTT: endSession bumps
      // it and every await re-checks, so a teardown mid-setup can't leave a
      // ghost session with a hot mic.
      const genRef = React.useRef(0);
      // True while the rest of the current agent turn's audio should be
      // dropped (manual barge-in / escape hatch); cleared on the next
      // captured user turn.
      const suppressRef = React.useRef(false);
      const speakingRef = React.useRef(false);
      // Gapless playback state — same technique as the TTS PCM path:
      // agent PCM resampled to the context rate with interpolation state
      // carried across chunks, buffers butt-joined on the timeline.
      const playRef = React.useRef(null);       // { sources, nextStart, tail, pos, rate }

      const supported = typeof window !== 'undefined'
        && !!window.WebSocket
        && !!navigator.mediaDevices?.getUserMedia
        && !!(window.AudioContext || window.webkitAudioContext);

      const stopPlayback = () => {
        speakingRef.current = false;
        const p = playRef.current;
        if (!p) return;
        for (const src of p.sources) {
          src.onended = null;
          try { src.stop(); } catch (e) {}
        }
        p.sources.clear();
        p.nextStart = 0;
        p.tail = new Float32Array(0);
        p.pos = 0;
      };

      const suppressTurn = () => {
        suppressRef.current = true;
        stopPlayback();
      };

      const endSession = () => {
        genRef.current++;
        activeRef.current = false;
        suppressRef.current = false;
        if (levelAnimRef.current) { cancelAnimationFrame(levelAnimRef.current); levelAnimRef.current = null; }
        if (micNodesRef.current) {
          const n = micNodesRef.current;
          try { n.processor.onaudioprocess = null; } catch (e) {}
          try { n.source.disconnect(); } catch (e) {}
          try { n.processor.disconnect(); } catch (e) {}
          try { n.sink.disconnect(); } catch (e) {}
          micNodesRef.current = null;
        }
        if (wsRef.current) {
          const ws = wsRef.current;
          wsRef.current = null;
          try {
            ws.onopen = null; ws.onmessage = null; ws.onerror = null; ws.onclose = null;
            ws.close(1000, 'User ended conversation');
          } catch (e) {}
        }
        if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
        stopPlayback();
        levelRef.current = 0;
      };

      React.useEffect(() => () => endSession(), []);

      const startSession = async ({
        firstMessage, systemPrompt, extraBody, getMuted,
        onInterim, onUserTranscript, onAgentTentative, onAgentResponse,
        onAgentCorrection, onSpeakStart, onSpeakEnd, onInterrupted,
        onError, onDisconnect,
      }) => {
        endSession();
        const myGen = genRef.current;
        const cancelled = () => genRef.current !== myGen;

        // Mint the session while the mic permission/device spins up — the
        // same overlap trick as the realtime path; every serial round-trip
        // is a moment where first words fall on a dead mic.
        const sessionPromise = fetch('/api/eleven-session', { method: 'POST' })
          .then(async (r) => {
            if (!r.ok) {
              // Surface the server's actual error — "mint-failed" alone
              // hides whether the key is missing, ElevenLabs rejected the
              // agent config, or the signed URL failed.
              const body = await r.text().catch(() => '');
              console.error('[eleven] session mint failed:', r.status, body);
              throw new Error('mint-failed');
            }
            return r.json();
          })
          .catch((e) => {
            if (e?.message !== 'mint-failed') console.error('[eleven] session mint unreachable:', e);
            return null;
          });

        let stream;
        try {
          // Echo cancellation keeps the open mic from hearing the agent.
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
        } catch (e) {
          const name = e?.name || '';
          if (cancelled()) return false;
          if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            onError('not-allowed');
          } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            onError('no-mic');
          } else {
            onError('mic-failed');
          }
          return false;
        }
        if (cancelled()) { stream.getTracks().forEach(t => t.stop()); return false; }
        streamRef.current = stream;
        stream.getTracks().forEach(t => {
          t.onended = () => { if (!cancelled() && activeRef.current) onError('connection-lost'); };
        });

        let ws = null;
        try {
          const session = await sessionPromise;
          if (cancelled()) throw new Error('cancelled');
          if (!session || !session.signed_url) throw new Error('mint-failed');

          // Ground truth on every tap: the voice the agent actually holds.
          // A mismatch + patch_error is the "voice never changes" bug made
          // visible (the config PATCH being rejected upstream).
          if (session.agent_voice_id) {
            if (session.expected_voice_id && session.agent_voice_id !== session.expected_voice_id) {
              console.error('[eleven] agent voice MISMATCH — holds', session.agent_voice_id,
                'expected', session.expected_voice_id,
                session.patch_error ? `— config patch failed: ${session.patch_error}` : '');
            } else {
              console.log('[eleven] agent voice:', session.agent_voice_id, `(${session.agent_tts_model || '?'})`);
            }
          }

          // The mic tap that started this session already ran the global
          // ensureAudioContext listener; without a running context there is
          // neither capture nor playback.
          ensureAudioContext();
          const ctx = audioCtx;
          if (!ctx || ctx.state !== 'running') throw new Error('audio-failed');

            // chunks so butt-joined buffers play back click-free (see the

    //

      const savedConvo = React.useMemo(() => {

      const [transcribing, setTranscribing] = React.useState(false);
      const [textInput, setTextInput] = React.useState('');
      const [error, setError] = React.useState(null);
      const chatEndRef = React.useRef(null);
      const messagesRef = React.useRef(messages);
      const profileRef = React.useRef(profile);
      const activeConvoIdRef = React.useRef(activeConvoId);
