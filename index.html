<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/images/favicon-64.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://api.openai.com">
  <link rel="preconnect" href="https://api.elevenlabs.io">
  <meta name="description" content="Feel Understood — Sandbox. A test rig for A/B testing two versions of the conversation coach.">
  <title>Feel Understood — Sandbox</title>
  <link rel="stylesheet" href="styles.css">
  <!-- React is vendored (pinned 18.3.1) so a CDN outage or an unpinned
       "latest" release can never break the app for testers. The app code
       is plain React.createElement — no JSX — so Babel Standalone was
       dead weight (~3MB + runtime compile on every load) and is gone. -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>

    // ── Conversation Persistence (localStorage) ──
    const STORAGE_KEYS = {
      conversations: 'fu_conversations',
      activeId: 'fu_active_conversation',
      profile: 'fu_profile',
      voiceMuted: 'fu_voice_muted',
      sotVariant: 'fu_sot_variant',
    };
    const MAX_CONVERSATIONS = 50;

    // ── Sandbox configuration ──
    // This is the Sandbox rig (see Feel_Understood_Sandbox_Build_Brief_V1.1.md):
    // a single name → Helpline path with an A/B toggle between two
    // system-prompt variants.
    const SANDBOX_VERSION = 'sandbox-0.1';

    const generateId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    const loadFromStorage = (key, fallback) => {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    };

    const saveToStorage = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    };

    const loadConversations = () => loadFromStorage(STORAGE_KEYS.conversations, []);

    const saveConversation = (convo) => {
      const all = loadConversations();
      const idx = all.findIndex(c => c.id === convo.id);
      if (idx >= 0) all[idx] = convo;
      else all.unshift(convo);
      // Cap at MAX_CONVERSATIONS
      if (all.length > MAX_CONVERSATIONS) all.length = MAX_CONVERSATIONS;
      saveToStorage(STORAGE_KEYS.conversations, all);
    };

    const loadProfile = () => loadFromStorage(STORAGE_KEYS.profile, null);
    const saveProfile = (profile) => saveToStorage(STORAGE_KEYS.profile, profile);

    // ── Voice stack ──
    // The ElevenLabs Agents stack is the only voice pipeline in this build:
    // their ASR, turn-taking, barge-in and TTS over one WebSocket, with the
    // LLM pointed back at our /api/eleven-llm proxy so Claude and the A/B
    // prompt toggle sit behind it. Transcripts are stamped with this so they
    // can be told apart from the earlier bake-off's OpenAI-stack runs.
    const VOICE_STACK = 'elevenlabs';

    // ── System prompt ──
    // Built server-side, in api/_prompts.js — the Source of Truth is not in
    // this file, so it can't be read with View Source or from the network
    // tab. The client sends only the profile ({ name }) and the variant key
    // to /api/chat-stream (as `profile` + `variant`) and to the ElevenLabs
    // agent's extra body (`fu_profile` + `fu_variant`, which /api/eleven-llm
    // reads); the prompt text never reaches the browser. The A ↔ light /
    // B ↔ deep mapping lives only in that server file, which keeps the
    // tester A/B blind.
    const SOT_VARIANT_KEYS = ['A', 'B'];
    const DEFAULT_SOT_VARIANT = 'A';
    const normalizeVariant = (v) => {
      const key = String(v || '').toUpperCase();
      return SOT_VARIANT_KEYS.includes(key) ? key : null;
    };
    // ?v=a / ?v=b forces the variant (and persists it), so two links can be
    // sent to two testers and each test attributed afterwards.
    const urlForcedVariant = (() => {
      try { return normalizeVariant(new URLSearchParams(location.search).get('v')); }
      catch { return null; }
    })();
    const loadSotVariant = () => {
      if (urlForcedVariant) {
        saveToStorage(STORAGE_KEYS.sotVariant, urlForcedVariant);
        return urlForcedVariant;
      }
      return normalizeVariant(loadFromStorage(STORAGE_KEYS.sotVariant, null)) || DEFAULT_SOT_VARIANT;
    };

    // ── Greeting (first assistant message) ──
    // The coach introduces itself and what it can do — the user arrives
    // with no questionnaire context.
    const buildIntroGreeting = (name) => {
      return `Hi ${name}, welcome \u2014 I\u2019m your conversation coach. I help people with the conversations that matter to them. We can talk through a tricky one you\u2019ve got coming up, unpack one that didn\u2019t go the way you hoped, or practice what you want to say \u2014 I can even play the other person so you can try it out loud. And if you\u2019d simply like to talk something through and feel properly heard, that works too. So \u2014 what\u2019s on your mind today?`;
    };

    const buildGreeting = (profile) => buildIntroGreeting(profile?.name || 'there');

    // ── LandingGate Component ──
    // Shown once before anything else — the sandbox homescreen.
    const LandingGate = ({ onStart }) => {
      return React.createElement('div', { className: 'gate-screen' },
        React.createElement('div', { className: 'gate-inner' },
          React.createElement('span', { className: 'gate-eyebrow' }, 'Sandbox'),
          React.createElement('h1', { className: 'gate-title' }, 'Feel Understood'),
          React.createElement('p', { className: 'gate-lede' },
            "Sandbox \u2014 testing two versions of the coach. Tell us your first name and you\u2019ll go straight into the Communication Helpline."
          ),
          React.createElement('button', {
            className: 'gate-cta',
            onClick: onStart,
          }, 'Start'),
          React.createElement('p', { className: 'gate-note' },
            "No sign-up \u2014 you\u2019ll be talking within seconds. Conversations are stored only on this device."
          ),
        )
      );
    };

    // ── NameScreen Component ──
    // The only onboarding step: first name → straight into the Helpline.
    const NameScreen = ({ onComplete }) => {
      const [name, setName] = React.useState('');
      const nameInputRef = React.useRef(null);

      React.useEffect(() => {
        const t = setTimeout(() => nameInputRef.current?.focus(), 400);
        return () => clearTimeout(t);
      }, []);

      const handleNameSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onComplete({ name: name.trim() });
      };

      return React.createElement('div', { className: 'quiz-container' },
        React.createElement('div', { className: 'quiz-screen quiz-name quiz-enter' },
          React.createElement('h2', { className: 'quiz-title' }, 'First \u2014 what should we call you?'),
          React.createElement('p', { className: 'quiz-subtitle' }, 'This is a personal journey. Your name helps make it yours.'),
          React.createElement('form', { className: 'quiz-name-form', onSubmit: handleNameSubmit },
            React.createElement('input', {
              ref: nameInputRef,
              type: 'text',
              className: 'quiz-name-input',
              value: name,
              onChange: (e) => setName(e.target.value),
              placeholder: 'Your first name',
              maxLength: 30,
              autoComplete: 'given-name',
            }),
            React.createElement('button', {
              type: 'submit',
              className: `quiz-cta ${name.trim() ? '' : 'quiz-cta-disabled'}`,
              disabled: !name.trim(),
            }, 'Continue'),
          )
        )
      );
    };

    // ── Shared AudioContext ──
    //
    // iOS WebKit only lets audio start inside the synchronous callstack of
    // a user gesture — but an AudioContext created and resumed during a
    // gesture can schedule buffers freely afterwards. The agent's PCM is
    // spliced onto this one context's timeline, and the mic is tapped off
    // it too.

    let audioCtx = null;

    // Called on every user interaction to ensure AudioContext is alive.
    // The resume gate is "not running" rather than === 'suspended': iOS
    // WebKit parks the context in a nonstandard 'interrupted' state after a
    // phone call / Siri / screen lock, and a context left there would mute
    // every reply for the rest of the visit with no error shown.
    const ensureAudioContext = () => {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state !== 'running' && audioCtx.state !== 'closed') {
          audioCtx.resume().catch(() => {});
        }
      } catch(e) {
        console.warn('AudioContext init failed:', e);
      }
    };

    // Listen on EVERY tap — AudioContext can get suspended by iOS at any
    // time — and on return to the foreground, which is when an
    // interruption (call/Siri/lock) is over and the context can recover
    // without waiting for a tap that hands-free users never make.
    document.addEventListener('touchstart', ensureAudioContext, true);
    document.addEventListener('touchend', ensureAudioContext, true);
    document.addEventListener('click', ensureAudioContext, true);
    document.addEventListener('visibilitychange', ensureAudioContext, true);

    // ── ElevenLabs Voice Stack (Agents platform over raw WebSocket) ──
    //
    // One tap opens a continuous conversation: mic PCM streams up a signed
    // WebSocket minted by /api/eleven-session, ElevenLabs runs ASR +
    // turn-taking + barge-in + TTS server-side, and the LLM behind their
    // agent is our own /api/eleven-llm proxy (Claude + the A/B prompt, sent
    // per session via custom_llm_extra_body). This speaks their documented
    // Agents WebSocket contract directly rather than pulling in their SDK,
    // keeping the no-build vendored-deps rule intact.

    const b64ToInt16 = (b64) => {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Int16Array(bytes.buffer, 0, bytes.length >> 1);
    };

    const int16ToB64 = (int16) => {
      const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
      let bin = '';
      const CHUNK = 0x8000; // String.fromCharCode arg-count limit headroom
      for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return btoa(bin);
    };

    // ElevenLabs ASR ingests 16kHz PCM16 (configured in eleven-session.js).
    const ELEVEN_INPUT_RATE = 16000;

    const useElevenLabsVoice = () => {
      const wsRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const micNodesRef = React.useRef(null);   // { source, processor, sink, analyser }
      const levelRef = React.useRef(0);
      const levelAnimRef = React.useRef(null);
      const activeRef = React.useRef(false);
      // Generation counter: endSession bumps it and every await re-checks,
      // so a teardown mid-setup can't leave a ghost session with a hot mic.
      const genRef = React.useRef(0);
      // True while the rest of the current agent turn's audio should be
      // dropped (manual barge-in / escape hatch); cleared on the next
      // captured user turn.
      const suppressRef = React.useRef(false);
      const speakingRef = React.useRef(false);
      // Gapless playback state: agent PCM resampled to the context rate
      // with interpolation state carried across chunks, buffers butt-joined
      // on the timeline.
      const playRef = React.useRef(null);       // { sources, nextStart, tail, pos, rate }

      const supported = typeof window !== 'undefined'
        && !!window.WebSocket
        && !!navigator.mediaDevices?.getUserMedia
        && !!(window.AudioContext || window.webkitAudioContext);

      const stopPlayback = () => {
        speakingRef.current = false;
        const p = playRef.current;
        if (!p) return;
        for (const src of p.sources) {
          src.onended = null;
          try { src.stop(); } catch (e) {}
        }
        p.sources.clear();
        p.nextStart = 0;
        p.tail = new Float32Array(0);
        p.pos = 0;
      };

      const suppressTurn = () => {
        suppressRef.current = true;
        stopPlayback();
      };

      const endSession = () => {
        genRef.current++;
        activeRef.current = false;
        suppressRef.current = false;
        if (levelAnimRef.current) { cancelAnimationFrame(levelAnimRef.current); levelAnimRef.current = null; }
        if (micNodesRef.current) {
          const n = micNodesRef.current;
          try { n.processor.onaudioprocess = null; } catch (e) {}
          try { n.source.disconnect(); } catch (e) {}
          try { n.processor.disconnect(); } catch (e) {}
          try { n.sink.disconnect(); } catch (e) {}
          micNodesRef.current = null;
        }
        if (wsRef.current) {
          const ws = wsRef.current;
          wsRef.current = null;
          try {
            ws.onopen = null; ws.onmessage = null; ws.onerror = null; ws.onclose = null;
            ws.close(1000, 'User ended conversation');
          } catch (e) {}
        }
        if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
        stopPlayback();
        levelRef.current = 0;
      };

      React.useEffect(() => () => endSession(), []);

      const startSession = async ({
        firstMessage, extraBody, getMuted,
        onInterim, onUserTranscript, onAgentTentative, onAgentResponse,
        onAgentCorrection, onSpeakStart, onSpeakEnd, onInterrupted,
        onError, onDisconnect,
      }) => {
        endSession();
        const myGen = genRef.current;
        const cancelled = () => genRef.current !== myGen;

        // Mint the session while the mic permission/device spins up —
        // every serial round-trip is a moment where first words fall on a
        // dead mic.
        const sessionPromise = fetch('/api/eleven-session', { method: 'POST' })
          .then(async (r) => {
            if (!r.ok) {
              // Surface the server's actual error — "mint-failed" alone
              // hides whether the key is missing, ElevenLabs rejected the
              // agent config, or the signed URL failed.
              const body = await r.text().catch(() => '');
              console.error('[eleven] session mint failed:', r.status, body);
              throw new Error('mint-failed');
            }
            return r.json();
          })
          .catch((e) => {
            if (e?.message !== 'mint-failed') console.error('[eleven] session mint unreachable:', e);
            return null;
          });

        let stream;
        try {
          // Echo cancellation keeps the open mic from hearing the agent.
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
        } catch (e) {
          const name = e?.name || '';
          if (cancelled()) return false;
          if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            onError('not-allowed');
          } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
            onError('no-mic');
          } else {
            onError('mic-failed');
          }
          return false;
        }
        if (cancelled()) { stream.getTracks().forEach(t => t.stop()); return false; }
        streamRef.current = stream;
        stream.getTracks().forEach(t => {
          t.onended = () => { if (!cancelled() && activeRef.current) onError('connection-lost'); };
        });

        let ws = null;
        try {
          const session = await sessionPromise;
          if (cancelled()) throw new Error('cancelled');
          if (!session || !session.signed_url) throw new Error('mint-failed');

          // The mic tap that started this session already ran the global
          // ensureAudioContext listener; without a running context there is
          // neither capture nor playback.
          ensureAudioContext();
          const ctx = audioCtx;
          if (!ctx || ctx.state !== 'running') throw new Error('audio-failed');

          ws = new WebSocket(session.signed_url, ['convai']);
          wsRef.current = ws;

          // The server configures pcm_24000 out / pcm_16000 in; trust the
          // metadata event if it says otherwise.
          let outputRate = session.output_sample_rate || 24000;
          await new Promise((resolve, reject) => {
            const t = setTimeout(() => reject(new Error('open-timeout')), 12000);
            ws.onopen = () => {
              try {
                ws.send(JSON.stringify({
                  type: 'conversation_initiation_client_data',
                  // No prompt override: the agent's brain is our own
                  // /api/eleven-llm proxy, which builds the system prompt
                  // server-side from fu_profile + fu_variant in the extra
                  // body and ignores the system message ElevenLabs passes
                  // along. The prompt text never goes through the browser.
                  conversation_config_override: {
                    agent: {
                      first_message: firstMessage,
                    },
                  },
                  custom_llm_extra_body: extraBody || {},
                }));
              } catch (e) { clearTimeout(t); reject(e); }
            };
            ws.onerror = () => { clearTimeout(t); reject(new Error('connection-failed')); };
            ws.onclose = (ev) => {
              // The close reason is where ElevenLabs explains a rejected
              // handshake (bad signed URL, disallowed override, …).
              console.error('[eleven] ws closed during setup:', ev.code, ev.reason || '(no reason)');
              clearTimeout(t);
              reject(new Error('connection-failed'));
            };
            ws.onmessage = (e) => {
              let msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
              if (msg.type === 'conversation_initiation_metadata') {
                const fmt = msg.conversation_initiation_metadata_event?.agent_output_audio_format || '';
                const rate = parseInt(fmt.split('_')[1], 10);
                if (rate) outputRate = rate;
                clearTimeout(t);
                resolve();
              } else if (msg.type === 'error') {
                console.error('[eleven] server error during setup:', e.data);
                clearTimeout(t);
                reject(new Error('connection-failed'));
              }
            };
          });
          if (cancelled()) throw new Error('cancelled');

          playRef.current = { sources: new Set(), nextStart: 0, tail: new Float32Array(0), pos: 0, rate: outputRate };

          const scheduleAudio = (b64) => {
            const p = playRef.current;
            if (!p || !audioCtx || audioCtx.state !== 'running') return;
            const int16 = b64ToInt16(b64);
            if (!int16.length) return;
            // outputRate → context rate; linear interpolation with the
            // fractional position carried across chunks so butt-joined
            // buffers play back click-free.
            const step = p.rate / audioCtx.sampleRate;
            const inBuf = new Float32Array(p.tail.length + int16.length);
            inBuf.set(p.tail, 0);
            for (let i = 0; i < int16.length; i++) inBuf[p.tail.length + i] = int16[i] / 32768;
            const out = [];
            let pos = p.pos;
            while (pos < inBuf.length - 1) {
              const i0 = pos | 0;
              const frac = pos - i0;
              out.push(inBuf[i0] + (inBuf[i0 + 1] - inBuf[i0]) * frac);
              pos += step;
            }
            const keepFrom = Math.min(pos | 0, Math.max(inBuf.length - 1, 0));
            p.tail = inBuf.subarray(keepFrom);
            p.pos = pos - keepFrom;
            if (!out.length) return;
            const buf = audioCtx.createBuffer(1, out.length, audioCtx.sampleRate);
            buf.copyToChannel(Float32Array.from(out), 0);
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.connect(audioCtx.destination);
            const startAt = Math.max(p.nextStart, audioCtx.currentTime + 0.05);
            src.onended = () => {
              p.sources.delete(src);
              // Drained = the agent finished (or the network starved — in
              // which case the next chunk re-fires onSpeakStart).
              if (p.sources.size === 0 && speakingRef.current) {
                speakingRef.current = false;
                if (onSpeakEnd) onSpeakEnd();
              }
            };
            p.sources.add(src);
            src.start(startAt);
            p.nextStart = startAt + buf.duration;
            if (!speakingRef.current) {
              speakingRef.current = true;
              if (onSpeakStart) onSpeakStart();
            }
          };

          ws.onmessage = (e) => {
            if (cancelled()) return;
            let msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
            if (msg.type === 'ping') {
              try { ws.send(JSON.stringify({ type: 'pong', event_id: msg.ping_event?.event_id })); } catch (err) {}
            } else if (msg.type === 'audio') {
              const b64 = msg.audio_event?.audio_base_64;
              if (b64 && !suppressRef.current && !(getMuted && getMuted())) scheduleAudio(b64);
            } else if (msg.type === 'user_transcript') {
              suppressRef.current = false;
              const text = (msg.user_transcription_event?.user_transcript || '').trim();
              if (text) onUserTranscript(text);
              else onInterim('');
            } else if (msg.type === 'tentative_user_transcript') {
              const ev = msg.tentative_user_transcription_event || {};
              const text = (ev.tentative_user_transcript || ev.user_transcript || '').trim();
              if (text) onInterim(text);
            } else if (msg.type === 'agent_response') {
              onAgentResponse((msg.agent_response_event?.agent_response || '').trim());
            } else if (msg.type === 'internal_tentative_agent_response') {
              const text = (msg.tentative_agent_response_internal_event?.tentative_agent_response || '').trim();
              if (text && onAgentTentative) onAgentTentative(text);
            } else if (msg.type === 'agent_response_correction') {
              const text = (msg.agent_response_correction_event?.corrected_agent_response || '').trim();
              if (text && onAgentCorrection) onAgentCorrection(text);
            } else if (msg.type === 'interruption') {
              // Server-side barge-in: the user talked over the agent.
              stopPlayback();
              if (onInterrupted) onInterrupted();
            } else if (msg.type === 'error') {
              onError(msg.error_event?.message || 'session-error');
            }
          };
          ws.onerror = () => {};
          ws.onclose = (ev) => {
            if (!cancelled() && activeRef.current) {
              console.warn('[eleven] ws closed:', ev.code, ev.reason || '(no reason)');
              activeRef.current = false;
              (onDisconnect || onError)('connection-lost');
            }
          };

          // Mic pump: ScriptProcessor is deprecated but dependency-free —
          // this repo has no build step, and an AudioWorklet would need a
          // module file. 4096 frames ≈ 85ms of 16k audio per send.
          const source = ctx.createMediaStreamSource(stream);
          const processor = ctx.createScriptProcessor(4096, 1, 1);
          let dsTail = new Float32Array(0);
          let dsPos = 0;
          const dsStep = ctx.sampleRate / ELEVEN_INPUT_RATE;
          processor.onaudioprocess = (e) => {
            if (cancelled() || !wsRef.current || wsRef.current.readyState !== 1) return;
            const input = e.inputBuffer.getChannelData(0);
            const inBuf = new Float32Array(dsTail.length + input.length);
            inBuf.set(dsTail, 0);
            inBuf.set(input, dsTail.length);
            const out = [];
            let pos = dsPos;
            while (pos < inBuf.length - 1) {
              const i0 = pos | 0;
              const frac = pos - i0;
              const v = inBuf[i0] + (inBuf[i0 + 1] - inBuf[i0]) * frac;
              out.push(Math.max(-32768, Math.min(32767, Math.round(v * 32767))));
              pos += dsStep;
            }
            const keepFrom = Math.min(pos | 0, Math.max(inBuf.length - 1, 0));
            dsTail = inBuf.subarray(keepFrom);
            dsPos = pos - keepFrom;
            if (!out.length) return;
            try {
              wsRef.current.send(JSON.stringify({ user_audio_chunk: int16ToB64(Int16Array.from(out)) }));
            } catch (err) {}
          };
          // A zero-gain sink keeps the processor pulling (some browsers
          // won't run an unconnected ScriptProcessor) without echoing the
          // mic to the speakers.
          const sink = ctx.createGain();
          sink.gain.value = 0;
          source.connect(processor);
          processor.connect(sink);
          sink.connect(ctx.destination);

          // Mic level for the visualizer, tapped off the same shared
          // context.
          let analyser = null;
          try {
            analyser = ctx.createAnalyser();
            analyser.fftSize = 1024;
            source.connect(analyser);
            const buf = new Uint8Array(analyser.frequencyBinCount);
            const tick = () => {
              if (!micNodesRef.current) return;
              analyser.getByteTimeDomainData(buf);
              let sum = 0;
              for (let i = 0; i < buf.length; i++) {
                const v = (buf[i] - 128) / 128;
                sum += v * v;
              }
              levelRef.current = Math.sqrt(sum / buf.length);
              levelAnimRef.current = requestAnimationFrame(tick);
            };
            levelAnimRef.current = requestAnimationFrame(tick);
          } catch (e) { /* level meter is best-effort */ }
          micNodesRef.current = { source, processor, sink, analyser };

          activeRef.current = true;
          return true;
        } catch (e) {
          if (cancelled() || e?.message === 'cancelled') {
            try { if (ws) ws.close(1000); } catch (err) {}
            stream.getTracks().forEach(t => t.stop());
            return false;
          }
          endSession();
          onError(e?.message === 'mint-failed' ? 'session-unavailable' : 'session-failed');
          return false;
        }
      };

      const isActive = () => activeRef.current
        && !!wsRef.current && wsRef.current.readyState === 1
        && !!streamRef.current
        && streamRef.current.getAudioTracks().some(t => t.readyState === 'live');
      const getLevel = () => levelRef.current;
      // Typed message into a live session — ElevenLabs adds it to the
      // conversation and the agent replies with voice.
      const sendText = (text) => {
        try { wsRef.current?.send(JSON.stringify({ type: 'user_message', text })); } catch (e) {}
      };

      return { supported, startSession, endSession, isActive, getLevel, sendText, suppressTurn, stopPlayback };
    };

    // ── Typing Indicator ──
    const TypingIndicator = () => {
      return React.createElement('div', { className: 'msg-row assistant' },
        React.createElement('div', { className: 'avatar' },
              React.createElement('img', { src: '/images/icon-avatar.svg', alt: '', width: 20, height: 20, className: 'doodle-icon' })
            ),
        React.createElement('div', { className: 'bubble assistant-bubble typing-bubble' },
          ...[0, 1, 2].map(i =>
            React.createElement('div', {
              key: i,
              className: 'typing-dot',
              style: { animationDelay: `${i * 0.2}s` }
            })
          )
        )
      );
    };

    // ── Visual Aid ──
    // Renders the "shown, not spoken" channel of an assistant message — a
    // light markdown subset (bullets, numbered lists, **bold**) displayed
    // as a card under the spoken text. Structure for the eyes, prose for
    // the ears.
    const VisualAid = ({ text }) => {
      const blocks = [];
      let list = null;
      const flush = () => {
        if (list) { blocks.push({ type: 'list', items: list }); list = null; }
      };
      for (const raw of text.split('\n')) {
        const line = raw.trim();
        if (!line) { flush(); continue; }
        const m = line.match(/^(?:[-•*]|\d+[.)])\s+(.*)$/);
        if (m) {
          if (!list) list = [];
          list.push(m[1]);
        } else {
          flush();
          blocks.push({ type: 'p', text: line.replace(/^#+\s*/, '') });
        }
      }
      flush();

      const renderInline = (s) => {
        const parts = s.split(/\*\*(.+?)\*\*/g);
        return parts.map((p, i) => i % 2 ? React.createElement('strong', { key: i }, p) : p);
      };

      return React.createElement('div', { className: 'visual-aid' },
        blocks.map((b, i) => b.type === 'list'
          ? React.createElement('ul', { key: i },
              b.items.map((item, j) => React.createElement('li', { key: j }, renderInline(item))))
          : React.createElement('p', { key: i }, renderInline(b.text))
        )
      );
    };

    // ── Message Bubble ──
    const MessageBubble = ({ role, content, visual }) => {
      const isUser = role === 'user';
      return React.createElement('div', { className: `msg-row ${role}` },
        !isUser && React.createElement('div', { className: 'avatar' },
              React.createElement('img', { src: '/images/icon-avatar.svg', alt: '', width: 20, height: 20, className: 'doodle-icon' })
            ),
        React.createElement('div', {
          className: `bubble ${isUser ? 'user-bubble' : 'assistant-bubble'}`
        },
          content,
          visual && React.createElement(VisualAid, { text: visual }),
        )
      );
    };

    // ── Wave Visualizer ──
    //
    // Without getLevel: bars run a fixed CSS animation (used on the native SR
    // path where a live transcript already signals "we hear you").
    //
    // With getLevel: bars react to live mic RMS from the Whisper-path
    // analyser. This is the affordance that tells the user the mic is on
    // and picking them up — without it, recording feels dead.
    const WaveVisualizer = ({ getLevel }) => {
      const barRefs = React.useRef([]);
      React.useEffect(() => {
        if (!getLevel) return;
        let raf;
        let smoothed = 0;
        const animate = () => {
          // ~0.25 RMS is a normal speaking voice; scale to 0..1.
          const raw = Math.min(1, getLevel() / 0.25);
          // Asymmetric smoothing — snap up fast, decay slow — so the bars
          // feel responsive on each syllable but don't flicker.
          smoothed = raw > smoothed
            ? smoothed * 0.3 + raw * 0.7
            : smoothed * 0.85 + raw * 0.15;
          for (let i = 0; i < barRefs.current.length; i++) {
            const el = barRefs.current[i];
            if (!el) continue;
            // Slight per-bar phase so they don't all move in lockstep.
            const wobble = 0.75 + 0.25 * Math.sin(Date.now() / 180 + i * 0.9);
            const h = 4 + smoothed * 22 * wobble;
            el.style.height = h + 'px';
          }
          raf = requestAnimationFrame(animate);
        };
        raf = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(raf);
      }, [getLevel]);

      return React.createElement('div', { className: 'wave-viz' },
        ...[0,1,2,3,4,5,6].map(i =>
          React.createElement('div', {
            key: i,
            ref: el => { barRefs.current[i] = el; },
            className: getLevel ? 'wave-bar reactive' : 'wave-bar',
            style: getLevel ? null : { animationDelay: `${i * 0.1}s` }
          })
        )
      );
    };

    // ── Main App ──
    const App = () => {
      // Restore persisted state on mount
      const savedProfile = React.useMemo(() => loadProfile(), []);
      const savedActiveId = React.useMemo(() => loadFromStorage(STORAGE_KEYS.activeId, null), []);
      const savedConvo = React.useMemo(() => {
        if (!savedActiveId) return null;
        const convo = loadConversations().find(c => c.id === savedActiveId) || null;
        // Clean A/B: never resume a conversation held under a different
        // variant (pill switched, or a ?v= link opened, since it was saved)
        // — fall through to a fresh greeting instead. The old transcript
        // stays in storage with its original variant stamp.
        if (convo && convo.variant && convo.variant !== loadSotVariant()) return null;
        // Same rule for the voice stack: a transcript from the retired
        // OpenAI stack is never resumed under this one.
        if (convo && convo.voiceStack && convo.voiceStack !== VOICE_STACK) return null;
        return convo;
      }, []);

      // A saved profile also counts as onboarded: greeting-only conversations
      // are deliberately never persisted, so between finishing onboarding and
      // sending the first message a reload used to fall back into the
      // questionnaire (losing the beta greeting, or the whole quiz). Seed a
      // silent greeting conversation instead — voiceState starts 'idle', so
      // nothing speaks and the mic stays off.
      const [started, setStarted] = React.useState(!!savedConvo || !!savedProfile);
      const [profile, setProfile] = React.useState(savedProfile);
      const [messages, setMessages] = React.useState(() =>
        savedConvo ? savedConvo.messages
        : savedProfile ? [{ role: 'assistant', content: buildGreeting(savedProfile) }]
        : []);
      const [activeConvoId, setActiveConvoId] = React.useState(() =>
        savedConvo ? savedConvo.id : (savedProfile ? generateId() : null));
      const [voiceState, setVoiceState] = React.useState('idle');
      const [interimText, setInterimText] = React.useState('');
      const [textInput, setTextInput] = React.useState('');
      const [error, setError] = React.useState(null);
      const chatEndRef = React.useRef(null);
      const messagesRef = React.useRef(messages);
      const profileRef = React.useRef(profile);
      const activeConvoIdRef = React.useRef(activeConvoId);
      const eleven = useElevenLabsVoice();
      // Hands-free conversation: one tap opens a continuous agent session;
      // turns and barge-in are detected on ElevenLabs' side.
      const [handsFree, setHandsFree] = React.useState(false);
      const handsFreeRef = React.useRef(false);
      // True while the session is being (re)built — the mic isn't actually
      // hearing anything yet, and the status label must say so instead of
      // claiming "Listening" while first words fall into a void.
      const [rtConnecting, setRtConnecting] = React.useState(false);
      // Mirror of voiceState for session event callbacks, which outlive
      // any single render.
      const voiceStateRef = React.useRef('idle');
      React.useEffect(() => { voiceStateRef.current = voiceState; }, [voiceState]);
      // Voice replies off: the agent's audio is dropped and replies land as
      // text only. The escape hatch for testers in bad audio environments —
      // they can keep evaluating the coaching with the mic and/or keyboard
      // while the assistant stays silent. Persisted per device.
      const [voiceMuted, setVoiceMuted] = React.useState(() => loadFromStorage(STORAGE_KEYS.voiceMuted, false));
      const voiceMutedRef = React.useRef(voiceMuted);
      React.useEffect(() => { voiceMutedRef.current = voiceMuted; }, [voiceMuted]);

      // ── Sandbox A/B state ──
      const [sotVariant, setSotVariant] = React.useState(() => loadSotVariant());
      const sotVariantRef = React.useRef(sotVariant);
      React.useEffect(() => { sotVariantRef.current = sotVariant; }, [sotVariant]);
      // Landing Gate "passed" flag — returning testers skip the gate.
      const [gatePassed, setGatePassed] = React.useState(() => !!(savedProfile || savedConvo));

      const toggleVoiceMuted = () => {
        const next = !voiceMutedRef.current;
        voiceMutedRef.current = next;
        setVoiceMuted(next);
        saveToStorage(STORAGE_KEYS.voiceMuted, next);
        if (next) {
          // Muting mid-reply silences playback immediately; the reply
          // keeps streaming into the chat as text.
          eleven.stopPlayback();
          if (voiceStateRef.current === 'speaking') {
            const v = handsFreeRef.current ? 'listening' : 'idle';
            voiceStateRef.current = v;
            setVoiceState(v);
          }
        }
      };
      // AbortController for the in-flight /api/chat-stream request. Aborted
      // when the user interrupts or starts a new turn, so a stale stream can
      // never keep writing into the conversation underneath the new one.
      const streamAbortRef = React.useRef(null);

      // Hard-stop everything voice-related: the open agent session and any
      // in-flight text-fallback reply stream.
      const stopVoicePipeline = () => {
        if (handsFreeRef.current) {
          handsFreeRef.current = false;
          setHandsFree(false);
        }
        eleven.endSession();
        streamAbortRef.current?.abort();
      };

      React.useEffect(() => { messagesRef.current = messages; }, [messages]);
      React.useEffect(() => { profileRef.current = profile; }, [profile]);
      React.useEffect(() => { activeConvoIdRef.current = activeConvoId; }, [activeConvoId]);

      // Auto-save messages to localStorage whenever they change. Greeting-
      // only conversations are not persisted — every New Chat / mode switch
      // used to save a junk "New conversation" entry that cluttered the
      // history list and counted against the 50-conversation cap.
      React.useEffect(() => {
        if (!activeConvoIdRef.current || messages.length === 0) return;
        if (!messages.some(m => m.role === 'user')) return;
        // Debounced: streaming updates `messages` on every SSE delta, and a
        // full localStorage parse/stringify of all conversations per delta
        // janked audio playback on low-end phones. Trailing save 400ms after
        // the last change covers stream-end, abort, and normal sends alike.
        const t = setTimeout(() => {
          const convo = {
            id: activeConvoIdRef.current,
            title: messages.find(m => m.role === 'user')?.content.slice(0, 60) || 'New conversation',
            messages,
            updatedAt: Date.now(),
            // Transcript stamp — blind tests are worthless if we can't
            // attribute them afterwards. Only the neutral key is stamped;
            // the A/B ↔ light/deep mapping lives in api/_prompts.js.
            variant: sotVariantRef.current,
            sandboxVersion: SANDBOX_VERSION,
            voiceStack: VOICE_STACK,
          };
          saveConversation(convo);
          saveToStorage(STORAGE_KEYS.activeId, activeConvoIdRef.current);
        }, 400);
        return () => clearTimeout(t);
      }, [messages]);

      React.useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, voiceState, interimText]);

      const startNewConversation = (msgs) => {
        const id = generateId();
        setActiveConvoId(id);
        activeConvoIdRef.current = id;
        setMessages(msgs);
        // activeId is persisted by the auto-save effect once the user has
        // actually spoken — pointing it at a never-saved greeting-only
        // conversation would dead-end the restore on next load.
      };

      const handleNameComplete = (newProfile) => {
        setProfile(newProfile);
        profileRef.current = newProfile;
        saveProfile(newProfile);
        const greeting = buildGreeting(newProfile);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setStarted(true);

        // The mic stays off until the user's first "Tap to talk": the agent
        // itself speaks the greeting when that tap opens the session
        // (first_message override). Until then it sits as text.
        setVoiceState('idle');
      };

      // Text-only turn through /api/chat-stream — the fallback for a typed
      // message when no agent session is open. Nothing is spoken: the agent
      // is the only voice in this build, and the turn reaches it on the
      // next session via fu_history. Same model, params, variant prompt and
      // prompt caching as the agent's /api/eleven-llm proxy.
      const sendToClaude = async (userText) => {
        // A new turn supersedes any still-streaming previous one.
        streamAbortRef.current?.abort();
        const ac = new AbortController();
        streamAbortRef.current = ac;

        // Two user turns can arrive back-to-back; merge them so the history
        // sent to the API keeps alternating roles.
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        const updated = last && last.role === 'user'
          ? [...prev.slice(0, -1), { role: 'user', content: `${last.content}\n${userText}` }]
          : [...prev, { role: 'user', content: userText }];
        setMessages(updated);
        voiceStateRef.current = 'processing';
        setVoiceState('processing');
        setInterimText('');

        // Watchdog: a request that dies silently (mobile wifi→cellular
        // handoff) must not strand the UI at 'Thinking…'. `timedOut` lets
        // the catch block tell a watchdog abort (show the error, reset
        // state) apart from a deliberate interruption (stay silent).
        let timedOut = false;
        let watchdog = setTimeout(() => { timedOut = true; ac.abort(); }, 30000);
        const feedWatchdog = () => {
          clearTimeout(watchdog);
          watchdog = setTimeout(() => { timedOut = true; ac.abort(); }, 30000);
        };

        try {
          const response = await fetch('/api/chat-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              // The server builds the variant's system prompt from these
              // two fields (api/_prompts.js) and marks it as a cacheable
              // prefix — the prompt text never passes through the browser.
              profile: profileRef.current,
              variant: sotVariantRef.current,
              // 700 (server clamps at 1000): 500 could clip a reply
              // mid-sentence when the model appends a [[VISUAL]] card.
              max_tokens: 700,
              // Reassemble both channels for the model so it remembers what
              // it displayed, not just what it said. Cap the history window:
              // sending the whole conversation makes Claude's first token
              // slower every single turn of a long session.
              messages: updated.slice(-24).map(m => ({
                role: m.role,
                content: m.visual ? `${m.content}\n[[VISUAL]]\n${m.visual}` : m.content,
              })),
            }),
            signal: ac.signal,
          });

          if (!response.ok) throw new Error('Stream request failed');

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullText = '';
          // Carry any incomplete trailing line between reads — a network
          // chunk can split a "data: {...}" line in half, and parsing each
          // half would drop that delta (lost words mid-reply).
          let lineBuffer = '';

          // Two-channel reply: text before [[VISUAL]] is the spoken channel
          // (the bubble); text after it renders as a visual aid card.
          const VISUAL_MARKER = '[[VISUAL]]';
          // How much of fullText is safe to display mid-stream: everything
          // before the marker — holding back any trailing partial marker so
          // a chunk ending in "[[VIS" never flashes as literal text.
          const displayableEnd = () => {
            const idx = fullText.indexOf(VISUAL_MARKER);
            if (idx !== -1) return idx;
            for (let k = VISUAL_MARKER.length - 1; k > 0; k--) {
              if (fullText.endsWith(VISUAL_MARKER.slice(0, k))) return fullText.length - k;
            }
            return fullText.length;
          };

          // Upstream failure surfaced mid-stream by the server (Anthropic
          // overload/error events) — previously swallowed, leaving a silent
          // empty reply that looked like the app just ignored the user.
          let upstreamError = null;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            feedWatchdog();

            lineBuffer += decoder.decode(value, { stream: true });
            const lines = lineBuffer.split('\n');
            lineBuffer = lines.pop() || '';

            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = line.slice(6).trim();
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                if (parsed.error) { upstreamError = parsed.error; continue; }
                if (parsed.text) {
                  fullText += parsed.text;
                  const markerIdx = fullText.indexOf(VISUAL_MARKER);
                  const displayEnd = markerIdx === -1 ? displayableEnd() : markerIdx;
                  const spokenText = fullText.slice(0, displayEnd).trim();
                  // Strip any repeated markers inside the visual channel so
                  // they can't render literally in the card.
                  const visualText = markerIdx === -1
                    ? ''
                    : fullText.slice(markerIdx + VISUAL_MARKER.length).split(VISUAL_MARKER).join('\n').trim();
                  setMessages([...updated, {
                    role: 'assistant',
                    content: spokenText,
                    ...(visualText ? { visual: visualText } : {}),
                  }]);
                }
              } catch (e) { /* skip */ }
            }
          }

          clearTimeout(watchdog);
          if (upstreamError) throw new Error(upstreamError);
          if (!fullText.trim()) throw new Error('Empty reply');
          // Interrupted turns do their own state cleanup at the point of
          // interruption — don't fight whatever the user is doing now.
          if (ac.signal.aborted) return;
          // Hands-free: the session is still open, go straight back to
          // listening for the next turn. Otherwise rest at idle.
          const v = handsFreeRef.current ? 'listening' : 'idle';
          setVoiceState(prev => prev === 'processing' ? v : prev);
          if (voiceStateRef.current === 'processing') voiceStateRef.current = v;
        } catch (err) {
          clearTimeout(watchdog);
          if (ac.signal.aborted && !timedOut) return; // interrupted on purpose
          console.error('Error:', err);
          setError('Something went wrong. Tap to try again.');
          const v = handsFreeRef.current ? 'listening' : 'idle';
          setVoiceState(prev => prev === 'processing' ? v : prev);
          if (voiceStateRef.current === 'processing') voiceStateRef.current = v;
          setTimeout(() => setError(null), 4000);
        }
      };

      // ── Hands-free conversation lifecycle ──
      //
      // The session must SELF-HEAL. On phones (especially the Android
      // Chrome home-screen PWA) the WebSocket routinely drops — screen off,
      // app switch, network blip, upstream session expiry. Drops are
      // rebuilt silently and the user keeps talking.
      const reconnectAttemptsRef = React.useRef(0);
      const reconnectingRef = React.useRef(false);

      // Single-flight connect covering the initial open, rebuilds, and the
      // visibility handler — two concurrent startSessions meant two live
      // mics and doubled transcriptions.
      const connectSession = async () => {
        if (reconnectingRef.current) return false;
        reconnectingRef.current = true;
        try {
          return await openElevenSession().catch(() => false);
        } finally {
          reconnectingRef.current = false;
        }
      };

      // Tear down hands-free. There is no other voice path to fall back
      // to — the mic stays armed for another try, and text always works.
      const failHandsFree = (err) => {
        handsFreeRef.current = false;
        setHandsFree(false);
        eleven.endSession();
        if (err === 'not-allowed') {
          setError('Microphone blocked. Tap the lock/site icon in the address bar to allow it, then try again.');
        } else if (err === 'no-mic') {
          setError('No microphone detected on this device.');
          setTimeout(() => setError(null), 6000);
        } else {
          setError('Voice connection failed — tap the mic to try again, or type below.');
          setTimeout(() => setError(null), 6000);
        }
        setInterimText('');
        setVoiceState(v => v === 'listening' ? 'idle' : v);
        if (voiceStateRef.current === 'listening') voiceStateRef.current = 'idle';
      };

      const handleSessionError = async (err) => {
        if (!handsFreeRef.current) return;
        // Failures no amount of retrying can fix: permission or hardware.
        const micFailure = err === 'not-allowed' || err === 'no-mic' || err === 'mic-failed';
        if (micFailure) {
          failHandsFree(err);
          return;
        }

        // Transient: the session dropped, or a setup attempt failed while
        // the network was recovering. Retry with a short backoff up to the
        // budget — a failed rebuild's own setup error must not be
        // reclassified as a hard failure, or one network blip permanently
        // disables hands-free for the visit.
        if (document.visibilityState === 'hidden') {
          // Don't rebuild into a hidden tab — the visibility handler does
          // it the moment the app comes back.
          eleven.endSession();
          return;
        }
        // A driven attempt is already in flight — its driver observes the
        // outcome; re-entrant setup errors must not double-drive recovery.
        if (reconnectingRef.current) return;
        reconnectingRef.current = true;
        try {
          while (handsFreeRef.current && reconnectAttemptsRef.current < 3) {
            reconnectAttemptsRef.current++;
            eleven.endSession();
            // Backoff: an instant redial into the same outage is doomed.
            await new Promise(r => setTimeout(r, 700 * reconnectAttemptsRef.current));
            if (!handsFreeRef.current || document.visibilityState === 'hidden') return;
            const ok = await openElevenSession().catch(() => false);
            if (ok) return;
          }
        } finally {
          reconnectingRef.current = false;
        }
        if (handsFreeRef.current) failHandsFree(err);
      };

      // ── ElevenLabs hands-free session ──
      // Driven by the self-healing lifecycle above (connectSession, the
      // retry/backoff loop and the visibility rebuild). ASR, end-of-turn
      // and barge-in live on ElevenLabs' side; this code only mirrors
      // their events into the conversation state.

      // True while the last assistant bubble is a live (tentative) reply
      // being updated in place as the agent generates.
      const elevenPendingRef = React.useRef(false);

      const appendUserTurn = (text) => {
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        // A typed user_message can come back as its own transcript — never
        // double-post the identical turn.
        if (last && last.role === 'user' && last.content.trim() === text.trim()) return;
        // Merge back-to-back user turns, same as sendToClaude, so history
        // keeps alternating roles.
        const updated = last && last.role === 'user'
          ? [...prev.slice(0, -1), { role: 'user', content: `${last.content}\n${text}` }]
          : [...prev, { role: 'user', content: text }];
        elevenPendingRef.current = false;
        messagesRef.current = updated;
        setMessages(updated);
      };

      const setAssistantTurn = (text, final) => {
        const t = (text || '').trim();
        if (!t) return;
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        let updated;
        if (elevenPendingRef.current && last && last.role === 'assistant') {
          updated = [...prev.slice(0, -1), { role: 'assistant', content: t }];
        } else {
          // The greeting is already on screen when the agent speaks it
          // (first_message override) and echoes back as an agent_response —
          // skip anything that's the last bubble's text or a prefix of it.
          if (last && last.role === 'assistant'
              && (last.content.trim() === t || last.content.trim().startsWith(t))) {
            elevenPendingRef.current = false;
            return;
          }
          updated = [...prev, { role: 'assistant', content: t }];
        }
        elevenPendingRef.current = !final;
        messagesRef.current = updated;
        setMessages(updated);
      };

      // After a barge-in ElevenLabs sends the truncation of what was
      // actually spoken — keep the transcript honest about what was heard.
      const applyElevenCorrection = (text) => {
        const t = (text || '').trim();
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        if (!t || !last || last.role !== 'assistant') return;
        const updated = [...prev.slice(0, -1), { role: 'assistant', content: t }];
        elevenPendingRef.current = false;
        messagesRef.current = updated;
        setMessages(updated);
      };

      const openElevenSession = async () => {
        setRtConnecting(true);
        try {
          const msgs = messagesRef.current;
          const hasUserTurn = msgs.some(m => m.role === 'user');
          // Fresh conversation: the agent speaks the greeting already on
          // screen (first_message override) and ElevenLabs records it, so
          // no history rides along. Resumed conversation (or a session
          // rebuild): full history goes in the extra body — ElevenLabs
          // only knows the live session's turns — and the agent stays
          // quiet until the user speaks.
          const firstMessage = hasUserTurn
            ? ''
            : ((msgs.find(m => m.role === 'assistant') || {}).content || buildGreeting(profileRef.current));
          const history = hasUserTurn
            ? msgs.slice(-24).map(m => ({
                role: m.role,
                // Reassemble both channels, like sendToClaude, so the model
                // remembers what it displayed, not just what it said.
                content: m.visual ? `${m.content}\n[[VISUAL]]\n${m.visual}` : m.content,
              }))
            : [];
          const ok = await eleven.startSession({
            firstMessage,
            // The proxy builds the variant prompt server-side from these
            // (see api/_prompts.js); the text itself never rides along.
            extraBody: {
              fu_profile: profileRef.current,
              fu_variant: sotVariantRef.current,
              fu_history: history,
              fu_max_tokens: 700,
            },
            getMuted: () => voiceMutedRef.current,
            onInterim: (t) => { if (handsFreeRef.current) setInterimText(t); },
            onUserTranscript: (text) => {
              if (!handsFreeRef.current) return;
              reconnectAttemptsRef.current = 0; // healthy session — reset budget
              setInterimText('');
              appendUserTurn(text);
              voiceStateRef.current = 'processing';
              setVoiceState('processing');
            },
            onAgentTentative: (t) => { if (handsFreeRef.current) setAssistantTurn(t, false); },
            onAgentResponse: (t) => {
              setAssistantTurn(t, true);
              // A muted turn never gets audio, so no onSpeakStart/End will
              // move the state — step down here.
              if (handsFreeRef.current && voiceStateRef.current === 'processing' && voiceMutedRef.current) {
                voiceStateRef.current = 'listening';
                setVoiceState('listening');
              }
            },
            onAgentCorrection: applyElevenCorrection,
            onSpeakStart: () => {
              if (!handsFreeRef.current) return;
              voiceStateRef.current = 'speaking';
              setVoiceState('speaking');
            },
            onSpeakEnd: () => {
              if (voiceStateRef.current !== 'speaking') return;
              const v = handsFreeRef.current ? 'listening' : 'idle';
              voiceStateRef.current = v;
              setVoiceState(v);
            },
            onInterrupted: () => {
              // Server-side barge-in: the user talked over the agent.
              if (!handsFreeRef.current) return;
              voiceStateRef.current = 'listening';
              setVoiceState('listening');
            },
            onError: handleSessionError,
            onDisconnect: () => handleSessionError('connection-lost'),
          });
          return ok;
        } finally {
          setRtConnecting(false);
        }
      };

      // When the PWA comes back from the background, quietly rebuild the
      // session if it died while we were away.
      React.useEffect(() => {
        const onVisible = async () => {
          if (document.visibilityState !== 'visible') return;
          if (!handsFreeRef.current || reconnectingRef.current) return;
          // isActive() also checks the mic track is live — a session whose
          // track the OS killed while backgrounded needs the rebuild too.
          if (eleven.isActive()) return;
          const ok = await connectSession();
          if (!ok && handsFreeRef.current && !reconnectingRef.current) {
            handleSessionError('connection-lost');
          }
        };
        document.addEventListener('visibilitychange', onVisible);
        return () => document.removeEventListener('visibilitychange', onVisible);
      }, []);

      const startHandsFree = async () => {
        setError(null);
        setInterimText('');
        handsFreeRef.current = true;
        setHandsFree(true);
        voiceStateRef.current = 'listening';
        setVoiceState('listening');
        reconnectAttemptsRef.current = 0;
        const ok = await connectSession();
        // Mic/permission failures already tore down via failHandsFree
        // (handsFreeRef is false then); anything else lands here.
        if (!ok && handsFreeRef.current) failHandsFree('session-failed');
      };

      const endHandsFree = () => {
        handsFreeRef.current = false;
        setHandsFree(false);
        eleven.endSession();
        streamAbortRef.current?.abort();
        setInterimText('');
        voiceStateRef.current = 'idle';
        setVoiceState('idle');
      };

      const handleMicClick = () => {
        // The mic button only ever drives the agent session — there is no
        // tap-to-talk path to fall into.
        if (handsFreeRef.current) {
          if (voiceState === 'speaking' || voiceState === 'processing') {
            // Manual barge-in / escape hatch: stop playback and drop the
            // rest of this turn's audio; the conversation stays open and
            // the reply still lands as text.
            eleven.suppressTurn();
            voiceStateRef.current = 'listening';
            setVoiceState('listening');
            return;
          }
          endHandsFree();
          return;
        }
        if (voiceState === 'speaking' || voiceState === 'processing') return;
        if (!eleven.supported) {
          setError('Voice not supported in this browser. Use the text input below.');
          setTimeout(() => setError(null), 6000);
          return;
        }
        startHandsFree();
      };

      const handleTextSubmit = (e) => {
        e.preventDefault();
        // Typing is always available — during 'speaking' it acts as a
        // barge-in, so a tester can interrupt the ~30s greeting without
        // granting mic access.
        if (!textInput.trim()) return;
        const text = textInput.trim();
        setInterimText('');
        if (voiceStateRef.current === 'speaking') eleven.suppressTurn();
        if (handsFreeRef.current && eleven.isActive()) {
          // Typed turn into the live session: show it, hand it to the
          // agent (ElevenLabs adds it to its conversation), voice reply
          // comes back through the same audio pipeline.
          appendUserTurn(text);
          eleven.sendText(text);
          voiceStateRef.current = 'processing';
          setVoiceState('processing');
        } else {
          // No live session — text-only turn through /api/chat-stream,
          // nothing spoken. The turn reaches the agent on the next session
          // via fu_history.
          sendToClaude(text);
        }
        setTextInput('');
      };

      const handleNewChat = () => {
        stopVoicePipeline();
        // Start a new conversation (the profile persists — no need to
        // re-enter a name).
        const greeting = buildGreeting(profile);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
      };

      // ── A/B Source of Truth variant switching ──
      // Always a fresh session (clean A/B) — the two variants must never
      // share a transcript.
      const handleVariantSwitch = (key) => {
        if (!SOT_VARIANT_KEYS.includes(key) || key === sotVariantRef.current) return;
        const hasUserTurn = messagesRef.current.some(m => m.role === 'user');
        if (hasUserTurn && !window.confirm('Switch to Version ' + key + '? This starts a fresh conversation.')) return;
        stopVoicePipeline();
        sotVariantRef.current = key;
        setSotVariant(key);
        saveToStorage(STORAGE_KEYS.sotVariant, key);
        const greeting = buildGreeting(profileRef.current);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
      };

      const handleStartOver = () => {
        // Full reset means full reset: the gate promises "conversations are
        // stored only on this device", so handing the device to the next
        // tester must not leave the previous tester's sessions behind.
        if (!window.confirm('This clears your profile and all conversations on this device. Continue?')) return;
        stopVoicePipeline();
        setProfile(null);
        profileRef.current = null;
        saveProfile(null);
        setMessages([]);
        setActiveConvoId(null);
        saveToStorage(STORAGE_KEYS.activeId, null);
        saveToStorage(STORAGE_KEYS.conversations, []);
        setGatePassed(false);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
        setStarted(false);
      };

      // ── Landing Gate ──
      // Shown only on the very first visit, before any profile or
      // conversation exists; returning testers skip straight to the chat.
      if (!gatePassed && !profile && !started) {
        return React.createElement(LandingGate, { onStart: () => setGatePassed(true) });
      }

      // ── Name entry (the only onboarding step) ──
      if (!started) {
        return React.createElement(NameScreen, { onComplete: handleNameComplete });
      }

      const voiceSupported = eleven.supported;
      const statusLabel = handsFree
        ? {
            idle: 'Tap to talk',
            listening: rtConnecting ? 'Connecting…' : 'Listening — just talk · tap to end',
            processing: 'Thinking...',
            speaking: 'Talk to interrupt',
          }[voiceState]
        : {
            idle: voiceSupported ? 'Tap to talk' : 'Type below',
            listening: 'Listening...',
            processing: 'Thinking...',
            speaking: 'Tap to stop',
          }[voiceState];

      // ── Chat UI ──
      return React.createElement('div', { className: 'app-shell' },
        // Top bar
        React.createElement('header', { className: 'app-header' },
          React.createElement('div', { className: 'header-left' },
            React.createElement('div', { className: 'header-title-wrap' },
              React.createElement('span', { className: 'header-title' }, 'Feel Understood'),
              React.createElement('span', { className: 'header-subtitle' }, 'Your Conversation Coach'),
            ),
          ),
          React.createElement('div', { className: 'header-right' },
            React.createElement('button', {
              className: `voice-toggle-btn ${voiceMuted ? 'voice-toggle-muted' : ''}`,
              onClick: toggleVoiceMuted,
              title: voiceMuted ? 'Voice replies are off — tap to turn on' : 'Voice replies are on — tap to turn off',
              'aria-label': voiceMuted ? 'Turn voice replies on' : 'Turn voice replies off',
              'aria-pressed': !voiceMuted,
            },
              voiceMuted
                ? React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('polygon', { points: '11 5 6 9 2 9 2 15 6 15 11 19 11 5' }),
                    React.createElement('line', { x1: 23, y1: 9, x2: 17, y2: 15 }),
                    React.createElement('line', { x1: 17, y1: 9, x2: 23, y2: 15 }),
                  )
                : React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('polygon', { points: '11 5 6 9 2 9 2 15 6 15 11 19 11 5' }),
                    React.createElement('path', { d: 'M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07' }),
                  ),
            ),
            React.createElement('button', {
              className: 'new-chat-btn',
              onClick: handleNewChat,
              title: 'New conversation'
            }, 'New Chat')
          )
        ),

        // Helpline banner with the A/B pill — neutral labels only; the
        // variant mapping stays in code so the tester A/B stays blind.
        React.createElement('div', { className: 'mode-hint mode-hint-helpline' },
          React.createElement('strong', null, 'Helpline \u00B7 '),
          'Unpacking a conversation that matters.',
          React.createElement('span', { className: 'sot-pill' },
            React.createElement('span', { className: 'sot-pill-label' }, 'Coach:'),
            ['A', 'B'].map(k => React.createElement('button', {
              key: k,
              className: 'sot-pill-btn' + (sotVariant === k ? ' sot-pill-active' : ''),
              onClick: () => handleVariantSwitch(k),
              'aria-pressed': sotVariant === k,
            }, k)),
          ),
        ),

        // Messages
        React.createElement('main', { className: 'chat-area' },
          messages.map((m, i) =>
            React.createElement(MessageBubble, { key: i, role: m.role, content: m.content, visual: m.visual })
          ),
          // Assistant typing indicator — while we're waiting on the agent
          // (or the text fallback) to reply.
          voiceState === 'processing' && React.createElement(TypingIndicator, {}),
          interimText && React.createElement('div', { className: 'msg-row user' },
            React.createElement('div', { className: 'bubble interim-bubble' }, interimText)
          ),
          React.createElement('div', { ref: chatEndRef })
        ),

        // Error
        error && React.createElement('div', { className: 'error-bar' }, error),

        // Controls
        React.createElement('footer', { className: 'controls' },
          // Mic area
          React.createElement('div', { className: 'mic-area' },
            voiceState === 'listening' && React.createElement(WaveVisualizer, {
              getLevel: handsFree ? eleven.getLevel : null,
            }),
            React.createElement('button', {
              className: `mic-btn ${voiceState}`,
              onClick: handleMicClick,
              'aria-label': statusLabel,
            },
              voiceState === 'speaking'
                ? React.createElement('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('rect', { x: 6, y: 6, width: 12, height: 12, rx: 2 })
                  )
                : React.createElement('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('rect', { x: 9, y: 2, width: 6, height: 12, rx: 3 }),
                    React.createElement('path', { d: 'M5 11a7 7 0 0 0 14 0' }),
                    React.createElement('line', { x1: 12, y1: 18, x2: 12, y2: 22 }),
                    React.createElement('line', { x1: 9, y1: 22, x2: 15, y2: 22 })
                  )
            ),
            React.createElement('span', { className: 'mic-label' }, statusLabel),
          ),

          // Text input
          React.createElement('form', { className: 'text-form', onSubmit: handleTextSubmit },
            React.createElement('input', {
              type: 'text',
              value: textInput,
              onChange: (e) => setTextInput(e.target.value),
              placeholder: 'Or type here...',
              className: 'text-input',
            }),
            React.createElement('button', {
              type: 'submit',
              disabled: !textInput.trim(),
              className: `send-btn ${textInput.trim() ? 'active' : ''}`,
            },
              React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                React.createElement('line', { x1: 5, y1: 12, x2: 19, y2: 12 }),
                React.createElement('polyline', { points: '12 5 19 12 12 19' })
              )
            )
          ),

          !voiceSupported && React.createElement('p', { className: 'browser-warn' },
            'Voice not supported in this browser. Type below instead.'
          ),

          // Version label + full device reset (hand-off between testers)
          React.createElement('p', { className: 'version-label' },
            SANDBOX_VERSION,
            ' · ',
            React.createElement('button', {
              className: 'start-over-link',
              onClick: handleStartOver,
            }, 'start over'),
          )
        )
      );
    };

    // ── Service Worker: DISABLED in the sandbox ──
    // Stale-cache confusion mid-test is the classic time thief. Any worker
    // left over from a previous deploy on this origin is unregistered.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations()
          .then((regs) => regs.forEach((r) => r.unregister()))
          .catch(() => {});
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
