            style: getLevel ? null : { animationDelay: `${i * 0.1}s` }
          })
        )
      );
    };

    // ── Main App ──
    const App = () => {
      // Restore persisted state on mount
      const savedProfile = React.useMemo(() => loadProfile(), []);
      const savedActiveId = React.useMemo(() => loadFromStorage(STORAGE_KEYS.activeId, null), []);
      const savedConvo = React.useMemo(() => {
        if (!savedActiveId) return null;
        return loadConversations().find(c => c.id === savedActiveId) || null;
      }, []);

      // The gate shows only when nothing is persisted (first visit, or
      // cleared site data — which also clears appMode). It used to also be
      // forced whenever no service worker controlled the page, but a plain
      // hard-refresh (shift+reload) drops the SW controller too, which
      // kicked returning testers back to the gate for no reason.
      const [appMode, setAppMode] = React.useState(() => SANDBOX ? 'beta' : loadFromStorage(STORAGE_KEYS.appMode, null));
      // A saved profile also counts as onboarded: greeting-only conversations
      // are deliberately never persisted, so between finishing onboarding and
      // sending the first message a reload used to fall back into the
      // questionnaire (losing the beta greeting, or the whole quiz). Seed a
      // silent greeting conversation instead — voiceState starts 'idle', so
      // nothing speaks and the mic stays off.
      const [started, setStarted] = React.useState(!!savedConvo || !!savedProfile);
      const [profile, setProfile] = React.useState(savedProfile);
      const [messages, setMessages] = React.useState(() =>
        savedConvo ? savedConvo.messages
        : savedProfile ? [{ role: 'assistant', content: buildGreeting(savedProfile) }]
        : []);
      const [activeConvoId, setActiveConvoId] = React.useState(() =>
        savedConvo ? savedConvo.id : (savedProfile ? generateId() : null));
      const [showHistory, setShowHistory] = React.useState(false);
      const [conversations, setConversations] = React.useState(() => loadConversations());
      const [voiceState, setVoiceState] = React.useState('idle');
      const [interimText, setInterimText] = React.useState('');
      // True only on the Whisper path between "user stopped talking" and
      // "transcript arrived". Drives a user-side dots bubble so the user
      // sees their message is being processed (instead of the assistant
      // typing indicator, which is misleading at this stage).
      const [transcribing, setTranscribing] = React.useState(false);
      // Sticky banner shown when the user has denied mic permission, so
      // they understand why nothing happens on the next tap.
      const [micBlocked, setMicBlocked] = React.useState(false);
      const [textInput, setTextInput] = React.useState('');
      const [error, setError] = React.useState(null);
      const [theme, setTheme] = React.useState(() => {
        try { return localStorage.getItem('fu_theme') === 'dark' ? 'dark' : 'light'; }
        catch { return 'light'; }
      });
      const [showModeMenu, setShowModeMenu] = React.useState(false);
      const [showBasecamp, setShowBasecamp] = React.useState(false);
      const [showAbout, setShowAbout] = React.useState(false);
      const [showInsights, setShowInsights] = React.useState(false);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#ffffff');
        try { localStorage.setItem('fu_theme', theme); } catch {}
      }, [theme]);

      const toggleTheme = React.useCallback(() => {
        setTheme(t => t === 'dark' ? 'light' : 'dark');
      }, []);
      const chatEndRef = React.useRef(null);
      const messagesRef = React.useRef(messages);
      const profileRef = React.useRef(profile);
      const activeConvoIdRef = React.useRef(activeConvoId);
      const inputRef = React.useRef(null);
      // forceRecorder: flipped at runtime when native SpeechRecognition
      // turns out to be broken despite existing (Brave/un-keyed Chromium
      // fire 'network' on every start; some iOS WKWebViews never fire any
      // event) — the MediaRecorder → Whisper path works fine there.
      const [forceRecorder, setForceRecorder] = React.useState(false);
      const useRecorderFallback = React.useMemo(() => needsRecorderFallback(), []) || forceRecorder;
      const nativeSTT = useSpeechRecognition();
      const recorderSTT = useMediaRecorderSTT();
      const { start: startRec, stop: stopRec, abort: abortRec, supported: sttSupported } =
        useRecorderFallback ? recorderSTT : nativeSTT;
      const { speak, speakStreaming, cancel: cancelSpeak, getLastError: getTtsError } = useSpeechSynthesis();
      const realtime = useRealtimeSTT();
      // Hands-free realtime conversation: one tap opens a continuous
      // session; turns are detected server-side, and the user can barge in
      // while the assistant speaks. realtimeEnabledRef flips false after a
      // realtime failure so the rest of the visit uses tap-to-talk instead.
      const [handsFree, setHandsFree] = React.useState(false);
      const handsFreeRef = React.useRef(false);
      const realtimeEnabledRef = React.useRef(true);
      // True while the realtime session is being (re)built — the mic isn't
      // actually hearing anything yet, and the status label must say so
      // instead of claiming "Listening" while first words fall into a void.
      const [rtConnecting, setRtConnecting] = React.useState(false);
      // Mirror of voiceState for realtime event callbacks, which outlive
      // any single render.
      const voiceStateRef = React.useRef('idle');
      React.useEffect(() => { voiceStateRef.current = voiceState; }, [voiceState]);
      // True from speech_started until the turn resolves (completed/failed).
      // Read by the streaming pipeline so a reply's TTS never starts talking
      // over a user who is mid-utterance while the state is 'processing'.
      const userSpeakingRef = React.useRef(false);
      // Deadline (ms epoch) before which the next realtime turn is dropped —
      // set when a typed message supersedes a half-captured spoken one, so
      // the abandoned fragment can't cancel the typed message's reply.
      const suppressTurnRef = React.useRef(0);
      // Voice replies off: replies stream as text only, no TTS. The escape
      // hatch for testers in bad audio environments — they can keep
      // evaluating the coaching with the mic and/or keyboard while the
      // assistant stays silent. Persisted per device.
      const [voiceMuted, setVoiceMuted] = React.useState(() => loadFromStorage(STORAGE_KEYS.voiceMuted, false));
      const voiceMutedRef = React.useRef(voiceMuted);
      React.useEffect(() => { voiceMutedRef.current = voiceMuted; }, [voiceMuted]);

      // ── Sandbox A/B state ──
      const [sotVariant, setSotVariant] = React.useState(() => loadSotVariant());
      const sotVariantRef = React.useRef(sotVariant);
      React.useEffect(() => { sotVariantRef.current = sotVariant; }, [sotVariant]);
      const [showDevPanel, setShowDevPanel] = React.useState(false);
      // Dev-only "keep transcript on variant switch" override — allowed
      // because the prompt is rebuilt every turn; never the default.
      const [devKeepTranscript, setDevKeepTranscript] = React.useState(false);
      const [devCopied, setDevCopied] = React.useState(false);
      // Usage block from the last turn's message_start event — the
      // client-side prompt-cache verification readout (the server logs the
      // same numbers). Turn 1 should show cache creation; turn 2+ reads.
      const lastUsageRef = React.useRef(null);
      const [lastUsage, setLastUsage] = React.useState(null);
      // Sandbox gate: appMode is pinned to 'beta', so the Landing Gate
      // needs its own "passed" flag (returning testers skip it).
      const [gatePassed, setGatePassed] = React.useState(() =>
        SANDBOX ? !!(savedProfile || savedConvo) : true);

      const toggleVoiceMuted = () => {
        const next = !voiceMutedRef.current;
        voiceMutedRef.current = next;
        setVoiceMuted(next);
        saveToStorage(STORAGE_KEYS.voiceMuted, next);
        if (next) {
          // Muting mid-reply silences playback immediately; the reply
          // keeps streaming into the chat as text.
          cancelSpeak();
          if (voiceStateRef.current === 'speaking') {
            const v = handsFreeRef.current ? 'listening' : 'idle';
            voiceStateRef.current = v;
            setVoiceState(v);
          }
        }
      };
      // AbortController for the in-flight /api/chat-stream request. Aborted
      // when the user interrupts or starts a new turn, so a stale stream can
      // never keep writing into the conversation underneath the new one.
      const streamAbortRef = React.useRef(null);

      // Hard-stop everything voice-related: the in-flight reply stream, TTS
      // playback, and any open mic session (hands-free or tap-to-talk).
      const stopVoicePipeline = () => {
        if (handsFreeRef.current) {
          handsFreeRef.current = false;
          setHandsFree(false);
        }
        realtime.endSession();
        streamAbortRef.current?.abort();
        abortRec();
        cancelSpeak();
        userSpeakingRef.current = false;
        suppressTurnRef.current = 0;
      };

      React.useEffect(() => { messagesRef.current = messages; }, [messages]);
      React.useEffect(() => { profileRef.current = profile; }, [profile]);
      React.useEffect(() => { activeConvoIdRef.current = activeConvoId; }, [activeConvoId]);

      // Auto-save messages to localStorage whenever they change. Greeting-
      // only conversations are not persisted — every New Chat / mode switch
      // used to save a junk "New conversation" entry that cluttered the
      // history list and counted against the 50-conversation cap.
      React.useEffect(() => {
        if (!activeConvoIdRef.current || messages.length === 0) return;
        if (!messages.some(m => m.role === 'user')) return;
        // Debounced: streaming updates `messages` on every SSE delta, and a
        // full localStorage parse/stringify of all conversations per delta
        // janked audio playback on low-end phones. Trailing save 400ms after
        // the last change covers stream-end, abort, and normal sends alike.
        const t = setTimeout(() => {
          const p = profileRef.current;
          const convo = {
            id: activeConvoIdRef.current,
            title: messages.find(m => m.role === 'user')?.content.slice(0, 60) || 'New conversation',
            messages,
            updatedAt: Date.now(),
            // Transcript stamp — blind tests are worthless if we can't
            // attribute them afterwards.
            variant: sotVariantRef.current,
            variantName: SOT_VARIANTS[sotVariantRef.current]?.name,
            sandboxVersion: SANDBOX_VERSION,
            voiceStack: VOICE_STACK,
            // Snapshot the mode so reopening this conversation from history
            // rebuilds the system prompt it was actually held under.
            ...(p ? { mode: p.mode, goal: p.goal ?? null, path: p.path } : {}),
          };
          saveConversation(convo);
          saveToStorage(STORAGE_KEYS.activeId, activeConvoIdRef.current);
          setConversations(loadConversations());
        }, 400);
        return () => clearTimeout(t);
      }, [messages]);

      React.useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, voiceState, interimText]);

      const startNewConversation = (msgs) => {
        const id = generateId();
        setActiveConvoId(id);
        activeConvoIdRef.current = id;
        setMessages(msgs);
        // activeId is persisted by the auto-save effect once the user has
        // actually spoken — pointing it at a never-saved greeting-only
        // conversation would dead-end the restore on next load.
      };

      const handleQuizComplete = (quizProfile) => {
        setProfile(quizProfile);
        profileRef.current = quizProfile;
        saveProfile(quizProfile);
        const greeting = buildGreeting(quizProfile);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setStarted(true);

        // The mic stays off until the user's first "Tap to talk" — the
        // greeting speaks, then one tap opens the hands-free session.

        // Voice replies off: show the greeting as text and rest at idle.
        if (voiceMutedRef.current) {
          setVoiceState('idle');
          return;
        }

        // Speak the greeting through the gapless PCM path, sentence by
        // sentence, so audio starts on the first network chunk instead of
        // after the first full MP3 has been generated and downloaded.
        voiceStateRef.current = 'speaking';
        setVoiceState('speaking');
        const sp = speakStreaming();
        for (const s of splitSentences(greeting)) {
          const t = s.trim();
          if (t) sp.addSentence(t);
        }
        sp.finish().then(() => {
          // Only step down if we're still the active speaker — the user may
          // have barged in and already be mid-turn.
          setVoiceState(v => v === 'speaking'
            ? (handsFreeRef.current ? 'listening' : 'idle')
            : v);
          const ttsErr = getTtsError();
          if (ttsErr) {
            setError(`Voice hiccup — a phrase was skipped (${ttsErr})`);
            setTimeout(() => setError(null), 6000);
          }
        });
      };

      const sendToClaude = async (userText) => {
        // A new turn supersedes any still-streaming previous one — kill its
        // stream AND its audio. Aborting the fetch alone leaves the old
        // reply's already-scheduled PCM chunks playing (and its speaker
        // pumping) underneath the new reply's TTS: the "two voices at once"
        // bug when a barge-in cancel was missed or the user talked over a
        // reply that was still processing.
        streamAbortRef.current?.abort();
        cancelSpeak();
        const ac = new AbortController();
        streamAbortRef.current = ac;

        // In hands-free mode two user turns can arrive back-to-back (e.g. a
        // barge-in before any assistant text streamed). Merge them so the
        // history sent to the API keeps alternating roles.
        const prev = messagesRef.current;
        const last = prev[prev.length - 1];
        const updated = last && last.role === 'user'
          ? [...prev.slice(0, -1), { role: 'user', content: `${last.content}\n${userText}` }]
          : [...prev, { role: 'user', content: userText }];
        setMessages(updated);
        voiceStateRef.current = 'processing'; // keep the barge-in ref in lockstep
        setVoiceState('processing');
        setInterimText('');

        // Watchdog: a request that dies silently (mobile wifi→cellular
        // handoff) must not strand the UI at 'Thinking…'. `timedOut` lets
        // the catch block tell a watchdog abort (show the error, reset
        // state) apart from a deliberate interruption (stay silent).
        let timedOut = false;
        let watchdog = setTimeout(() => { timedOut = true; ac.abort(); }, 30000);
        const feedWatchdog = () => {
          clearTimeout(watchdog);
          watchdog = setTimeout(() => { timedOut = true; ac.abort(); }, 30000);
        };

        try {
          const response = await fetch('/api/chat-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              // Prompt caching (GA — no beta header): the system block is
              // byte-identical every turn of a session, so mark it as a
              // cacheable prefix. Without this the ~7k-token Deep variant
              // pays a first-token delay every turn that Light never pays —
              // testers would hear "the Deep coach is slower" and attribute
              // it to the writing. Each variant caches independently.
              system: [{
                type: 'text',
                text: buildSystemPrompt(profileRef.current, sotVariantRef.current),
                cache_control: { type: 'ephemeral' },
              }],
              // 700 (server clamps at 1000): 500 could clip a reply
              // mid-sentence when the model appends a [[VISUAL]] card.
              max_tokens: 700,
              // Reassemble both channels for the model so it remembers what
              // it displayed, not just what it said. Cap the history window:
              // sending the whole conversation makes Claude's first token
              // slower every single turn of a long session.
              messages: updated.slice(-24).map(m => ({
                role: m.role,
                content: m.visual ? `${m.content}\n[[VISUAL]]\n${m.visual}` : m.content,
              })),
            }),
            signal: ac.signal,
          });

          if (!response.ok) throw new Error('Stream request failed');

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullText = '';
          let sentenceBuffer = '';
          let streamSpeaker = null;
          let startedSpeaking = false;
          // Carry any incomplete trailing line between reads — a network
          // chunk can split a "data: {...}" line in half, and parsing each
          // half would drop that delta (lost words mid-reply).
          let lineBuffer = '';

          // Two-channel reply: text before [[VISUAL]] is spoken aloud; text
          // after it is shown on screen as a visual aid, never spoken.
          const VISUAL_MARKER = '[[VISUAL]]';
          // Chars of fullText already handed to the TTS sentence buffer.
          let spokenFed = 0;
          // How much of fullText is safely speakable: everything before the
          // marker — holding back any trailing partial marker so a chunk
          // ending in "[[VIS" never reaches TTS mid-stream.
          const speakableEnd = () => {
            const idx = fullText.indexOf(VISUAL_MARKER);
            if (idx !== -1) return idx;
            for (let k = VISUAL_MARKER.length - 1; k > 0; k--) {
              if (fullText.endsWith(VISUAL_MARKER.slice(0, k))) return fullText.length - k;
            }
            return fullText.length;
          };

          // Upstream failure surfaced mid-stream by the server (Anthropic
          // overload/error events) — previously swallowed, leaving a silent
          // empty reply that looked like the app just ignored the user.
          let upstreamError = null;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            feedWatchdog();

            lineBuffer += decoder.decode(value, { stream: true });
            const lines = lineBuffer.split('\n');
            lineBuffer = lines.pop() || '';

            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = line.slice(6).trim();
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                if (parsed.error) { upstreamError = parsed.error; continue; }
                // Cache verification readout, forwarded by chat-stream.js
                // from the message_start usage block.
                if (parsed.usage) {
                  lastUsageRef.current = parsed.usage;
                  setLastUsage(parsed.usage);
                  continue;
                }
                if (parsed.text) {
                  fullText += parsed.text;

                  // Split the channels for display as the reply streams in.
                  // The display uses the same partial-marker holdback as the
                  // TTS path — without it, '[[VIS' flashed as literal text
                  // whenever the marker arrived split across deltas.
                  const markerIdx = fullText.indexOf(VISUAL_MARKER);
                  const displayEnd = markerIdx === -1 ? speakableEnd() : markerIdx;
                  const spokenText = fullText.slice(0, displayEnd).trim();
                  // Strip any repeated markers inside the visual channel so
                  // they can't render literally in the card.
                  const visualText = markerIdx === -1
                    ? ''
                    : fullText.slice(markerIdx + VISUAL_MARKER.length).split(VISUAL_MARKER).join('\n').trim();
                  setMessages([...updated, {
                    role: 'assistant',
                    content: spokenText,
                    ...(visualText ? { visual: visualText } : {}),
                  }]);

                  // Only the spoken channel feeds the TTS sentence buffer.
                  const end = speakableEnd();
                  if (end > spokenFed) {
                    sentenceBuffer += fullText.slice(spokenFed, end);
                    spokenFed = end;
                  }

                  // Aggressively fire TTS on any natural break point
                  // Priority 1: sentence endings (.!?)
                  // Priority 2: clause breaks (,;:—–) if buffer > 40 chars
                  // Priority 3: any content if buffer > 80 chars (force split at word boundary)
                  // First chunk uses lower thresholds so audio starts as
                  // quickly as possible. Later chunks are much looser: the
                  // PCM streaming path starts playing each sentence on its
                  // first network chunk, so we can afford whole sentences \u2014
                  // which sound far more natural than clause fragments.
                  const isFirstChunk = !streamSpeaker;
                  const clauseThreshold = isFirstChunk ? 12 : 80;
                  const forceThreshold = isFirstChunk ? 28 : 160;

                  // Break points require trailing whitespace so '.' inside
                  // numbers/abbreviations ('7.5', 'e.g.') and ',' inside
                  // '1,000' never chop a token into separate TTS chunks;
                  // [.!?]+ keeps an ellipsis in one piece. The end-of-stream
                  // `remaining` handler covers a final unterminated sentence.
                  let fireChunk = null;
                  const sentenceMatch = sentenceBuffer.match(/^([\s\S]*?[.!?]+)\s/);
                  const clauseMatch = sentenceBuffer.length > clauseThreshold && sentenceBuffer.match(/^([\s\S]*?[,;:\u2014\u2013])\s/);

                  if (sentenceMatch) {
                    fireChunk = sentenceMatch[1].trim();
                    sentenceBuffer = sentenceBuffer.slice(sentenceMatch[0].length);
                  } else if (clauseMatch) {
                    fireChunk = clauseMatch[1].trim();
                    sentenceBuffer = sentenceBuffer.slice(clauseMatch[0].length);
                  } else if (sentenceBuffer.length > forceThreshold) {
                    // Force split at last word boundary
                    const wordBreak = sentenceBuffer.lastIndexOf(' ', forceThreshold);
                    const splitAt = wordBreak > 15 ? wordBreak : forceThreshold;
                    fireChunk = sentenceBuffer.slice(0, splitAt).trim();
                    sentenceBuffer = sentenceBuffer.slice(splitAt);
                  }

                  // userSpeakingRef gate: if the user is mid-utterance while
                  // this reply arrives (they talked during 'processing',
                  // where barge-in can't fire), don't start talking over
                  // them — the text still streams, and their completed turn
                  // will supersede this reply anyway.
                  if (fireChunk && fireChunk.length > 0 && !voiceMutedRef.current && !userSpeakingRef.current) {
                    if (!streamSpeaker) {
                      streamSpeaker = speakStreaming();
                      // Sync the ref before React re-renders: barge-in
                      // (speech_started) reads voiceStateRef on the realtime
                      // data channel and must see 'speaking' immediately —
                      // the useEffect mirror lags a render, and a barge-in
                      // in that window was silently ignored.
                      voiceStateRef.current = 'speaking';
                      setVoiceState('speaking');
                      startedSpeaking = true;
                    }
                    streamSpeaker.addSentence(fireChunk);
                  }
                }
              } catch (e) { /* skip */ }
            }
          }

          clearTimeout(watchdog);
          if (upstreamError) throw new Error(upstreamError);
          if (!fullText.trim()) throw new Error('Empty reply');

          // Handle any remaining text that didn't end with punctuation
          const remaining = sentenceBuffer.trim();
          if (remaining.length > 0 && !voiceMutedRef.current && !userSpeakingRef.current) {
            if (!streamSpeaker) {
              streamSpeaker = speakStreaming();
              voiceStateRef.current = 'speaking'; // see comment above
              setVoiceState('speaking');
              startedSpeaking = true;
            }
            streamSpeaker.addSentence(remaining);
          }

          // Wait for all audio to finish playing
          if (streamSpeaker) {
            await streamSpeaker.finish();
          }
          // Interrupted turns do their own state cleanup at the point of
          // interruption — don't fight whatever the user is doing now.
          if (ac.signal.aborted) return;
          if (streamSpeaker) {
            const ttsErr = getTtsError();
            if (ttsErr) {
              // Playback carried on around the failed phrase — say so,
              // rather than announcing total failure.
              setError(`Voice hiccup — a phrase was skipped (${ttsErr})`);
              setTimeout(() => setError(null), 6000);
            }
          }
          // Hands-free: the session is still open, go straight back to
          // listening for the next turn. Tap-to-talk: rest at idle.
          setVoiceState(v => (v === 'speaking' || v === 'processing')
            ? (handsFreeRef.current ? 'listening' : 'idle')
            : v);
        } catch (err) {
          clearTimeout(watchdog);
          if (ac.signal.aborted && !timedOut) return; // interrupted on purpose
          console.error('Error:', err);
          // Kill any TTS already scheduled — the state is about to say
          // 'listening', and barge-in refuses to cancel audio in that state,
          // so orphaned chunks would keep talking uninterruptibly.
          cancelSpeak();
          setError('Something went wrong. Tap to try again.');
          const v = handsFreeRef.current ? 'listening' : 'idle';
          setVoiceState(prev => (prev === 'speaking' || prev === 'processing') ? v : prev);
          if (voiceStateRef.current === 'speaking' || voiceStateRef.current === 'processing') {
            voiceStateRef.current = v;
          }
          setTimeout(() => setError(null), 4000);
        }
      };

      // ── Hands-free conversation lifecycle (realtime path) ──
      //
      // The session must SELF-HEAL. On phones (especially the Android
      // Chrome home-screen PWA) the WebRTC connection routinely drops —
      // screen off, app switch, network blip, upstream session expiry.
      // Treating a drop as a one-strike fallback to tap-to-talk killed the
      // open mic and exposed Android's buggy native recognition; instead,
      // drops are rebuilt silently and the user keeps talking.
      const reconnectAttemptsRef = React.useRef(0);
      const reconnectingRef = React.useRef(false);
      const sessionStartedAtRef = React.useRef(0);
      const openSessionRef = React.useRef(null);

      // Rotate a long-lived session at a quiet moment (right after the
      // user's turn was captured, while Claude is thinking and the mic
      // isn't needed) — a controlled rebuild here beats an uncontrolled
      // drop mid-sentence later.
      const SESSION_ROTATE_MS = 8 * 60 * 1000;

      // Single-flight connect covering the initial open, rebuilds, and the
      // visibility handler — two concurrent startSessions meant two live
      // mics and doubled transcriptions.
      const connectRealtime = async () => {
        if (reconnectingRef.current) return false;
        reconnectingRef.current = true;
        try {
          return await openSessionRef.current().catch(() => false);
        } finally {
          reconnectingRef.current = false;
        }
      };

      const cycleRealtimeSession = async () => {
        if (!handsFreeRef.current || reconnectingRef.current) return;
        realtime.endSession();
        const ok = await connectRealtime();
        if (!ok && handsFreeRef.current && !reconnectingRef.current) {
          handleRealtimeError('connection-lost');
        }
      };

      // Tear down hands-free and fall back to tap-to-talk / text.
      const failHandsFree = (err) => {
        handsFreeRef.current = false;
        setHandsFree(false);
        realtime.endSession();
        userSpeakingRef.current = false;
        if (err === 'not-allowed') {
          setMicBlocked(true);
          setError('Microphone blocked. Tap the lock/site icon in the address bar to allow it, then try again.');
        } else if (err === 'no-mic') {
          setError('No microphone detected on this device.');
          setTimeout(() => setError(null), 6000);
        } else {
          realtimeEnabledRef.current = false;
          setError('Hands-free voice unavailable — using tap-to-talk instead.');
          setTimeout(() => setError(null), 6000);
        }
        setInterimText('');
        setVoiceState(v => v === 'listening' ? 'idle' : v);
        if (voiceStateRef.current === 'listening') voiceStateRef.current = 'idle';
      };

      const handleRealtimeError = async (err) => {
        if (!handsFreeRef.current) return;
        // Failures no amount of retrying can fix: permission or hardware.
        const micFailure = err === 'not-allowed' || err === 'no-mic' || err === 'mic-failed';
        if (micFailure) {
          failHandsFree(err);
          return;
        }

        // Transient: the session dropped, or a setup attempt failed while
        // the network was recovering. Retry with a short backoff up to the
        // budget — previously a failed rebuild's own setup error was
        // reclassified as a hard failure, so one network blip permanently
        // disabled hands-free for the visit.
        if (document.visibilityState === 'hidden') {
          // Don't rebuild into a hidden tab — the visibility handler does
          // it the moment the app comes back.
          realtime.endSession();
          return;
        }
        // A driven attempt is already in flight — its driver observes the
        // outcome; re-entrant setup errors must not double-drive recovery.
        if (reconnectingRef.current) return;
        reconnectingRef.current = true;
        try {
          while (handsFreeRef.current && reconnectAttemptsRef.current < 3) {
            reconnectAttemptsRef.current++;
            realtime.endSession();
            // Backoff: an instant redial into the same outage is doomed.
            await new Promise(r => setTimeout(r, 700 * reconnectAttemptsRef.current));
            if (!handsFreeRef.current || document.visibilityState === 'hidden') return;
            const ok = await openSessionRef.current().catch(() => false);
            if (ok) return;
          }
        } finally {
          reconnectingRef.current = false;
        }
        if (handsFreeRef.current) failHandsFree(err);
      };

      const openRealtimeSession = async () => {
        setRtConnecting(true);
        try {
          const ok = await realtime.startSession({
            onInterim: (t) => {
              if (handsFreeRef.current) setInterimText(t);
            },
            onTurn: (text) => {
              if (!handsFreeRef.current) return;
              // A typed message just superseded this half-captured
              // utterance — drop the fragment instead of letting it cancel
              // the typed message's reply.
              if (suppressTurnRef.current) {
                const stillValid = Date.now() < suppressTurnRef.current;
                suppressTurnRef.current = 0;
                if (stillValid) { setInterimText(''); return; }
              }
              reconnectAttemptsRef.current = 0; // healthy session — reset budget
              setInterimText('');
              sendToClaude(text);
              if (Date.now() - sessionStartedAtRef.current > SESSION_ROTATE_MS) {
                cycleRealtimeSession();
              }
            },
            onSpeechStart: () => {
              if (!handsFreeRef.current) return;
              userSpeakingRef.current = true;
              // Barge-in: the user started talking over the assistant — stop
              // the reply (audio and stream) and listen. No tap needed.
              if (voiceStateRef.current === 'speaking') {
                streamAbortRef.current?.abort();
                cancelSpeak();
                voiceStateRef.current = 'listening';
                setVoiceState('listening');
              }
            },
            onSpeechStop: () => {
              userSpeakingRef.current = false;
            },
            onError: handleRealtimeError,
          });
          if (ok) {
            sessionStartedAtRef.current = Date.now();
            // A rebuild that stays up is healthy — refill the retry budget
            // so hours of idle listening survive repeated upstream expiries
            // (previously only a captured turn reset it).
            setTimeout(() => {
              if (handsFreeRef.current && realtime.isActive()) {
                reconnectAttemptsRef.current = 0;
              }
            }, 30000);
          }
          return ok;
        } finally {
          setRtConnecting(false);
        }
      };
      openSessionRef.current = openRealtimeSession;

      // When the PWA comes back from the background, quietly rebuild the
      // session if it died while we were away.
      React.useEffect(() => {
        const onVisible = async () => {
          if (document.visibilityState !== 'visible') return;
          if (!handsFreeRef.current || reconnectingRef.current) return;
          // isActive() also checks the mic track is live — a session whose
          // track the OS killed while backgrounded needs the rebuild too.
          if (realtime.isActive()) return;
          const ok = await connectRealtime();
          if (!ok && handsFreeRef.current && !reconnectingRef.current) {
            handleRealtimeError('connection-lost');
          }
        };
        document.addEventListener('visibilitychange', onVisible);
        return () => document.removeEventListener('visibilitychange', onVisible);
      }, []);

      const startHandsFree = async () => {
        setError(null);
        setMicBlocked(false);
        setInterimText('');
        setTranscribing(false);
        handsFreeRef.current = true;
        setHandsFree(true);
        voiceStateRef.current = 'listening';
        setVoiceState('listening');
        reconnectAttemptsRef.current = 0;
        const ok = await connectRealtime();
        // Mic/permission failures already tore down via failHandsFree
        // (handsFreeRef is false then); anything else falls back here.
        if (!ok && handsFreeRef.current) failHandsFree('realtime-failed');
      };

      const endHandsFree = () => {
        handsFreeRef.current = false;
        setHandsFree(false);
        realtime.endSession();
        streamAbortRef.current?.abort();
        cancelSpeak();
        userSpeakingRef.current = false;
        suppressTurnRef.current = 0;
        setInterimText('');
        voiceStateRef.current = 'idle';
        setVoiceState('idle');
      };

      const handleMicClick = () => {
        if (handsFreeRef.current) {
          // A hands-free conversation is live.
          if (voiceState === 'speaking') {
            // Manual barge-in: stop the reply, keep the conversation open.
            streamAbortRef.current?.abort();
            cancelSpeak();
            voiceStateRef.current = 'listening';
            setVoiceState('listening');
            return;
          }
          if (voiceState === 'processing') {
            // Escape hatch: cancel a stuck request instead of ignoring the
            // tap — with no fetch timeout a hung network otherwise left the
            // UI stranded at 'Thinking…'.
            streamAbortRef.current?.abort();
            cancelSpeak();
            voiceStateRef.current = 'listening';
            setVoiceState('listening');
            return;
          }
          endHandsFree();
          return;
        }

        if (voiceState === 'speaking') {
          // Interrupt: stop both the audio AND the underlying reply stream,
          // so a superseded turn can't keep mutating the conversation.
          streamAbortRef.current?.abort();
          cancelSpeak();
          // Flow straight into listening (e.g. tapping during the greeting)
          // instead of resting at idle and needing a second tap.
          if (realtime.supported && realtimeEnabledRef.current) {
            startHandsFree();
          } else {
            voiceStateRef.current = 'idle';
            setVoiceState('idle');
          }
          return;
        }
        if (voiceState === 'processing') {
          // Same escape hatch on the tap-to-talk path.
          streamAbortRef.current?.abort();
          cancelSpeak();
          voiceStateRef.current = 'idle';
          setVoiceState('idle');
          return;
        }

        // Prefer the hands-free realtime path; fall back to tap-to-talk if
        // it's unsupported here or already failed once this visit.
        if (voiceState === 'idle' && realtime.supported && realtimeEnabledRef.current) {
          startHandsFree();
          return;
        }

        if (voiceState === 'listening') {
          // Manual stop. Native SR fires onFinal synchronously; Whisper path
          // needs a network round-trip, so move to processing right away.
          if (useRecorderFallback) {
            setInterimText('');
            setVoiceState('processing');
          }
          stopRec();
          return;
        }

        setVoiceState('listening');
        setInterimText('');
        setTranscribing(false);
        setMicBlocked(false);
        setError(null);

        startRec(
          (interim) => setInterimText(interim),
          (final) => {
            setInterimText('');
            setTranscribing(false);
            if (final.trim()) sendToClaude(final.trim());
            else setVoiceState('idle');
          },
          (err) => {
            let msg;
            const blocked = err === 'not-allowed' || err === 'service-not-allowed';
            // Native SpeechRecognition that exists but doesn't work: dead
            // engines (in-app iOS browsers — caught by the start watchdog)
            // and un-keyed Chromium builds like Brave ('network' on every
            // start). The MediaRecorder → Whisper path works on those, so
            // demote to it instead of dead-ending voice.
            const srBroken = (err === 'start-failed' || err === 'network' || err === 'not-supported');
            if (blocked) {
              msg = 'Microphone blocked. Tap the lock/site icon in the address bar to allow it, then try again.';
              setMicBlocked(true);
            } else if (err === 'no-mic') {
              msg = 'No microphone detected on this device.';
            } else if (srBroken && !useRecorderFallback && recorderSTT.supported) {
              setForceRecorder(true);
              msg = 'Switched to a compatible voice mode — tap the mic to try again.';
            } else if (err === 'not-supported' || err === 'start-failed' || err === 'network' || err === 'recorder-failed') {
              msg = 'Voice not supported in this browser. Use the text input below.';
            } else if (err === 'stt-failed') {
              msg = 'Could not transcribe audio. Try again or use the text input.';
            } else {
              msg = `Speech error: ${err}`;
            }
            setError(msg);
            setInterimText('');
            setTranscribing(false);
            setVoiceState('idle');
            // Non-permission errors auto-clear; permission errors persist
            // via micBlocked banner until the user resolves them.
            if (!blocked) setTimeout(() => setError(null), 6000);
          },
          // onProcessing — fires when recorder stops and transcription begins
          // (Whisper path only; native SR returns final synchronously).
          () => {
            setInterimText('');
            setTranscribing(true);
            setVoiceState('processing');
          }
        );
      };

      const handleTextSubmit = (e) => {
        e.preventDefault();
        // Typing is always available — during 'speaking' it acts as a
        // barge-in (sendToClaude aborts the old stream and audio), so a
        // tester can interrupt the ~30s greeting without granting mic
        // access. Previously the composer was locked for the whole reply.
        if (!textInput.trim()) return;
        if (voiceState === 'listening') {
          // User switched to typing mid-listen. Tap-to-talk: drop the mic
          // session so its silence timer can't fire a second, competing
          // message. Hands-free: the session stays open — they can keep
          // talking after this typed turn, but any half-captured utterance
          // is discarded so its late transcription can't cancel this
          // message's reply.
          if (!handsFreeRef.current) {
            abortRec();
          } else if (userSpeakingRef.current || interimText) {
            realtime.clearInput();
            suppressTurnRef.current = Date.now() + 3000;
            userSpeakingRef.current = false;
          }
          setInterimText('');
        }
        cancelSpeak();
        sendToClaude(textInput.trim());
        setTextInput('');
      };

      const handleSwitchMode = (pathId) => {
        setShowModeMenu(false);
        setShowBasecamp(false);
        const path = NEXT_STEPS.find(p => p.id === pathId);
        if (!path || !profile) return;
        if (profile.path === pathId) return;
        stopVoicePipeline();
        const nextProfile = { ...profile, mode: path.mode, goal: path.goal, path: path.id };
        setProfile(nextProfile);
        profileRef.current = nextProfile;
        saveProfile(nextProfile);
        const greeting = buildGreeting(nextProfile);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
      };

      const handleNewChat = () => {
        stopVoicePipeline();
        // Start a new conversation (profile persists, no need to redo quiz)
        if (profile) {
          const greeting = buildGreeting(profile);
          startNewConversation([{ role: 'assistant', content: greeting }]);
          setVoiceState('idle');
          setInterimText('');
          setTextInput('');
          setError(null);
          setShowHistory(false);
        } else {
          // No profile — go back to quiz
          setMessages([]);
          setActiveConvoId(null);
          saveToStorage(STORAGE_KEYS.activeId, null);
          setVoiceState('idle');
          setInterimText('');
          setTextInput('');
          setError(null);
          setStarted(false);
          setShowHistory(false);
        }
      };

      // ── A/B Source of Truth variant switching ──
      // Default = fresh session (clean A/B). The dev-only keep-transcript
      // override is safe because the prompt is rebuilt every turn anyway.
      const handleVariantSwitch = (key) => {
        if (!SOT_VARIANTS[key] || key === sotVariantRef.current) return;
        if (devKeepTranscript) {
          sotVariantRef.current = key;
          setSotVariant(key);
          saveToStorage(STORAGE_KEYS.sotVariant, key);
          return;
        }
        const hasUserTurn = messagesRef.current.some(m => m.role === 'user');
        if (hasUserTurn && !window.confirm('Switch to Version ' + key + '? This starts a fresh conversation.')) return;
        stopVoicePipeline();
        sotVariantRef.current = key;
        setSotVariant(key);
        saveToStorage(STORAGE_KEYS.sotVariant, key);
        const greeting = buildGreeting(profileRef.current);
        startNewConversation([{ role: 'assistant', content: greeting }]);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
      };

      // ── Transcript export (dev panel) ──
      const buildTranscriptExport = () => {
        const v = sotVariantRef.current;
        const header = [
          '=== Feel Understood Sandbox transcript ===',
          'variant: ' + v + ' (' + (SOT_VARIANTS[v]?.name || 'unknown') + ')',
          'sandbox: ' + SANDBOX_VERSION,
          'voice stack: ' + VOICE_STACK,
          'model: ' + CHAT_MODEL,
          'exported: ' + new Date().toISOString(),
          '==========================================',
          '',
        ].join('\n');
        const body = messagesRef.current.map(m => {
          const who = m.role === 'user' ? 'USER' : 'COACH';
          const text = m.visual ? m.content + '\n[VISUAL]\n' + m.visual : m.content;
          return who + ': ' + text;
        }).join('\n\n');
        return header + body;
      };

      const copyTranscript = async () => {
        const text = buildTranscriptExport();
        let ok = false;
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (e) {
          // Clipboard API can be unavailable/denied — textarea fallback.
          try {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            ok = document.execCommand('copy');
            document.body.removeChild(ta);
          } catch (e2) {}
        }
        if (ok) {
          setDevCopied(true);
          setTimeout(() => setDevCopied(false), 2000);
        }
      };

      const handleStartOver = () => {
        // Full reset means full reset: the gate promises "conversations are
        // stored only on this device", so handing the device to the next
        // tester must not leave the previous tester's coaching sessions
        // readable in the history drawer.
        if (!window.confirm('This clears your profile and all conversations on this device. Continue?')) return;
        stopVoicePipeline();
        setProfile(null);
        profileRef.current = null;
        saveProfile(null);
        setMessages([]);
        setActiveConvoId(null);
        saveToStorage(STORAGE_KEYS.activeId, null);
        saveToStorage(STORAGE_KEYS.appMode, null);
        saveToStorage(STORAGE_KEYS.conversations, []);
        setConversations([]);
        setAppMode(SANDBOX ? 'beta' : null);
        if (SANDBOX) setGatePassed(false);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
        setStarted(false);
        setShowHistory(false);
      };

      const handleLoadConversation = (convo) => {
        stopVoicePipeline();
        // Restore the mode this conversation was held under — resuming a
        // facilitator session must not continue with the coach prompt (or
        // vice versa) just because the user switched modes since.
        if (convo.mode && profile && (convo.mode !== profile.mode || convo.path !== profile.path)) {
          const restored = { ...profile, mode: convo.mode, goal: convo.goal ?? null, path: convo.path || profile.path };
          setProfile(restored);
          profileRef.current = restored;
          saveProfile(restored);
        }
        setActiveConvoId(convo.id);
        activeConvoIdRef.current = convo.id;
        setMessages(convo.messages);
        saveToStorage(STORAGE_KEYS.activeId, convo.id);
        setVoiceState('idle');
        setInterimText('');
        setTextInput('');
        setError(null);
        setShowHistory(false);
        setStarted(true);
      };

      const handleDeleteConversation = (e, id) => {
        e.stopPropagation();
        // Deletion is permanent (localStorage only) and the button sits
        // inside the tappable row — confirm so a stray tap can't silently
        // destroy a conversation.
        if (!window.confirm('Delete this conversation?')) return;
        const remaining = deleteConversation(id);
        setConversations(remaining);
        if (id === activeConvoId) {
          if (remaining.length > 0) {
            handleLoadConversation(remaining[0]);
          } else {
            handleNewChat();
          }
        }
      };

      // ── Sandbox dev panel ──
      // Reuses the hidden '· dev ·' link pattern from the Landing Gate.
      // Shows the A/B → variant mapping (this is where the blind lifts),
      // stack/model ids, per-variant prompt sizes (Deep should read ≈30k
      // characters heavier than Light — the instant splice sanity check),
      // and the cache readout from the last turn.
      const renderDevPanel = () => {
        if (!SANDBOX || !showDevPanel) return null;
        const p = profileRef.current;
        let lenA = null, lenB = null;
        try {
          lenA = SOT_VARIANTS.A.build(p).length;
          lenB = SOT_VARIANTS.B.build(p).length;
        } catch (e) {}
        const u = lastUsage;
        const row = (label, value) => React.createElement('p', { key: label },
          React.createElement('strong', null, label + ': '), value);
        return React.createElement('div', { className: 'info-screen' },
          React.createElement('button', {
            className: 'info-close',
            onClick: () => setShowDevPanel(false),
            'aria-label': 'Close dev panel',
          },
            React.createElement('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
              React.createElement('line', { x1: 18, y1: 6, x2: 6, y2: 18 }),
              React.createElement('line', { x1: 6, y1: 6, x2: 18, y2: 18 }),
            )
          ),
          React.createElement('div', { className: 'info-inner' },
            React.createElement('div', { className: 'info-eyebrow' }, 'Dev'),
            React.createElement('h1', { className: 'info-title' }, 'Sandbox rig'),
            React.createElement('div', { className: 'info-card dev-card' },
              row('Sandbox', SANDBOX_VERSION),
              row('Mapping', 'A → light (live prompt, verbatim) · B → deep (SoT V2 splice)'),
              row('Active variant', sotVariant + ' → ' + (SOT_VARIANTS[sotVariant]?.name || '?')),
              row('Voice stack', VOICE_STACK + ' (SpeechRecognition / /api/stt → /api/chat-stream → /api/tts tts-1 shimmer)'),
              row('Model', CHAT_MODEL),
              row('Prompt chars', lenA === null ? 'unavailable'
                : 'A (light) ' + lenA.toLocaleString()
                  + ' · B (deep) ' + lenB.toLocaleString()
                  + ' · Δ +' + (lenB - lenA).toLocaleString()
                  + (p ? '' : ' (no profile yet — base prompt only)')),
              row('Cache (last turn)', u
                ? 'creation ' + (u.cache_creation_input_tokens ?? 0)
                  + ' · read ' + (u.cache_read_input_tokens ?? 0)
                  + ' · input ' + (u.input_tokens ?? '—')
                : 'no turns yet — also logged server-side per turn'),
            ),
            React.createElement('label', { className: 'dev-keep' },
              React.createElement('input', {
                type: 'checkbox',
                checked: devKeepTranscript,
                onChange: (e) => setDevKeepTranscript(e.target.checked),
              }),
              ' Keep transcript when switching variant (dev only — never the default; the prompt is rebuilt every turn)'

          React.createElement('div', { ref: chatEndRef })
        ),

        // Error
        error && React.createElement('div', { className: 'error-bar' }, error),

        // Controls
        React.createElement('footer', { className: 'controls' },
          // Mic area
          React.createElement('div', { className: 'mic-area' },
            voiceState === 'listening' && React.createElement(WaveVisualizer, {
              getLevel: handsFree
                ? realtime.getLevel
                : (useRecorderFallback ? recorderSTT.getLevel : null),
            }),
            React.createElement('button', {
              className: `mic-btn ${voiceState}`,
              onClick: handleMicClick,
              'aria-label': statusLabel,
            },
              voiceState === 'speaking'
                ? React.createElement('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('rect', { x: 6, y: 6, width: 12, height: 12, rx: 2 })
                  )
                : React.createElement('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                    React.createElement('rect', { x: 9, y: 2, width: 6, height: 12, rx: 3 }),
                    React.createElement('path', { d: 'M5 11a7 7 0 0 0 14 0' }),
                    React.createElement('line', { x1: 12, y1: 18, x2: 12, y2: 22 }),
                    React.createElement('line', { x1: 9, y1: 22, x2: 15, y2: 22 })
                  )
            ),
            React.createElement('span', { className: 'mic-label' }, statusLabel),
          ),

          // Text input
          React.createElement('form', { className: 'text-form', onSubmit: handleTextSubmit },
            React.createElement('input', {
              ref: inputRef,
              type: 'text',
              value: textInput,
              onChange: (e) => setTextInput(e.target.value),
              placeholder: profile?.mode === 'facilitator' ? 'Sarah: ... or Mark: ...' : 'Or type here...',
              className: 'text-input',
            }),
            React.createElement('button', {
              type: 'submit',
              disabled: !textInput.trim(),
              className: `send-btn ${textInput.trim() ? 'active' : ''}`,
            },
              React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
                React.createElement('line', { x1: 5, y1: 12, x2: 19, y2: 12 }),
                React.createElement('polyline', { points: '12 5 19 12 12 19' })
              )
            )
          ),

          !sttSupported && React.createElement('p', { className: 'browser-warn' },
            'Voice not supported in this browser. Type below instead.'
          ),

          // Version label
          React.createElement('p', { className: 'version-label' }, SANDBOX_VERSION)
        )
      );
    };

    // ── Service Worker: DISABLED in the sandbox ──
    // Stale-cache confusion mid-test is the classic time thief. Any worker
    // left over from a previous deploy on this origin is unregistered.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations()
          .then((regs) => regs.forEach((r) => r.unregister()))
          .catch(() => {});
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
